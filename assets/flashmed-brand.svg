<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">FlashMed — By Larissa Fernandes</title><desc id="desc">Identidade visual médica em vidro violeta luminoso, livro aberto e símbolo médico.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#593766"/><stop offset=".5" stop-color="#3b244b"/><stop offset="1" stop-color="#281833"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6a4ef" stop-opacity=".38"/><stop offset=".42" stop-color="#5c3a72" stop-opacity=".22"/><stop offset="1" stop-color="#b57bdd" stop-opacity=".18"/></linearGradient>
