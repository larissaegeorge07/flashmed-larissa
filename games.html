function memoryDeck(source){
 const seen=new Set(),answers=new Set(),out=[];
 for(const x of source.filter(x=>x.kind==='cards')){
  const question=clean(x.question),answer=clean(x.answer),key=question.toLocaleLowerCase('pt-BR')+'|'+answer.toLocaleLowerCase('pt-BR');
  if(question.length<5||question.length>68||answer.length<2||answer.length>48||seen.has(key)||answers.has(answer.toLocaleLowerCase('pt-BR')))continue;
  seen.add(key);answers.add(answer.toLocaleLowerCase('pt-BR'));out.push({...x,question,answer});
 }

function next(){clearInterval(timer);questionResolved=false;if(round>=deck.length){finish();return}let q=deck[round];shell(mode==='wheel'?'🎡 Roleta Médica':mode==='review'?'📌 Revisar dificuldades':'⚡ Quiz Relâmpago');if(mode==='wheel'){$('stage').innerHTML='<div style="text-align:center;padding:30px"><div id="wheelIcon" class="wheel-disk"><span>🎡</span></div><h2>Pronta para o próximo desafio?</h2><button class="btn" onclick="spin()">Girar roleta</button></div>';return}renderQuestion(q)}

function renderQuestion(q){seconds=mode==='quiz'&&quizVariant==='rapid'?15:mode==='quiz'&&quizVariant==='challenge'?30:20;let alternatives=[...new Set(items.filter(x=>x.id!==q.id&&x.area===q.area&&x.answer!==q.answer&&x.answer.length<=90).map(x=>x.answer))];if(alternatives.length<2)alternatives=[...new Set(items.filter(x=>x.id!==q.id&&x.answer!==q.answer&&x.answer.length<=90).map(x=>x.answer))];let options=shuffle([q.answer,...shuffle(alternatives).slice(0,3)]);if(options.length<2){$('stage').innerHTML=(q.ownImage?'<img class="student-flashcard-image" src="'+q.ownImage+'" alt="Imagem do seu flashcard">':'')+'<h2 class="question-title">'+esc(q.question)+'</h2><button class="btn" onclick="showFlashAnswer()">Mostrar resposta</button>';return}let correct=options.indexOf(q.answer);$('stage').innerHTML='<div class="row" style="justify-content:space-between"><span class="round-info">🎯 Rodada '+(round+1)+' de '+deck.length+'</span><span class="score-badge" id="clock">'+(mode==='quiz'&&quizVariant==='training'?'Sem cronômetro':'⏱️ '+seconds+'s')+'</span></div><h2 class="question-title">'+esc(q.question)+'</h2><div class="choices">'+options.map((v,i)=>'<button class="choice" data-i="'+i+'" onclick="answer('+i+','+correct+')"><span class="option-letter">'+String.fromCharCode(65+i)+'</span>'+esc(v)+'</button>').join('')+'</div><div id="feedback"></div>';if(!(mode==='quiz'&&quizVariant==='training'))timer=setInterval(()=>{seconds--;if($('clock'))$('clock').textContent='⏱️ '+seconds+'s';if(seconds<=0){clearInterval(timer);answer(-1,correct)}},1000)}
function showFlashAnswer(){if(questionResolved)return;questionResolved=true;let q=deck[round];$('stage').innerHTML='<div class="feedback"><h2>'+esc(q.answer)+'</h2><button class="btn" onclick="markHard()">Preciso revisar 📌</button> <button class="btn ghost" onclick="saveDifficulty(deck[round],false);round++;next()">Já sabia →</button></div>'}
function answer(i,correct){if(questionResolved)return;questionResolved=true;clearInterval(timer);let q=deck[round],ok=i===correct;if(ok)score++;saveDifficulty(q,!ok);if(!ok)gameMistakes.push(q);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.i===correct)b.classList.add('good');else if(+b.dataset.i===i)b.classList.add('bad')});$('feedback').innerHTML='<div class="feedback"><b>'+(ok?'✅ Correto!':'💡 Resposta correta: '+esc(q.answer))+'</b><p>'+esc(q.tip||'')+'</p><button class="btn" onclick="round++;next()">Continuar →</button></div>'}
function makePairs(){
 const n=Math.min(5,deck.length);deck=deck.slice(0,n);
 const cards=shuffle(deck.flatMap((q,i)=>[
  {id:i+'q',pair:i,type:q.ownImage?'picture':'question',text:q.question,ownImage:q.ownImage},
  {id:i+'a',pair:i,type:'answer',text:q.answer}
 ]));
 window.pairCards=cards;open=[];locked=false;pairMisses=new Set();pairAttempts=0;
 shell(mode==='memory'?'🧠 Memória Médica':'🧩 Combinar Pares');
 const memory=mode==='memory';
 $('stage').innerHTML='<p class="muted">'+(memory?'Encontre os 5 pares dos seus flashcards. Só aparecem imagens que você mesma adicionou aos cartões.':'Associe perguntas e respostas dos seus flashcards.')+'</p><div class="'+(memory?'board memory-board':'choices')+'">'+cards.map((c,i)=>memory
 ?'<button class="pair memory" id="pair'+i+'" aria-label="Virar carta '+(i+1)+'" aria-pressed="false" onclick="pick('+i+')"><span class="card-inner"><span class="card-face card-back"><span class="card-symbol">🧠</span><small>FLASHMED</small></span><span class="card-face card-front '+(c.type==='picture'?'picture-card':c.type==='question'?'question-card':'answer-card')+'">'+(c.type==='picture'?'<img class="student-flashcard-image" src="'+c.ownImage+'" alt="Imagem do flashcard original" loading="lazy">':'<span class="memory-answer">'+esc(c.text)+'</span>')+'</span></span></button>'
 :'<button class="pair" id="pair'+i+'" onclick="pick('+i+')">'+(c.type==='picture'?'<img class="student-flashcard-image" src="'+c.ownImage+'" alt="Imagem do flashcard original">':'<span>'+esc(c.text)+'</span>')+'</button>').join('')+'</div><p class="photo-credit">'+window.gameRotationNotice+'</p><div id="feedback" aria-live="polite"></div>';
}
function pick(i){if(locked||matched.has(i)||open.includes(i))return;const c=window.pairCards[i],b=$('pair'+i);if(!b)return;if(mode==='memory'){b.classList.add('is-flipped');b.setAttribute('aria-pressed','true');b.setAttribute('aria-label',c.text)}else{b.classList.add('selected')}open.push(i);if(open.length<2)return;pairAttempts++;const [a,d]=open,good=window.pairCards[a].pair===window.pairCards[d].pair;if(good){score++;const original=deck[window.pairCards[a].pair];saveDifficulty(original,pairMisses.has(window.pairCards[a].pair));if(pairMisses.has(window.pairCards[a].pair))gameMistakes.push(original);matched.add(a);matched.add(d);[a,d].forEach(j=>{const el=$('pair'+j);el.classList.remove('selected');el.classList.add('done');el.disabled=true});$('feedback').innerHTML='<div class="feedback"><span class="game-toast">✨ Par encontrado! +1 ⭐</span></div>';open=[];if(matched.size===window.pairCards.length)setTimeout(()=>{if((mode==='memory'||mode==='pairs')&&matched.size===window.pairCards.length)finish()},650)}else{pairMisses.add(window.pairCards[a].pair);pairMisses.add(window.pairCards[d].pair);locked=true;$('feedback').innerHTML='<div class="feedback">💜 Tente outra combinação!</div>';setTimeout(()=>{[a,d].forEach(j=>{let x=$('pair'+j);if(!x)return;x.classList.remove('selected');if(mode==='memory'){x.classList.remove('is-flipped');x.setAttribute('aria-pressed','false');x.setAttribute('aria-label','Virar carta '+(j+1))}});open=[];locked=false;$('feedback').innerHTML=''},1050)}}
function finish(){
 clearInterval(timer);const data=storeGet(STATS_KEY);data.sessions=data.sessions||[];data.sessions.push({mode,score,total:deck.length,at:Date.now(),seconds:Math.round((Date.now()-startedAt)/1000)});data.sessions=data.sessions.slice(-500);storeSet(STATS_KEY,data);const total=deck.length;shell('🏆 Partida concluída');
 const errors=[...new Map(gameMistakes.map(x=>[cardSignature(x),x])).values()];
 const recap=errors.length?'<div class="game-recap"><h3>📌 Para reforçar ('+errors.length+')</h3>'+errors.map(x=>'<div class="recap-card"><b>'+esc(x.question)+'</b><p>'+esc(x.answer)+'</p></div>').join('')+'</div>':'<p class="muted">✨ Nenhuma dificuldade registrada nesta partida!</p>';
 $('stage').innerHTML='<div class="finish-card"><div class="finish-medal">🏆</div><h2>Você concluiu a partida!</h2><h1>'+score+' / '+total+'</h1>'+(mode==='memory'||mode==='pairs'?'<p>'+pairAttempts+' tentativas</p>':'')+'<p class="muted">Os resultados deste módulo não alteram as estatísticas oficiais das provas. '+(window.gameRotationNotice||'')+'</p>'+recap+'<div class="row" style="justify-content:center"><button class="btn" onclick="'+(mode==='review'?'reviewMistakes()':'start(\''+mode+'\')')+'">Nova partida</button><button class="btn ghost" onclick="back()">Outros jogos</button></div></div>';
}
$('area').onchange=refresh;$('source').onchange=refresh;$('count').onchange=refresh;load();
</script></body></html>
