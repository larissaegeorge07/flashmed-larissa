function compactPairs(source){
 const result=[],seen=new Set(),answers=new Set();
 for(const x of shuffle(source.filter(x=>x.kind==='cards'))){
  const q=clean(x.question),a=clean(x.answer),key=q.toLocaleLowerCase('pt-BR')+'|'+a.toLocaleLowerCase('pt-BR');
  if(q.length<5||q.length>68||a.length<3||a.length>68||seen.has(key)||answers.has(a.toLocaleLowerCase('pt-BR')))continue;
  seen.add(key);answers.add(a.toLocaleLowerCase('pt-BR'));result.push({...x,question:q,answer:a,icon:'🩺',art:artKey(x)});
 }
 return result;
}

function load(){
 try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}
 items=(db.cards||[]).filter(c=>c.front&&c.back).map(c=>({id:String(c.id),kind:'cards',area:c.subject||'Geral',question:clean(c.front),answer:clean(c.back),tip:'Revisão de flashcard',wrong:(c.bad||0)>(c.ok||0)}));
 const areas=[...new Set(items.map(x=>x.area))].sort(),previous=$('area').value;
 $('area').innerHTML='<option value="">Todas</option>'+areas.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
 if(areas.includes(previous))$('area').value=previous;
 refresh();
}

function refresh(){
 const a=$('area').value,s=$('source').value;
 pool=items.filter(x=>(!a||x.area===a)&&(s!=='wrong'||x.wrong));
 const compact=compactPairs(pool).length;
 $('status').textContent=pool.length+' flashcards disponíveis • '+compact+' associações curtas para Memória e Combinar Pares. Novos flashcards entram automaticamente após sincronizar e reabrir esta aba.';
 renderHome();
}

function renderHome(){const games=[['quiz','⚡','Quiz Relâmpago','Perguntas dos seus flashcards, cronômetro e pontos'],['pairs','🧩','Combinar Pares','Ligue pergunta e resposta'],['wheel','🎡','Roleta Médica','Sorteie um desafio dos seus flashcards'],['memory','🧠','Memória Médica','Encontre cartas correspondentes']];$('home').innerHTML=games.map(g=>'<button class="tile" onclick="start(\''+g[0]+'\')"><span class="emoji">'+g[1]+'</span><b>'+g[2]+'</b><span class="muted">'+g[3]+'</span><span class="play-cta">Jogar agora →</span></button>').join('')}
function start(m){mode=m;score=0;round=0;selected=null;matched=new Set();clearInterval(timer);const base=m==='pairs'||m==='memory'?compactPairs(pool):pool.filter(x=>x.kind==='cards');if(!base.length){alert('Não há conteúdos compatíveis com este jogo e estes filtros. Escolha outra fonte.');return}deck=shuffle(base).slice(0,Math.min(+$('count').value,base.length));$('home').classList.add('hidden');$('play').classList.remove('hidden');if(m==='memory'||m==='pairs')makePairs();else next()}
function back(){clearInterval(timer);$('play').classList.add('hidden');$('home').classList.remove('hidden');refresh()}
function shell(title){$('play').innerHTML='<div class="game-top"><button class="btn ghost" onclick="back()">← Jogos</button><span class="game-label">'+title+'</span><span class="score-badge">⭐ '+score+'</span></div><div class="bar" style="margin:18px 0"><i style="width:'+Math.round(round/Math.max(deck.length,1)*100)+'%"></i></div><div id="stage"></div>'}
function next(){clearInterval(timer);if(round>=deck.length){finish();return}let q=deck[round];shell(mode==='wheel'?'🎡 Roleta Médica':'⚡ Quiz Relâmpago');if(mode==='wheel'){$('stage').innerHTML='<div style="text-align:center;padding:30px"><div id="wheelIcon" class="wheel-disk"><span>🎡</span></div><h2>Pronta para o próximo desafio?</h2><button class="btn" onclick="spin()">Girar roleta</button></div>';return}renderQuestion(q)}
function spin(){let e=$('wheelIcon');e.classList.add('spinning');setTimeout(()=>renderQuestion(deck[round]),1250)}
function renderQuestion(q){seconds=20;let alternatives=[...new Set(items.filter(x=>x.id!==q.id&&x.area===q.area&&x.answer!==q.answer&&x.answer.length<=90).map(x=>x.answer))];if(alternatives.length<2)alternatives=[...new Set(items.filter(x=>x.id!==q.id&&x.answer!==q.answer&&x.answer.length<=90).map(x=>x.answer))];let options=shuffle([q.answer,...shuffle(alternatives).slice(0,3)]);if(options.length<2){$('stage').innerHTML='<h2 class="question-title">'+esc(q.question)+'</h2><button class="btn" onclick="showFlashAnswer()">Mostrar resposta</button>';return}let correct=options.indexOf(q.answer);$('stage').innerHTML='<div class="row" style="justify-content:space-between"><span class="round-info">🎯 Rodada '+(round+1)+' de '+deck.length+'</span><span class="score-badge" id="clock">⏱️ '+seconds+'s</span></div><h2 class="question-title">'+esc(q.question)+'</h2><div class="choices">'+options.map((v,i)=>'<button class="choice" data-i="'+i+'" onclick="answer('+i+','+correct+')"><span class="option-letter">'+String.fromCharCode(65+i)+'</span>'+esc(v)+'</button>').join('')+'</div><div id="feedback"></div>';timer=setInterval(()=>{seconds--;if($('clock'))$('clock').textContent='⏱️ '+seconds+'s';if(seconds<=0){clearInterval(timer);answer(-1,correct)}},1000)}
function showFlashAnswer(){let q=deck[round];$('stage').innerHTML='<div class="feedback"><h2>'+esc(q.answer)+'</h2><button class="btn" onclick="round++;next()">Continuar →</button></div>'}
function answer(i,correct){clearInterval(timer);let q=deck[round],ok=i===correct;if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.i===correct)b.classList.add('good');else if(+b.dataset.i===i)b.classList.add('bad')});$('feedback').innerHTML='<div class="feedback"><b>'+(ok?'✅ Correto!':'💡 Resposta correta: '+esc(q.answer))+'</b><p>'+esc(q.tip||'')+'</p><button class="btn" onclick="round++;next()">Continuar →</button></div>'}
function makePairs(){const n=Math.min(mode==='memory'?4:5,deck.length);deck=deck.slice(0,n);const cards=shuffle(deck.flatMap((q,i)=>[{id:i+'q',pair:i,text:q.question,icon:q.icon||'🩺',art:q.art||artKey(q)},{id:i+'a',pair:i,text:q.answer,icon:'💡'}]));window.pairCards=cards;open=[];locked=false;shell(mode==='memory'?'🧠 Memória Médica':'🧩 Combinar Pares');$('stage').innerHTML='<p class="muted">'+(mode==='memory'?'Vire duas cartas e descubra as associações.':'Selecione uma pista e a resposta correspondente.')+'</p><div class="'+(mode==='memory'?'board':'choices')+'">'+cards.map((c,i)=>mode==='memory'?'<button class="pair memory" id="pair'+i+'" aria-label="Virar carta '+(i+1)+'" aria-pressed="false" onclick="pick('+i+')"><span class="card-inner"><span class="card-face card-back"><span class="card-symbol">🧠</span><small>FLASHMED</small></span><span class="card-face card-front"><span class="pair-icon">'+c.icon+'</span><span>'+esc(c.text)+'</span></span></span></button>':'<button class="pair" id="pair'+i+'" onclick="pick('+i+')"><span class="pair-icon">'+c.icon+'</span><span>'+esc(c.text)+'</span></button>').join('')+'</div><div id="feedback" aria-live="polite"></div>'}
function pick(i){if(locked||matched.has(i)||open.includes(i))return;const c=window.pairCards[i],b=$('pair'+i);if(!b)return;if(mode==='memory'){b.classList.add('is-flipped');b.setAttribute('aria-pressed','true');b.setAttribute('aria-label',c.text)}else{b.classList.add('selected')}open.push(i);if(open.length<2)return;const [a,d]=open,good=window.pairCards[a].pair===window.pairCards[d].pair;if(good){score++;matched.add(a);matched.add(d);[a,d].forEach(j=>{const el=$('pair'+j);el.classList.remove('selected');el.classList.add('done');el.disabled=true});$('feedback').innerHTML='<div class="feedback"><span class="game-toast">✨ Par encontrado! +1 ⭐</span></div>';open=[];if(matched.size===window.pairCards.length)setTimeout(()=>{if(mode==='memory'||mode==='pairs')finish()},650)}else{locked=true;$('feedback').innerHTML='<div class="feedback">💜 Tente outra combinação!</div>';setTimeout(()=>{[a,d].forEach(j=>{let x=$('pair'+j);if(!x)return;x.classList.remove('selected');if(mode==='memory'){x.classList.remove('is-flipped');x.setAttribute('aria-pressed','false');x.setAttribute('aria-label','Virar carta '+(j+1))}});open=[];locked=false;$('feedback').innerHTML=''},1050)}}
function finish(){clearInterval(timer);const total=mode==='memory'||mode==='pairs'?deck.length:deck.length;shell('🏆 Partida concluída');$('stage').innerHTML='<div class="finish-card"><div class="finish-medal">🏆</div><h2>Você concluiu a partida!</h2><h1>'+score+' / '+total+'</h1><p class="muted">Os resultados deste módulo experimental não alteram as estatísticas oficiais das provas.</p><div class="row" style="justify-content:center"><button class="btn" onclick="start(\''+mode+'\')">Jogar novamente</button><button class="btn ghost" onclick="back()">Outros jogos</button></div></div>'}
$('area').onchange=refresh;$('source').onchange=refresh;$('count').onchange=refresh;load();
</script></body></html>
