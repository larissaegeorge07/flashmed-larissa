<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashMed Games</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#502b43;background:#fff6fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#ffe1ef,transparent 45%),#fff6fb}.wrap{max-width:1060px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{color:#a92d73;margin:10px 0}h2{margin:8px 0}.muted{color:#8b7080}.panel,.tile{background:#fff;border:1px solid #f1d8e6;border-radius:22px;padding:22px;box-shadow:0 10px 26px #8d376012}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.tile{text-align:left;cursor:pointer;transition:transform .15s,border .15s}.tile:hover{transform:translateY(-3px);border-color:#df73ac}.tile b{display:block;font-size:20px;margin:9px 0}.emoji{font-size:42px}button,select{font:inherit}button{cursor:pointer}.btn{background:#cf478d;border:0;border-radius:13px;padding:12px 18px;color:#fff;font-weight:750}.ghost{background:#fff0f7;color:#87355d;border:1px solid #edc4d9}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.choice{background:#fff;border:2px solid #e9c3d7;color:#583047;text-align:left;padding:17px;border-radius:16px;min-height:75px;font-weight:700}.choice:hover:not(:disabled){border-color:#d14c91;background:#fff1f8}.choice.good{border-color:#32a477;background:#e6f8ef}.choice.bad{border-color:#d95466;background:#fff0f0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bar{height:10px;background:#f4d9e6;border-radius:20px;overflow:hidden}.bar i{display:block;background:#d34a91;height:100%;transition:width .2s}.pair{background:#fff;border:2px solid #efcfe0;border-radius:14px;padding:14px;min-height:80px}.pair.selected{border-color:#c33b83;background:#ffebf5}.pair.done{border-color:#35a77c;background:#e7f8ef;opacity:.7}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.memory{min-height:90px;font-size:16px;overflow-wrap:anywhere}.feedback{background:#fff1f7;border-radius:15px;padding:16px;margin-top:16px}.hidden{display:none}select{border:1px solid #e7bdd4;padding:10px;border-radius:12px;background:white;max-width:100%}@media(max-width:550px){.wrap{padding:14px}.board{grid-template-columns:repeat(3,1fr)}.panel{padding:16px}.memory{min-height:78px;font-size:13px}}html.embedded .wrap{max-width:none;padding:16px}html.embedded header{display:none}html.embedded body{background:transparent}
/* FlashMed Arcade v2 — original interface, responsive and accessible */
:root{--violet:#7545c5;--pink:#e34f9c;--ink:#4c2b46;--soft:#fff6fb}
body{color:var(--ink);background:radial-gradient(circle at 10% 10%,#f9e4ff,transparent 30%),radial-gradient(circle at 90% 15%,#ffe3ee,transparent 35%),#fff7fb}
.wrap{max-width:1160px}.panel{border:1px solid #efd8e9;box-shadow:0 15px 45px #8d376014}
.arcade-hero{position:relative;overflow:hidden;border-radius:27px;padding:30px 34px;margin:18px 0;background:linear-gradient(125deg,#9b4cc9,#d94e9a 65%,#f586ac);color:white;box-shadow:0 15px 40px #a94e9930}
.arcade-hero:after{content:'✦  ✧  ✦';position:absolute;right:22px;top:15px;font-size:68px;letter-spacing:20px;color:#ffffff35;transform:rotate(-14deg);pointer-events:none}
.arcade-hero h2{font-size:clamp(27px,4vw,42px);margin:8px 0;position:relative;z-index:1}.arcade-hero p{color:#fff4fc;max-width:620px;position:relative;z-index:1}.eyebrow{display:inline-block;border:1px solid #ffffff88;background:#ffffff24;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:850;letter-spacing:.12em}
.filters{margin:0 0 20px!important;background:#ffffffed}.filters .row{gap:15px}.filters label{display:grid;gap:6px;font-size:13px;font-weight:800;color:#8a4c74}.filters select{min-height:44px;font-weight:650;min-width:155px}
#status{margin-bottom:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tile{position:relative;isolation:isolate;overflow:hidden;min-height:230px;padding:25px;text-align:left;border:2px solid transparent;box-shadow:0 12px 28px #9e53831b;transition:transform .2s,box-shadow .2s,border-color .2s;background:linear-gradient(135deg,#fff,#fff0f8)}
.tile:before{content:'';position:absolute;inset:auto -30px -80px auto;width:210px;height:210px;border-radius:50%;background:#f4d4ec;z-index:-1}.tile:nth-child(2){background:linear-gradient(135deg,#fff,#f0edff)}.tile:nth-child(2):before{background:#ded6ff}.tile:nth-child(3){background:linear-gradient(135deg,#fff,#fff2df)}.tile:nth-child(3):before{background:#ffe0b0}.tile:nth-child(4){background:linear-gradient(135deg,#fff,#e8f9f5)}.tile:nth-child(4):before{background:#b9efe2}
.tile:hover,.tile:focus-visible{transform:translateY(-5px);box-shadow:0 18px 35px #a54a882d;border-color:#d873b0}.tile .emoji{display:grid;place-items:center;width:74px;height:74px;font-size:40px;border-radius:22px;background:#fff;box-shadow:0 8px 18px #8b47771a}.tile b{font-size:clamp(20px,2.5vw,26px);margin:15px 0 8px}.tile .muted{display:block;max-width:350px;line-height:1.5}.play-cta{display:inline-flex;margin-top:17px;background:#c44d93;color:#fff;padding:9px 17px;border-radius:999px;font-size:13px;font-weight:850}.tile:nth-child(2) .play-cta{background:#7652be}.tile:nth-child(3) .play-cta{background:#d48b28}.tile:nth-child(4) .play-cta{background:#288e77}
#play{min-height:550px;background:linear-gradient(180deg,#fff,#fff9fc);border-radius:27px;padding:26px}.game-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.game-label{font-size:17px;font-weight:900;color:#87375f}.score-badge{background:#fff0cc;border:1px solid #f8d88a;border-radius:999px;padding:10px 16px;font-weight:900}.bar{height:13px;background:#f3dfe9}.bar i{background:linear-gradient(90deg,#ba50b8,#ee69a3);border-radius:20px}.round-info{font-size:14px;font-weight:850;color:#8d5c7a}.question-title{font-size:clamp(19px,2.7vw,27px);line-height:1.45;max-width:900px;margin:23px 0}.choices{gap:14px}.choice{position:relative;min-height:100px;border-radius:19px;padding:20px;font-size:16px;box-shadow:0 5px 0 #f1dbe6;transition:transform .12s,box-shadow .12s}.choice:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 0 #efd1e2}.choice:disabled{cursor:default}.choice.good{box-shadow:0 4px 0 #9bd9b6}.choice.bad{box-shadow:0 4px 0 #f2b1bb}.option-letter{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:12px;border-radius:10px;background:#fce7f2;color:#a73d79;font-weight:950}.feedback{border:1px solid #f2c7df;line-height:1.55}.btn{transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}button:focus-visible,select:focus-visible{outline:3px solid #8958d9;outline-offset:3px}.pair{font-weight:750;line-height:1.4;cursor:pointer;transition:transform .18s,background .18s}.pair:hover:not(:disabled){transform:translateY(-2px);border-color:#a961c2}.pair.memory{display:grid;place-items:center;background:linear-gradient(135deg,#a952bf,#e66aa7);color:white;border:3px solid white;box-shadow:0 5px 0 #e9cde0;border-radius:19px;font-size:20px}.pair.memory.selected,.pair.memory.done{background:#fff;color:#67385b}.pair.done{cursor:default}.wheel-disk{width:min(270px,70vw);aspect-ratio:1;border-radius:50%;margin:22px auto;display:grid;place-items:center;font-size:72px;background:conic-gradient(#f47fb4 0 60deg,#9c6ad4 60deg 120deg,#ffd28e 120deg 180deg,#f47fb4 180deg 240deg,#9c6ad4 240deg 300deg,#ffd28e 300deg 360deg);border:11px solid #fff;box-shadow:0 0 0 5px #e6b2d4,0 16px 35px #a2549233}.wheel-disk span{display:grid;place-items:center;width:125px;height:125px;border-radius:50%;background:#fff;box-shadow:0 4px 20px #693a5b40}.wheel-disk.spinning{animation:wheelSpin 1.2s cubic-bezier(.12,.68,.12,1) forwards}@keyframes wheelSpin{to{transform:rotate(1800deg)}}.finish-card{text-align:center;padding:32px 15px}.finish-card h1{font-size:clamp(50px,10vw,90px);margin:8px;color:#b84d91}.finish-medal{font-size:78px;animation:popIn .5s ease-out}@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:680px){.arcade-hero{padding:24px}.grid{grid-template-columns:1fr}.tile{min-height:190px}.filters select{min-width:0;width:100%}.filters label{flex:1 1 180px}#play{padding:16px;min-height:470px}.choice{min-height:78px;padding:15px}.board{grid-template-columns:repeat(3,minmax(0,1fr))}.pair.memory{font-size:15px}.game-label{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
html.embedded .arcade-hero{margin-top:0}
.pair-icon{display:block;font-size:27px;margin-bottom:8px}.pair{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;text-align:center;overflow-wrap:anywhere;font-size:clamp(13px,1.8vw,17px);min-height:115px}.pair.memory{min-height:105px}.pair.memory .pair-icon{font-size:29px}.pair.done{opacity:.8}.pair.selected{box-shadow:0 0 0 3px #eec0dd}.pair:focus-visible{outline:3px solid #8853bd;outline-offset:2px}@media(max-width:680px){.pair{min-height:95px;padding:9px;font-size:13px}.pair-icon{font-size:23px}.pair.memory{min-height:88px}}</style></head><body><div class="wrap"><header><div><h1>🎮 FlashMed Games</h1><div class="muted">Seu banco de estudos virou diversão 💗</div></div><a class="btn ghost" href="index.html" style="text-decoration:none">← Voltar ao FlashMed</a></header><section class="arcade-hero"><span class="eyebrow">✨ APRENDA JOGANDO</span><h2>Seu conhecimento em modo jogo!</h2><p>Escolha uma modalidade, desafie sua memória e transforme as questões do FlashMed em novas conquistas.</p></section><section class="panel filters" style="margin:20px 0"><div class="row"><label>Matéria <select id="area"><option value="">Todas</option></select></label><label>Fonte <select id="source"><option value="all">Todos os flashcards</option><option value="wrong">Flashcards para reforçar</option></select></label><label>Quantidade <select id="count"><option>5</option><option selected>10</option><option>15</option></select></label></div><p class="muted" id="status">Carregando conteúdos...</p></section><section id="home" class="grid"></section><section id="play" class="panel hidden"></section></div><script>
if(new URLSearchParams(location.search).has('embedded'))document.documentElement.classList.add('embedded');const KEY='flashmed_larissa_final';let db={},items=[],pool=[],mode='',round=0,score=0,selected=null,deck=[],open=[],matched=new Set(),locked=false,timer=null,seconds=0;const $=id=>document.getElementById(id);const clean=s=>String(s??'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();const esc=s=>clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const shuffle=a=>a.slice().sort(()=>Math.random()-.5);

// Short, reviewed associations for game modes; never edits the original study bank.
const UNUSED_STARTER_MINI=[
['Pediatria','🫁','Bronquiolite','Suporte clínico','Bronquiolite: tratamento principalmente de suporte.'],
['Pediatria','🦠','Manchas de Koplik','Sarampo','Enantema típico do sarampo.'],
['Pediatria','🫀','Crise hipercianótica','Posição genupeitoral','Medida inicial na crise da tetralogia de Fallot.'],
['Pediatria','🧴','Crosta melicérica','Impetigo','Lesão clássica do impetigo não bolhoso.'],
['Pediatria','👶','RN de mãe diabética','Hipoglicemia','Monitorar glicemia após o nascimento.'],
['Pediatria','🩺','Brudzinski','Irritação meníngea','Sinal semiológico de irritação meníngea.'],
['Obstetrícia','🩸','HELLP: H','Hemólise','H significa hemolysis (hemólise).'],
['Obstetrícia','🧪','HELLP: LP','Plaquetas baixas','LP significa low platelets.'],
['Obstetrícia','⚡','Eclâmpsia','Convulsões','Convulsões associadas à pré-eclâmpsia, sem outra causa.'],
['Obstetrícia','💉','Antídoto do magnésio','Gluconato de cálcio','Usado em intoxicação por sulfato de magnésio.'],
['Obstetrícia','🩸','Placenta prévia','Sangramento indolor','Apresentação típica: sangramento vaginal sem dor.'],
['Obstetrícia','🚨','DPP','Útero doloroso','Dor e hipertonia uterina sugerem descolamento prematuro de placenta.'],
['Infectologia','🦟','Prurido anal noturno','Enterobius','Oxiuríase: prurido anal noturno.'],
['Infectologia','🦶','Penetração pela pele','Ancilostomíase','Larvas podem penetrar pela pele.'],
['Infectologia','💧','Diarreia e má absorção','Giardíase','Giardia pode causar síndrome disabsortiva.'],
['Infectologia','🐌','Contato com água doce','Esquistossomose','Cercárias penetram a pele em água contaminada.']
].map((v,i)=>({id:'mini-'+i,kind:'mini',area:v[0],icon:v[1],question:v[2],answer:v[3],tip:v[4],wrong:false}));
const short=s=>clean(s).replace(/^(assinale|considerando|sobre o caso|em relação).*/i,'').slice(0,74).trim();
function compactPairs(source){
 const result=[],seen=new Set(),answers=new Set();
 for(const x of shuffle(source.filter(x=>x.kind==='cards'))){
  const q=clean(x.question),a=clean(x.answer),key=q.toLocaleLowerCase('pt-BR')+'|'+a.toLocaleLowerCase('pt-BR');
  if(q.length<5||q.length>68||a.length<3||a.length>68||seen.has(key)||answers.has(a.toLocaleLowerCase('pt-BR')))continue;
  seen.add(key);answers.add(a.toLocaleLowerCase('pt-BR'));result.push({...x,question:q,answer:a,icon:'🩺'});
 }
 return result;
}

function load(){
 try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}
 items=(db.cards||[]).filter(c=>c.front&&c.back).map(c=>({id:String(c.id),kind:'cards',area:c.subject||'Geral',question:clean(c.front),answer:clean(c.back),tip:'Revisão de flashcard',wrong:(c.bad||0)>(c.ok||0)}));
 const areas=[...new Set(items.map(x=>x.area))].sort(),previous=$('area').value;
 $('area').innerHTML='<option value="">Todas</option>'+areas.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
 if(areas.includes(previous))$('area').value=previous;
 refresh();
}

function refresh(){
 const a=$('area').value,s=$('source').value;
 pool=items.filter(x=>(!a||x.area===a)&&(s!=='wrong'||x.wrong));
 const compact=compactPairs(pool).length;
 $('status').textContent=pool.length+' flashcards disponíveis • '+compact+' associações curtas para Memória e Combinar Pares. Novos flashcards entram automaticamente após sincronizar e reabrir esta aba.';
 renderHome();
}

function renderHome(){const games=[['quiz','⚡','Quiz Relâmpago','Perguntas dos seus flashcards, cronômetro e pontos'],['pairs','🧩','Combinar Pares','Ligue pergunta e resposta'],['wheel','🎡','Roleta Médica','Sorteie um desafio dos seus flashcards'],['memory','🧠','Memória Médica','Encontre cartas correspondentes']];$('home').innerHTML=games.map(g=>'<button class="tile" onclick="start(\''+g[0]+'\')"><span class="emoji">'+g[1]+'</span><b>'+g[2]+'</b><span class="muted">'+g[3]+'</span><span class="play-cta">Jogar agora →</span></button>').join('')}
function start(m){mode=m;score=0;round=0;selected=null;matched=new Set();clearInterval(timer);const base=m==='pairs'||m==='memory'?compactPairs(pool):pool.filter(x=>x.kind==='cards');if(!base.length){alert('Não há conteúdos compatíveis com este jogo e estes filtros. Escolha outra fonte.');return}deck=shuffle(base).slice(0,Math.min(+$('count').value,base.length));$('home').classList.add('hidden');$('play').classList.remove('hidden');if(m==='memory'||m==='pairs')makePairs();else next()}
function back(){clearInterval(timer);$('play').classList.add('hidden');$('home').classList.remove('hidden');refresh()}
function shell(title){$('play').innerHTML='<div class="game-top"><button class="btn ghost" onclick="back()">← Jogos</button><span class="game-label">'+title+'</span><span class="score-badge">⭐ '+score+'</span></div><div class="bar" style="margin:18px 0"><i style="width:'+Math.round(round/Math.max(deck.length,1)*100)+'%"></i></div><div id="stage"></div>'}
function next(){clearInterval(timer);if(round>=deck.length){finish();return}let q=deck[round];shell(mode==='wheel'?'🎡 Roleta Médica':'⚡ Quiz Relâmpago');if(mode==='wheel'){$('stage').innerHTML='<div style="text-align:center;padding:30px"><div id="wheelIcon" class="wheel-disk"><span>🎡</span></div><h2>Pronta para o próximo desafio?</h2><button class="btn" onclick="spin()">Girar roleta</button></div>';return}renderQuestion(q)}
function spin(){let e=$('wheelIcon');e.classList.add('spinning');setTimeout(()=>renderQuestion(deck[round]),1250)}
function renderQuestion(q){seconds=20;let alternatives=[...new Set(items.filter(x=>x.id!==q.id&&x.area===q.area&&x.answer!==q.answer&&x.answer.length<=90).map(x=>x.answer))];if(alternatives.length<2)alternatives=[...new Set(items.filter(x=>x.id!==q.id&&x.answer!==q.answer&&x.answer.length<=90).map(x=>x.answer))];let options=shuffle([q.answer,...shuffle(alternatives).slice(0,3)]);if(options.length<2){$('stage').innerHTML='<h2 class="question-title">'+esc(q.question)+'</h2><button class="btn" onclick="showFlashAnswer()">Mostrar resposta</button>';return}let correct=options.indexOf(q.answer);$('stage').innerHTML='<div class="row" style="justify-content:space-between"><span class="round-info">🎯 Rodada '+(round+1)+' de '+deck.length+'</span><span class="score-badge" id="clock">⏱️ '+seconds+'s</span></div><h2 class="question-title">'+esc(q.question)+'</h2><div class="choices">'+options.map((v,i)=>'<button class="choice" data-i="'+i+'" onclick="answer('+i+','+correct+')"><span class="option-letter">'+String.fromCharCode(65+i)+'</span>'+esc(v)+'</button>').join('')+'</div><div id="feedback"></div>';timer=setInterval(()=>{seconds--;if($('clock'))$('clock').textContent='⏱️ '+seconds+'s';if(seconds<=0){clearInterval(timer);answer(-1,correct)}},1000)}
function showFlashAnswer(){let q=deck[round];$('stage').innerHTML='<div class="feedback"><h2>'+esc(q.answer)+'</h2><button class="btn" onclick="round++;next()">Continuar →</button></div>'}
function answer(i,correct){clearInterval(timer);let q=deck[round],ok=i===correct;if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.i===correct)b.classList.add('good');else if(+b.dataset.i===i)b.classList.add('bad')});$('feedback').innerHTML='<div class="feedback"><b>'+(ok?'✅ Correto!':'💡 Resposta correta: '+esc(q.answer))+'</b><p>'+esc(q.tip||'')+'</p><button class="btn" onclick="round++;next()">Continuar →</button></div>'}
function makePairs(){const n=Math.min(mode==='memory'?4:5,deck.length);deck=deck.slice(0,n);const cards=shuffle(deck.flatMap((q,i)=>[{id:i+'q',pair:i,text:q.question,icon:q.icon||'🩺'},{id:i+'a',pair:i,text:q.answer,icon:'💡'}]));window.pairCards=cards;open=[];locked=false;shell(mode==='memory'?'🧠 Memória Médica':'🧩 Combinar Pares');$('stage').innerHTML='<p class="muted">'+(mode==='memory'?'Vire duas cartas para encontrar o par.':'Selecione uma pergunta e sua resposta correspondente.')+'</p><div class="'+(mode==='memory'?'board':'choices')+'">'+cards.map((c,i)=>'<button class="pair '+(mode==='memory'?'memory':'')+'" id="pair'+i+'" onclick="pick('+i+')">'+(mode==='memory'?'❔':'<span class="pair-icon">'+c.icon+'</span><span>'+esc(c.text)+'</span>')+'</button>').join('')+'</div><div id="feedback"></div>'}
function pick(i){if(locked||matched.has(i)||open.includes(i))return;const c=window.pairCards[i],b=$('pair'+i);b.innerHTML='<span class="pair-icon">'+c.icon+'</span><span>'+esc(c.text)+'</span>';b.classList.add('selected');open.push(i);if(open.length<2)return;const [a,d]=open,good=window.pairCards[a].pair===window.pairCards[d].pair;if(good){score++;matched.add(a);matched.add(d);[a,d].forEach(j=>{$('pair'+j).classList.remove('selected');$('pair'+j).classList.add('done');$('pair'+j).disabled=true});open=[];if(matched.size===window.pairCards.length)setTimeout(finish,400)}else{locked=true;setTimeout(()=>{[a,d].forEach(j=>{let x=$('pair'+j);if(!x)return;x.classList.remove('selected');if(mode==='memory')x.textContent='❔'});open=[];locked=false},950)}}
function finish(){clearInterval(timer);const total=mode==='memory'||mode==='pairs'?deck.length:deck.length;shell('🏆 Partida concluída');$('stage').innerHTML='<div class="finish-card"><div class="finish-medal">🏆</div><h2>Você concluiu a partida!</h2><h1>'+score+' / '+total+'</h1><p class="muted">Os resultados deste módulo experimental não alteram as estatísticas oficiais das provas.</p><div class="row" style="justify-content:center"><button class="btn" onclick="start(\''+mode+'\')">Jogar novamente</button><button class="btn ghost" onclick="back()">Outros jogos</button></div></div>'}
$('area').onchange=refresh;$('source').onchange=refresh;$('count').onchange=refresh;load();
</script></body></html>
