<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashMed Games</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#502b43;background:#fff6fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#ffe1ef,transparent 45%),#fff6fb}.wrap{max-width:1060px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{color:#a92d73;margin:10px 0}h2{margin:8px 0}.muted{color:#8b7080}.panel,.tile{background:#fff;border:1px solid #f1d8e6;border-radius:22px;padding:22px;box-shadow:0 10px 26px #8d376012}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.tile{text-align:left;cursor:pointer;transition:transform .15s,border .15s}.tile:hover{transform:translateY(-3px);border-color:#df73ac}.tile b{display:block;font-size:20px;margin:9px 0}.emoji{font-size:42px}button,select{font:inherit}button{cursor:pointer}.btn{background:#cf478d;border:0;border-radius:13px;padding:12px 18px;color:#fff;font-weight:750}.ghost{background:#fff0f7;color:#87355d;border:1px solid #edc4d9}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.choice{background:#fff;border:2px solid #e9c3d7;color:#583047;text-align:left;padding:17px;border-radius:16px;min-height:75px;font-weight:700}.choice:hover:not(:disabled){border-color:#d14c91;background:#fff1f8}.choice.good{border-color:#32a477;background:#e6f8ef}.choice.bad{border-color:#d95466;background:#fff0f0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bar{height:10px;background:#f4d9e6;border-radius:20px;overflow:hidden}.bar i{display:block;background:#d34a91;height:100%;transition:width .2s}.pair{background:#fff;border:2px solid #efcfe0;border-radius:14px;padding:14px;min-height:80px}.pair.selected{border-color:#c33b83;background:#ffebf5}.pair.done{border-color:#35a77c;background:#e7f8ef;opacity:.7}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.memory{min-height:90px;font-size:16px;overflow-wrap:anywhere}.feedback{background:#fff1f7;border-radius:15px;padding:16px;margin-top:16px}.hidden{display:none}select{border:1px solid #e7bdd4;padding:10px;border-radius:12px;background:white;max-width:100%}@media(max-width:550px){.wrap{padding:14px}.board{grid-template-columns:repeat(3,1fr)}.panel{padding:16px}.memory{min-height:78px;font-size:13px}}</style></head><body><div class="wrap"><header><div><h1>🎮 FlashMed Games</h1><div class="muted">Seu banco de estudos virou diversão 💗</div></div><a class="btn ghost" href="index.html" style="text-decoration:none">← Voltar ao FlashMed</a></header><section class="panel" style="margin:20px 0"><div class="row"><label>Matéria <select id="area"><option value="">Todas</option></select></label><label>Fonte <select id="source"><option value="all">Questões e flashcards</option><option value="bank">Banco de questões</option><option value="cards">Flashcards</option><option value="wrong">Questões erradas</option></select></label><label>Quantidade <select id="count"><option>5</option><option selected>10</option><option>15</option></select></label></div><p class="muted" id="status">Carregando conteúdos...</p></section><section id="home" class="grid"></section><section id="play" class="panel hidden"></section></div><script>
const KEY='flashmed_larissa_final';let db={},items=[],pool=[],mode='',round=0,score=0,selected=null,deck=[],open=[],matched=new Set(),locked=false,timer=null,seconds=0;const $=id=>document.getElementById(id);const clean=s=>String(s??'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();const esc=s=>clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
function load(){try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}};const wrong=new Set((db.bankAttempts||[]).filter(x=>x.correct===false).map(x=>String(x.questionId)));items=[...(db.bankQuestions||[]).filter(q=>!q.annulled&&Array.isArray(q.alternatives)&&q.alternatives.length>=2&&Number.isInteger(q.correctIndex)&&q.alternatives[q.correctIndex]).map(q=>({id:String(q.id),kind:'bank',area:q.area||q.topic||'Geral',question:clean((q.caseText||'')+' '+(q.prompt||'')),options:q.alternatives.map(clean),correct:q.correctIndex,answer:clean(q.alternatives[q.correctIndex]),tip:clean(q.resolution).slice(0,700),wrong:wrong.has(String(q.id))})),...(db.cards||[]).filter(c=>c.front&&c.back).map(c=>({id:String(c.id),kind:'cards',area:c.subject||'Geral',question:clean(c.front),answer:clean(c.back),tip:'Revisão de flashcard',wrong:(c.bad||0)>(c.ok||0)}))];const areas=[...new Set(items.map(x=>x.area))].sort();$('area').innerHTML='<option value="">Todas</option>'+areas.map(x=>'<option>'+esc(x)+'</option>').join('');refresh()}
function refresh(){const a=$('area').value,s=$('source').value;pool=items.filter(x=>(!a||x.area===a)&&(s==='all'||s==='wrong'&&x.wrong||x.kind===s));$('status').textContent=pool.length+' conteúdos disponíveis • '+pool.filter(x=>x.kind==='bank').length+' questões • '+pool.filter(x=>x.kind==='cards').length+' flashcards. Novos conteúdos cadastrados no FlashMed entram aqui após sincronizar e reabrir esta página.';renderHome()}
function renderHome(){const games=[['quiz','⚡','Quiz Relâmpago','Alternativas, cronômetro e pontos'],['pairs','🧩','Combinar Pares','Ligue pergunta e resposta'],['wheel','🎡','Roleta Médica','Sorteie um desafio do seu banco'],['memory','🧠','Memória Médica','Encontre cartas correspondentes']];$('home').innerHTML=games.map(g=>'<button class="tile" onclick="start(\''+g[0]+'\')"><span class="emoji">'+g[1]+'</span><b>'+g[2]+'</b><span class="muted">'+g[3]+'</span></button>').join('')}
function start(m){mode=m;score=0;round=0;selected=null;matched=new Set();clearInterval(timer);const base=m==='quiz'?pool.filter(x=>x.kind==='bank'):pool;if(!base.length){alert('Não há conteúdos compatíveis com este jogo e estes filtros. Escolha outra fonte.');return}deck=shuffle(base).slice(0,Math.min(+$('count').value,base.length));$('home').classList.add('hidden');$('play').classList.remove('hidden');if(m==='memory'||m==='pairs')makePairs();else next()}
function back(){clearInterval(timer);$('play').classList.add('hidden');$('home').classList.remove('hidden');refresh()}
function shell(title){$('play').innerHTML='<div class="row" style="justify-content:space-between"><button class="btn ghost" onclick="back()">← Jogos</button><b>'+title+'</b><b>⭐ '+score+'</b></div><div class="bar" style="margin:18px 0"><i style="width:'+Math.round(round/Math.max(deck.length,1)*100)+'%"></i></div><div id="stage"></div>'}
function next(){clearInterval(timer);if(round>=deck.length){finish();return}let q=deck[round];shell(mode==='wheel'?'🎡 Roleta Médica':'⚡ Quiz Relâmpago');if(mode==='wheel'){$('stage').innerHTML='<div style="text-align:center;padding:30px"><div id="wheelIcon" style="font-size:90px">🎡</div><h2>Pronta para o próximo desafio?</h2><button class="btn" onclick="spin()">Girar roleta</button></div>';return}renderQuestion(q)}
function spin(){let e=$('wheelIcon');e.style.transition='transform 1s ease-out';e.style.transform='rotate(1080deg)';setTimeout(()=>renderQuestion(deck[round]),1050)}
function renderQuestion(q){seconds=20;let options=q.options||shuffle([q.answer,...shuffle(deck.filter(x=>x.id!==q.id).map(x=>x.answer).filter(x=>x!==q.answer)).slice(0,3)]);let correct=q.options?q.correct:options.indexOf(q.answer);$('stage').innerHTML='<div class="row" style="justify-content:space-between"><span>Rodada '+(round+1)+' de '+deck.length+'</span><span id="clock">⏱️ '+seconds+'s</span></div><h2 style="line-height:1.5">'+esc(q.question)+'</h2><div class="choices">'+options.map((v,i)=>'<button class="choice" data-i="'+i+'" onclick="answer('+i+','+correct+')">'+esc(v)+'</button>').join('')+'</div><div id="feedback"></div>';timer=setInterval(()=>{seconds--;if($('clock'))$('clock').textContent='⏱️ '+seconds+'s';if(seconds<=0){clearInterval(timer);answer(-1,correct)}},1000)}
function answer(i,correct){clearInterval(timer);let q=deck[round],ok=i===correct;if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.i===correct)b.classList.add('good');else if(+b.dataset.i===i)b.classList.add('bad')});$('feedback').innerHTML='<div class="feedback"><b>'+(ok?'✅ Correto!':'💡 Resposta correta: '+esc(q.answer))+'</b><p>'+esc(q.tip||'')+'</p><button class="btn" onclick="round++;next()">Continuar →</button></div>'}
function makePairs(){const n=Math.min(6,deck.length);deck=deck.slice(0,n);const cards=shuffle(deck.flatMap((q,i)=>[{id:i+'q',pair:i,text:q.question},{id:i+'a',pair:i,text:q.answer}]));window.pairCards=cards;open=[];locked=false;shell(mode==='memory'?'🧠 Memória Médica':'🧩 Combinar Pares');$('stage').innerHTML='<p class="muted">'+(mode==='memory'?'Vire duas cartas para encontrar o par.':'Selecione uma pergunta e sua resposta correspondente.')+'</p><div class="'+(mode==='memory'?'board':'choices')+'">'+cards.map((c,i)=>'<button class="pair '+(mode==='memory'?'memory':'')+'" id="pair'+i+'" onclick="pick('+i+')">'+(mode==='memory'?'❔':esc(c.text))+'</button>').join('')+'</div><div id="feedback"></div>'}
function pick(i){if(locked||matched.has(i)||open.includes(i))return;const c=window.pairCards[i],b=$('pair'+i);b.textContent=c.text;b.classList.add('selected');open.push(i);if(open.length<2)return;const [a,d]=open,good=window.pairCards[a].pair===window.pairCards[d].pair;if(good){score++;matched.add(a);matched.add(d);[a,d].forEach(j=>{$('pair'+j).classList.remove('selected');$('pair'+j).classList.add('done');$('pair'+j).disabled=true});open=[];if(matched.size===window.pairCards.length)setTimeout(finish,400)}else{locked=true;setTimeout(()=>{[a,d].forEach(j=>{let x=$('pair'+j);if(!x)return;x.classList.remove('selected');if(mode==='memory')x.textContent='❔'});open=[];locked=false},950)}}
function finish(){clearInterval(timer);const total=mode==='memory'||mode==='pairs'?deck.length:deck.length;shell('🏆 Partida concluída');$('stage').innerHTML='<div style="text-align:center;padding:28px"><div style="font-size:64px">🏆</div><h2>Você concluiu a partida!</h2><h1>'+score+' / '+total+'</h1><p class="muted">Os resultados deste módulo experimental não alteram as estatísticas oficiais das provas.</p><div class="row" style="justify-content:center"><button class="btn" onclick="start(\''+mode+'\')">Jogar novamente</button><button class="btn ghost" onclick="back()">Outros jogos</button></div></div>'}
$('area').onchange=refresh;$('source').onchange=refresh;$('count').onchange=refresh;load();
</script></body></html>
