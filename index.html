{id:'sus26-1',number:1,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, trabalhador da construção civil, com tosse produtiva há quatro semanas, febre vespertina, sudorese noturna e perda de 5 kg. Teve contato recente com colega tratado para tuberculose. Ao exame, está emagrecido e apresenta estertores em ápice direito. Radiografia: infiltrado com cavitação em lobo superior direito. Reside com esposa e dois filhos, de 4 e 8 anos.',prompt:'Indique a conduta prioritária para a confirmação diagnóstica do paciente:',alternatives:['Solicitar teste tuberculínico (PPD) e aguardar o resultado em 72 horas para definir a conduta.','Coletar duas amostras de escarro para baciloscopia e teste rápido molecular (TRM-TB).','Realizar broncoscopia com lavado broncoalveolar e cultura em meio de Lowenstein-Jensen.','Iniciar imediatamente o esquema terapêutico padrão e observar a resposta clínica do paciente.'],correctIndex:1,resolution:"<h3>Resolução comentada — tuberculose</h3><p><b>Resposta B.</b> Tosse persistente, sintomas constitucionais, contato epidemiológico e cavitação tornam a tuberculose pulmonar uma hipótese prioritária. Em paciente com escarro, priorize teste rápido molecular para TB conforme o fluxo local; a radiografia apoia a suspeita, mas não confirma sozinha.</p><p><b>Para a prova:</b> suspeita de TB pulmonar → confirmação microbiológica e precauções respiratórias.</p>"},
{id:'sus26-2',number:2,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, trabalhador da construção civil, com tosse produtiva há quatro semanas, febre vespertina, sudorese noturna e perda de 5 kg. Radiografia mostra infiltrado cavitário em lobo superior direito.',prompt:'Indique o esquema de tratamento de primeira linha recomendado pelo Ministério da Saúde para esse paciente:',alternatives:['Rifampicina, isoniazida e pirazinamida por 6 meses, associado a etambutol nos 2 primeiros meses.','Rifampicina, isoniazida, pirazinamida e etambutol (RIPE) por 2 meses, seguido por rifampicina e isoniazida (RI) por 4 meses.','RIPE por 4 meses, seguido por RI por 2 meses.','Isoniazida, pirazinamida e etambutol por 4 meses, seguido por isoniazida e rifampicina por 2 meses.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>Para o adulto com TB pulmonar sensível, o esquema básico é 2 meses de RHZE (RIPE) na fase intensiva e 4 meses de RH na manutenção.</p><p><b>💡 Leve para a prova:</b> TB sensível no adulto = 2RHZE/4RH.</p>'},
{id:'sus26-3',number:3,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, com quadro clínico-radiológico compatível com tuberculose pulmonar cavitária.',prompt:'Identifique o principal critério para definir a cura do paciente ao término do tratamento, segundo as normas do Ministério da Saúde:',alternatives:['Resolução completa das alterações na radiografia de tórax ao final do sexto mês.','Ausência de sintomas respiratórios e resolução da cavitação ao final do sexto mês.','Negativação do teste tuberculínico (PPD) após a conclusão do esquema terapêutico.','Apresentação de duas baciloscopias de escarro negativas no quinto e sexto meses de tratamento.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A alternativa oficial privilegia a negativação bacteriológica no seguimento. Alterações radiológicas podem persistir mesmo após cura, sintomas isolados não bastam e PPD não é usado para documentar cura.</p><p><b>💡 Leve para a prova:</b> cura da TB não exige normalização radiológica nem negativação do PPD.</p>'},
{id:'sus26-4',number:4,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, IMC 32 kg/m², com edema generalizado, ascite e PA 150/95 mmHg. Creatinina 1,6 mg/dL, albumina 1,8 g/dL, colesterol 450 mg/dL, triglicerídeos 380 mg/dL e proteinúria de 24 h de 8,5 g. Sedimento com lipidúria e hematúria microscópica; sorologias B, C e HIV negativas e FAN não reagente.',prompt:'Diante dos dados clínicos apresentados, identifique a causa primária mais provável para o quadro atual da paciente:',alternatives:['Glomeruloesclerose segmentar e focal (GESF).','Nefropatia por IgA (Doença de Berger).','Glomerulonefrite membranoproliferativa (GNMP).','Doença de lesões mínimas (DLM).'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>O conjunto define síndrome nefrótica importante. Em adulto com obesidade, a GESF é uma causa particularmente associada e é a resposta oficial. IgA e GNMP tendem a apresentar fenótipo mais nefrítico/misto; doença de lesões mínimas é possível em adultos, mas o contexto favorece GESF.</p><p><b>💡 Leve para a prova:</b> obesidade é associação clássica com GESF secundária.</p>'},
{id:'sus26-5',number:5,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, com síndrome nefrótica: proteinúria 8,5 g/24 h, albumina 1,8 g/dL, edema, colesterol 450 mg/dL e triglicerídeos 380 mg/dL.',prompt:'Indique a fisiopatologia envolvida na hiperlipidemia apresentada pela paciente:',alternatives:['Redução da atividade da lipase lipoproteica, diminuindo a depuração de triglicerídeos.','Absorção intestinal aumentada de colesterol devido à perda de proteínas reguladoras.','Aumento da síntese hepática de lipoproteínas, estimulada pela baixa pressão oncótica.','Diminuição da excreção de colesterol pela bile por disfunção hepatocelular secundária.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p>Na síndrome nefrótica, a perda urinária maciça de proteínas reduz a pressão oncótica plasmática e estimula síntese hepática, inclusive de lipoproteínas, contribuindo para hiperlipidemia.</p><p><b>💡 Leve para a prova:</b> hipoalbuminemia nefrótica → resposta hepática compensatória → ↑ lipoproteínas.</p>'},
{id:'sus26-6',number:6,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, com edema generalizado, hipoalbuminemia grave, hiperlipidemia e proteinúria nefrótica.',prompt:'Identifique as complicações mais provavelmente associadas ao quadro clínico dessa paciente:',alternatives:['Acidose metabólica com ânion gap elevado, hipertensão maligna, encefalopatia hipertensiva.','Hipocalcemia sintomática, anemia hemolítica microangiopática e insuficiência cardíaca.','Glomerulonefrite rapidamente progressiva, síndrome urêmica e hipercalemia grave.','Trombose de veia renal, infecções por germes encapsulados e hiperlipidemia refratária.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A síndrome nefrótica favorece hipercoagulabilidade, perda urinária de imunoglobulinas e alterações lipídicas. Isso explica risco trombótico, maior suscetibilidade a infecções e hiperlipidemia.</p><p><b>💡 Leve para a prova:</b> síndrome nefrótica = trombose + infecção + dislipidemia.</p>'},
{id:'sus26-7',number:7,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome torácica aguda',caseText:'Homem, 28 anos, com anemia falciforme e uso irregular de hidroxiureia, apresenta dor torácica pleurítica, febre, tosse e dispneia. SpO₂ 88% em ar ambiente e radiografia mostra novo infiltrado em lobo inferior direito. Hb 7,2 g/dL e leucócitos 18.500/mm³.',prompt:'Identifique a fisiopatologia central envolvida no quadro atual do paciente:',alternatives:['Vaso-oclusão pulmonar por falcização de eritrócitos, infecção bacteriana e embolia gordurosa medular.','Tromboembolismo pulmonar recorrente por estado de hipercoagulabilidade crônica da anemia falciforme.','Lesão pulmonar aguda mediada por citocinas inflamatórias liberadas durante a hemólise intravascular.','Hipertensão pulmonar aguda por aumento súbito da resistência vascular pulmonar durante crise vaso-oclusiva.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>Febre, sintomas respiratórios, hipoxemia e novo infiltrado pulmonar em pessoa com doença falciforme caracterizam síndrome torácica aguda. Sua fisiopatologia é multifatorial, envolvendo vaso-oclusão/falcização, infecção e embolização gordurosa.</p><p><b>💡 Leve para a prova:</b> falciforme + novo infiltrado + sintomas respiratórios = síndrome torácica aguda.</p>'},
{id:'sus26-8',number:8,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome torácica aguda',caseText:'Homem, 28 anos, com anemia falciforme, febre, dor torácica, dispneia, SpO₂ 88% e novo infiltrado pulmonar.',prompt:'Indique a conduta terapêutica inicial mais adequada para esse quadro:',alternatives:['Hidratação volêmica vigorosa, iniciar ceftriaxone e realizar exsanguineotransfusão total.','Hidratação cautelosa, ceftriaxone e azitromicina, oxigênio suplementar.','Administrar corticoide sistêmico, iniciar levofloxacino e oxigênio suplementar.','Hidratação cautelosa, iniciar heparina não fracionada para anticoagulação plena.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>Na síndrome torácica aguda, o manejo inicial inclui oxigênio para hipoxemia, analgesia, hidratação cuidadosa e antibióticos cobrindo germes típicos e atípicos. Hidratação excessiva pode piorar o comprometimento pulmonar; anticoagulação não é tratamento de rotina.</p><p><b>⚠️ Atenção:</b> o gabarito desta questão foi retificado para B.</p><p><b>💡 Leve para a prova:</b> STA → O₂ + antibiótico + hidratação cautelosa; transfusão depende da gravidade.</p>'},
{id:'sus26-9',number:9,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Doença falciforme',caseText:'Após episódio de síndrome torácica aguda em paciente de 28 anos com anemia falciforme e acompanhamento irregular.',prompt:'Identifique as medidas mais indicadas para prevenir novos episódios, semelhantes ao atual, após a alta hospitalar:',alternatives:['Uso regular da hidroxiureia, profilaxia com penicilina benzatina e vacinação contra germes encapsulados.','Esplenectomia eletiva, profilaxia com amoxicilina oral e vacinação contra germes encapsulados.','Anticoagulação com varfarina, transfusões para manter Hb acima de 10 g/dL e profilaxia com amoxicilina.','Transfusões mensais para Hb acima de 10 g/dL, esplenectomia eletiva e profilaxia com penicilina benzatina.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>A alternativa oficial reúne medidas preventivas relacionadas à doença falciforme: adesão à hidroxiureia e prevenção de infecções por germes encapsulados. Esplenectomia e anticoagulação crônica não são estratégias rotineiras para prevenir síndrome torácica aguda.</p><p><b>💡 Leve para a prova:</b> hidroxiureia reduz complicações vaso-oclusivas da doença falciforme.</p>'},
{id:'sus26-10',number:10,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, vítima de espancamento, chega pálido, sudorético, FC 128 bpm, PA 90/58 mmHg, confuso, com extremidades frias, lactato 4,8 mmol/L, glicemia 178 mg/dL, hipotermia e oligúria.',prompt:'Indique o principal hormônio que promove a hiperglicemia durante a fase aguda do trauma:',alternatives:['Insulina.','Cortisol.','Glucagon.','Aldosterona.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p>A resposta aguda ao trauma é contrarregulatória. Entre as alternativas, o glucagon é o principal responsável por elevar rapidamente a glicemia por glicogenólise e gliconeogênese.</p><p><b>💡 Leve para a prova:</b> trauma agudo → hormônios contrarreguladores ↑; glucagon favorece hiperglicemia.</p>'},
{id:'sus26-11',number:11,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, em fase aguda após trauma com choque e resposta metabólica ao estresse.',prompt:'Indique a alternativa que descreve corretamente as modificações da fase de catabolismo agudo do trauma:',alternatives:['Mobilização de substratos energéticos e balanço nitrogenado negativo.','Predomínio de síntese proteica e armazenamento de energia.','Aumento da secreção de insulina e diminuição do consumo de oxigênio.','Retenção de glicose e formação de corpos cetônicos.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>A fase catabólica mobiliza reservas para sustentar a resposta ao estresse: aumenta proteólise e disponibilização de substratos, produzindo balanço nitrogenado negativo.</p><p><b>💡 Leve para a prova:</b> catabolismo pós-trauma = mobilização energética + perda proteica.</p>'},
{id:'sus26-12',number:12,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, em resposta aguda ao trauma e à hipovolemia.',prompt:'Indique o hormônio que tem como principal efeito aumentar a reabsorção de sódio e água nos rins, contribuindo para a manutenção do volume intravascular durante o trauma:',alternatives:['Hormônio antidiurético (ADH).','Cortisol.','Renina.','Aldosterona.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A aldosterona aumenta a reabsorção renal de sódio, com retenção secundária de água, ajudando a preservar o volume intravascular. O ADH atua sobretudo aumentando a reabsorção de água livre.</p><p><b>💡 Leve para a prova:</b> aldosterona → Na⁺; ADH → água.</p>'},
{id:'sus26-13',number:13,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Avaliação pré-operatória',caseText:'Homem, 68 anos, HAS, DM2 e DPOC leve, em avaliação para colectomia direita eletiva por adenocarcinoma. Refere dispneia apenas aos grandes esforços, sem doença coronariana prévia; ECG com extrassístoles supraventriculares isoladas.',prompt:'Indique a conduta mais adequada em relação à avaliação cardiovascular pré-operatória para esse paciente:',alternatives:['Realizar teste não invasivo (teste ergométrico ou cintilografia) se o resultado alterar a conduta cirúrgica e a capacidade funcional for < 4 METs.','Solicitar ecocardiograma transtorácico e teste ergométrico como recomendado para pacientes com mais de 65 anos.','Iniciar betabloqueador 10 dias antes da cirurgia para controle da hipertensão e da frequência cardíaca.','Cancelar o procedimento até avaliação cardiológica, independentemente da gravidade.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>Testes cardíacos adicionais no pré-operatório devem ser solicitados quando o resultado tiver potencial de modificar a conduta, especialmente diante de capacidade funcional reduzida e risco clínico/cirúrgico relevante. Idade isolada não obriga eco ou teste de esforço.</p><p><b>💡 Leve para a prova:</b> não peça teste pré-operatório “por rotina”; pergunte se o resultado mudará a conduta.</p>'},
{id:'sus26-14',number:14,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Avaliação pré-operatória',caseText:'Homem, 68 anos, DM2 em uso de metformina, será submetido a colectomia direita eletiva.',prompt:'Indique a conduta mais adequada para o controle glicêmico no perioperatório:',alternatives:['Suspender metformina 24 horas antes da cirurgia e reiniciar imediatamente após o término do procedimento.','Manter metformina até o dia da cirurgia e ajustar a dose de insulina conforme necessidade intraoperatória.','Suspender metformina uma semana antes da cirurgia devido ao risco de hipoglicemia.','Suspender metformina no dia anterior à cirurgia e utilizar esquema de insulina regular em bomba ou em correção conforme glicemia capilar.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>Entre as alternativas da prova, a estratégia correta é interromper a metformina no perioperatório e realizar controle glicêmico com insulina conforme monitorização. Reinício não deve ser automático imediatamente após a cirurgia, devendo considerar condições clínicas e função renal.</p><p><b>💡 Leve para a prova:</b> perioperatório exige monitorização glicêmica e ajuste temporário do tratamento.</p>'},
{id:'sus26-15',number:15,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Avaliação pré-operatória',caseText:'Homem, 68 anos, com DPOC leve em uso de tiotrópio, em avaliação pré-operatória para colectomia eletiva.',prompt:'Indique a melhor conduta em relação à avaliação pulmonar pré-operatória para este paciente:',alternatives:['Adiar a cirurgia e iniciar corticoide sistêmico profilático se o paciente for portador de DPOC.','Solicitar espirometria apenas se o resultado influenciar o planejamento anestésico ou cirúrgico.','Suspender o broncodilatador tiotrópio uma semana antes da cirurgia para evitar interação medicamentosa.','Realizar radiografia de tórax e espirometria de rotina, pois o paciente tem mais de 60 anos.'],correctIndex:1,alternativeExplanations:["A espirometria não é indicada de forma universal apenas por haver DPOC leve; corticoide sistêmico profilático não é rotina em DPOC estável e deve haver indicação clínica.","Correta: solicitar espirometria quando o resultado puder modificar o planejamento ou o manejo perioperatório, especialmente se houver sintomas, doença pulmonar relevante ou dúvida clínica.","Tiotrópio de manutenção geralmente deve ser mantido no perioperatório; suspender sem motivo pode piorar o controle respiratório.","Idade isolada não justifica radiografia de tórax e espirometria de rotina; exames devem ser direcionados pela história, exame físico e tipo de cirurgia."],resolution:'<h3>🧠 Resolução comentada</h3><p>A espirometria não é exame universal de rotina no pré-operatório de cirurgia não torácica. Ela é útil quando seus achados podem alterar planejamento ou manejo. Broncodilatadores habituais não devem ser suspensos sem indicação, e DPOC estável não exige corticoide sistêmico profilático.</p><p><b>💡 Leve para a prova:</b> avaliação pulmonar pré-op deve ser dirigida pela clínica e pelo impacto na conduta.</p>'}
];

{id:'sus26-46',number:46,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Apneia obstrutiva do sono',caseText:'Homem, 52 anos, motorista de caminhão, apresenta sonolência diurna excessiva, roncos intensos, pausas respiratórias testemunhadas e engasgos durante o sono. Tem HAS em uso de losartana e hidroclorotiazida, IMC 34 kg/m² e PA 145/95 mmHg. Apresenta laudo de MAPA de 24 horas.',prompt:'Indique o exame padrão-ouro para confirmar a principal hipótese diagnóstica desse caso:',expected:'Polissonografia noturna completa em laboratório (PSG tipo I).',accepted:['polissonografia','polissonografia noturna','polissonografia de noite inteira','monitorização multiparamétrica do sono'],concepts:['polissonografia'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> sonolência diurna, roncos intensos e pausas respiratórias testemunhadas formam um quadro típico de apneia obstrutiva do sono (AOS). Obesidade e hipertensão aumentam a probabilidade pré-teste, mas não confirmam o diagnóstico sozinhas.</p><p><b>Por que polissonografia?</b> A polissonografia tipo I registra simultaneamente fluxo aéreo, esforço respiratório, oximetria, sono e outros parâmetros, permitindo confirmar AOS e quantificar o índice de apneia-hipopneia. Em pacientes selecionados, testes domiciliares validados podem ser alternativa; se negativos ou inconclusivos apesar de alta suspeita, deve-se realizar polissonografia.</p><p><b>💡 Para a prova:</b> suspeita clínica forte exige exame objetivo; questionários de triagem não substituem o diagnóstico.</p>"},
{id:'sus26-47',number:47,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Apneia obstrutiva do sono',caseText:'Homem, 52 anos, com quadro sugestivo de apneia obstrutiva do sono, HAS e MAPA de 24 horas disponível.',prompt:'Indique o achado presente na Monitorização (MAPA) mais característicamente associado à essa condição:',expected:'Ausência da redução fisiológica da pressão arterial de 10 a 20% durante o sono.',accepted:['ausência de descenso noturno','padrão não-dipper','padrão reverse dipper','queda noturna de pa < 10%','ascensão da pressão arterial durante o sono'],concepts:['descenso','noturno'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> normalmente a pressão arterial cai cerca de 10–20% durante o sono. A ausência dessa queda caracteriza padrão <i>non-dipper</i>; elevação noturna pode configurar padrão <i>reverse-dipper</i>. AOS pode contribuir por hipóxia intermitente, despertares e aumento da atividade simpática.</p><p><b>Interpretação:</b> esse achado na MAPA apoia a suspeita e indica maior risco cardiovascular, mas não confirma AOS isoladamente.</p><p><b>💡 Para a prova:</b> descenso noturno preservado = queda fisiológica; ausência ou inversão = padrão anormal.</p>"},
{id:'sus26-48',number:48,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Apneia obstrutiva do sono',caseText:'Homem, 52 anos, obeso, com sonolência diurna, roncos, apneias testemunhadas e quadro compatível com apneia obstrutiva do sono.',prompt:'Com base no quadro clínico, indique o tratamento de primeira linha para esse paciente:',expected:'Uso de dispositivo não invasivo que fornece pressão respiratória positiva contínua nas vias aéreas (CPAP).',accepted:['cpap','pressão positiva contínua nas vias aéreas','terapia com pressão positiva contínua','cpap noturno'],concepts:['cpap'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> o CPAP mantém pressão positiva contínua e funciona como uma “órtese pneumática”, evitando o colapso repetido da via aérea superior durante o sono. É tratamento de referência, especialmente na AOS moderada/grave ou sintomática, com escolha individualizada após confirmação diagnóstica.</p><p><b>O que acompanhar:</b> adaptação à máscara, uso real durante a noite, vazamentos, congestão nasal e melhora da sonolência. Medidas comportamentais, perda ponderal quando indicada e evitar álcool/sedativos próximos ao sono também podem ajudar, mas não substituem automaticamente o CPAP quando este está indicado.</p><p><b>💡 Para a prova:</b> CPAP trata o colapso da via aérea; não é apenas oxigenoterapia.</p>"},
{id:'sus26-49',number:49,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Doença hepática e álcool',caseText:'Mulher, 48 anos, DM2 e sobrepeso, relata consumo frequente de cerveja e destilados há 10 anos. Ao exame, fígado palpável; ultrassonografia mostra ecotextura heterogênea e esteatose difusa.',prompt:'Indique a intervenção única, mais eficaz, para evitar a progressão da doença hepática nessa paciente:',expected:'Abstinência alcoólica.',accepted:['abstinência alcoólica','abstinência de álcool','suspender totalmente o consumo de bebidas alcoólicas','cessar o uso de álcool','parar de beber álcool'],concepts:['álcool'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> há esteatose e alteração da ecotextura hepática em contexto de consumo crônico de álcool. A exposição persistente pode manter inflamação e favorecer fibrose, cirrose e descompensação. A medida isolada mais importante para interromper a agressão relacionada ao álcool é a abstinência completa.</p><p><b>Conduta prática:</b> avaliar quantidade e padrão de consumo, sinais de dependência, gravidade da doença hepática e comorbidades metabólicas. Se houver dependência, abstinência deve ser planejada com suporte clínico, pois a síndrome de abstinência pode ser perigosa. Tratar obesidade/DM2 e oferecer suporte nutricional também importa.</p><p><b>💡 Para a prova:</b> doença hepática relacionada ao álcool → cessar o álcool; não existe consumo seguro estabelecido para quem precisa interromper essa agressão.</p>"},
{id:'sus26-50',number:50,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Estágios de mudança',caseText:'Mulher, 48 anos, com consumo frequente de álcool há anos, inicialmente descreve seu hábito apenas como consumo “social”, apesar da quantidade relatada.',prompt:'Classifique o estágio em que a paciente provavelmente se encontra em relação ao consumo alcoólico, conforme o modelo de Prochaska e DiClemente (estágios de mudança):',expected:'Pré-contemplação.',accepted:['pré-contemplação','pre contemplação','fase de pré-contemplação','estágio de pré-contemplação'],concepts:['contemplação'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> no modelo de Prochaska e DiClemente, a pré-contemplação é a fase em que a pessoa ainda não reconhece o comportamento como problema ou não considera mudar no futuro próximo. Descrever o consumo como “social” apesar de sinais de risco pode sugerir minimização, mas a classificação ideal depende de explorar a percepção e a intenção da própria paciente.</p><p><b>Como diferenciar:</b> contemplação = reconhece o problema e considera mudar; preparação = pretende agir em breve e começa a planejar; ação = já iniciou a mudança; manutenção = sustenta a mudança ao longo do tempo.</p><p><b>💡 Para a prova:</b> não confrontar nem rotular; use entrevista motivacional e investigue prontidão para mudança.</p>"},
{id:'sus26-51',number:51,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Doença hepática e álcool',caseText:'Mulher, 48 anos, com esteatose difusa e ecotextura hepática heterogênea em ultrassonografia, além de consumo crônico de álcool.',prompt:'Indique o método não invasivo preferencial para estadiamento da doença hepática nessa paciente:',expected:'Elastografia hepática.',accepted:['elastografia hepática','fibroscan','elastografia','elastografia transitória','elastografia por rm','fib 4','fib-4'],concepts:['elastografia'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> em doença hepática crônica, é importante estimar fibrose, pois o risco prognóstico depende mais do grau de fibrose do que da esteatose isolada. A elastografia hepática estima a rigidez do fígado de forma não invasiva e pode ajudar a estratificar fibrose; a interpretação deve considerar inflamação aguda, congestão e colestase, que podem elevar a rigidez.</p><p><b>Não confundir:</b> FIB-4 é um escore calculado com idade, AST, ALT e plaquetas; não é um tipo de elastografia, embora também possa ser usado na estratificação não invasiva e na seleção de quem precisa de avaliação adicional.</p><p><b>💡 Para a prova:</b> elastografia avalia rigidez; FIB-4 estima risco por dados clínico-laboratoriais. Nenhum substitui toda a avaliação clínica.</p>"},
{id:'sus26-52',number:52,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Trauma hepático',caseText:'Homem, 28 anos, vítima de trauma automobilístico, chega com PA 88/52 mmHg e FC 120 bpm. FAST mostra líquido livre predominantemente em loja hepática. Após cristaloides e concentrado de hemácias, apresenta melhora hemodinâmica. TC mostra lesão hepática grau IV, sem extravasamento ativo e sem outras lesões abdominais.',prompt:'Indique o principal critério clínico, deste caso, que define se o trauma hepático poderá ser tratado de forma não operatória:',expected:'Estabilidade hemodinâmica sustentada, sem necessidade de vasopressor.',accepted:['paciente hemodinamicamente estável','estabilidade hemodinâmica sustentada','estabilidade hemodinâmica mantida após reposição volêmica','estabilidade hemodinâmica sem uso de drogas vasoativas','hemodinâmica estável após ressuscitação inicial'],concepts:['estabilidade','hemodinâmica'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> o paciente chegou em choque, mas respondeu à ressuscitação. A decisão de manejo não operatório do trauma hepático depende principalmente de estabilidade hemodinâmica sustentada, possibilidade de monitorização intensiva, exames seriados e acesso imediato a cirurgia/intervenção radiológica se houver deterioração.</p><p><b>Por que o grau IV não decide sozinho?</b> O grau anatômico descreve a lesão, mas não substitui o estado fisiológico. Ausência de extravasamento ativo na TC é favorável, porém não garante segurança se a instabilidade retornar.</p><p><b>💡 Para a prova:</b> instabilidade persistente ou deterioração clínica → controle hemorrágico urgente; paciente estável e monitorável pode ser candidato a tratamento não operatório, mesmo em lesões de alto grau.</p>"},
{id:'sus26-53',number:53,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Trauma hepático',caseText:'Paciente com trauma hepático e instabilidade hemodinâmica persistente apesar da ressuscitação inicial.',prompt:'Indique a conduta imediata diante de um paciente com trauma hepático e instabilidade hemodinâmica persistente:',expected:'Realizar laparotomia exploradora emergencial.',accepted:['laparotomia exploratória de emergência','laparotomia exploradora','laparotomia com controle de danos','laparotomia com tamponamento hepático','laparotomia com packing hepático'],concepts:['laparotomia'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> instabilidade hemodinâmica persistente após trauma hepático sugere hemorragia não controlada. Não se deve atrasar o controle definitivo do sangramento para exames que não mudarão a conduta. A laparotomia de emergência permite controle de danos, compressão/tamponamento hepático, controle de outras fontes hemorrágicas e ressuscitação concomitante.</p><p><b>Prioridades:</b> ativar equipe de trauma, protocolo de hemorragia maciça quando indicado, aquecimento e correção de coagulopatia/hipocalcemia, enquanto se realiza controle da fonte.</p><p><b>💡 Para a prova:</b> trauma abdominal + choque persistente = controle hemorrágico imediato; não insistir em manejo conservador.</p>"},
{id:'sus26-54',number:54,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Trauma hepático',caseText:'Paciente com trauma hepático grau IV tratado de forma não operatória após estabilização hemodinâmica.',prompt:'Determine as duas complicações tardias mais comuns do tratamento não operatório do trauma hepático:',expected:'Duas entre: bilioma, fístula biliar e hemorragia tardia.',accepted:['bilioma e fístula biliar','bilioma e hemorragia tardia','fístula biliar e hemorragia tardia'],concepts:['bilioma','fístula','hemorragia'],requiredCount:2,resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> após tratamento não operatório de lesão hepática, complicações tardias incluem coleções biliares (bilioma), fístula biliar e ressangramento. Lesões de alto grau exigem vigilância clínica e reavaliação se surgirem dor crescente, febre, icterícia, queda de hemoglobina ou instabilidade.</p><p><b>Como diferenciar:</b> bilioma é coleção localizada de bile; fístula é comunicação com drenagem persistente de bile; hemorragia tardia pode se manifestar por taquicardia, hipotensão, dor ou queda da hemoglobina. A investigação depende da apresentação e pode incluir imagem e avaliação intervencionista.</p><p><b>💡 Para a prova:</b> depois de trauma hepático, lembre complicações biliares e sangramento tardio.</p>"},
{id:'sus26-55',number:55,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Hérnia inguinal',caseText:'Homem, 54 anos, trabalhador rural, com abaulamento inguinal direito há 2 anos, antes redutível aos esforços. Há 6 horas tornou-se doloroso, endurecido e irredutível, associado a dor e distensão abdominal. Massa inguinal direita dolorosa e irredutível; abdome distendido e descompressão brusca positiva em fossa ilíaca direita.',prompt:'Indique o diagnóstico mais provável que levou o paciente a procurar o Pronto-Socorro:',expected:'Hérnia inguinal direita complicada com estrangulamento.',accepted:['hérnia inguinal direita estrangulada','hérnia estrangulada','estrangulamento de hérnia inguinal','hérnia inguinal direita estrangulada com obstrução intestinal','hérnia inguinal direita estrangulada com sofrimento de alça'],concepts:['hérnia','estrangul'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> uma hérnia antes redutível que se torna subitamente dolorosa, endurecida e irredutível sugere encarceramento; o estrangulamento ocorre quando o conteúdo herniado sofre comprometimento vascular. Distensão, dor abdominal e sinais de irritação peritoneal aumentam a preocupação com obstrução e isquemia intestinal.</p><p><b>Diagnósticos diferenciais:</b> hérnia encarcerada sem isquemia, hérnia estrangulada, obstrução intestinal e outras causas de abdome agudo. Não é seguro tentar redução forçada quando há suspeita de estrangulamento ou peritonite.</p><p><b>💡 Para a prova:</b> dor aguda + irredutibilidade + sinais sistêmicos/peritoneais = emergência cirúrgica.</p>"},
{id:'sus26-56',number:56,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Hérnia inguinal',caseText:'Homem, 54 anos, com hérnia inguinal direita dolorosa e irredutível associada a sintomas abdominais.',prompt:'Indique o achado clínico que, se presente durante a avaliação inicial, terá maior impacto no prognóstico cirúrgico imediato:',expected:'Sinais de peritonite difusa e abdome agudo inflamatório grave.',accepted:['peritonite difusa','peritonite generalizada','abdome em tábua','rigidez abdominal difusa','defesa abdominal difusa','irritação peritoneal difusa','sinal de blumberg','choque séptico'],concepts:['periton'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> peritonite difusa — defesa involuntária, rigidez ou descompressão dolorosa generalizada — pode indicar necrose/perfuração intestinal e contaminação peritoneal. Em hérnia estrangulada, isso sugere doença avançada, eleva o risco de sepse e exige ressuscitação e avaliação cirúrgica imediatas.</p><p><b>O que muda o prognóstico:</b> choque, sepse, atraso no controle da fonte e necessidade de ressecção intestinal aumentam o risco. Hemograma e lactato ajudam na avaliação, mas resultados inicialmente normais não excluem isquemia.</p><p><b>💡 Para a prova:</b> sinais de peritonite em hérnia complicada não são motivo para observação ambulatorial.</p>"},
{id:'sus26-57',number:57,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Hérnia inguinal',caseText:'Homem, 54 anos, com hérnia inguinal direita estrangulada, dolorosa e irredutível, associada a distensão e sinais de irritação peritoneal.',prompt:'Cite a conduta cirúrgica mais adequada para o paciente, neste momento:',expected:'Tratamento cirúrgico de urgência com exploração da hérnia/laparotomia conforme achados.',accepted:['cirurgia de urgência','tratamento cirúrgico de urgência','laparotomia exploratória','laparotomia exploradora','exploração cirúrgica'],concepts:['cirurg'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> hérnia estrangulada com sinais de irritação peritoneal é emergência cirúrgica. A conduta é estabilização simultânea e exploração operatória urgente; a via e a extensão dependem do estado do paciente e dos achados intraoperatórios. Pode ser necessária ressecção de alça inviável.</p><p><b>Medidas iniciais:</b> jejum, acesso venoso, reposição conforme perfusão, analgesia, exames e tipagem/prova cruzada quando indicada; antibióticos se houver suspeita de isquemia, necrose ou contaminação. Essas medidas não devem atrasar a cirurgia.</p><p><b>💡 Para a prova:</b> não tentar reduzir à força nem adiar abordagem diante de suspeita de estrangulamento/peritonite.</p>"},
{id:'sus26-58',number:58,type:'short',exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'SOP',caseText:'Mulher, 27 anos, G0P0, com ciclos de 40–60 dias desde a adolescência, infertilidade há 1 ano, IMC 32, acne, hirsutismo e acantose nigricans. Testosterona discretamente elevada, TSH e prolactina normais, resistência insulínica e ultrassom com ovários de 12 mL e ≥20 folículos periféricos.',prompt:'Indique o diagnóstico mais provável para esse caso clínico:',expected:'Síndrome dos ovários policísticos (SOP).',accepted:['síndrome dos ovários policísticos','sop','síndrome de ovários policísticos'],concepts:['ovários','policísticos'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> ciclos de 40–60 dias sugerem oligo-ovulação; acne, hirsutismo e testosterona elevada indicam hiperandrogenismo; ovários aumentados e numerosos folículos apoiam a morfologia policística. O conjunto é compatível com síndrome dos ovários policísticos (SOP).</p><p><b>Critérios:</b> em adultas, o diagnóstico geralmente exige pelo menos dois de três critérios de Rotterdam — disfunção ovulatória, hiperandrogenismo clínico/bioquímico e morfologia ovariana policística — após excluir causas alternativas, como disfunção tireoidiana, hiperprolactinemia e hiperplasia adrenal congênita não clássica, conforme o contexto.</p><p><b>💡 Para a prova:</b> SOP não é diagnosticada pelo ultrassom isoladamente; correlacione clínica e exames e exclua diagnósticos diferenciais.</p>"},
{id:'sus26-59',number:59,type:'short',exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'SOP',caseText:'Mulher, 27 anos, com irregularidade menstrual, acne/hirsutismo, hiperandrogenemia e ultrassom com morfologia policística.',prompt:'Identifique os três critérios de Rotterdam que embasam o diagnóstico dessa paciente:',expected:'Oligo/anovulação; hiperandrogenismo clínico e/ou bioquímico; morfologia ovariana policística ao ultrassom.',accepted:['oligoanovulação hiperandrogenismo ovários policísticos','oligo/anovulação hiperandrogenismo morfologia ovariana policística'],concepts:['ovulação','androgen','policíst'],requiredCount:3,resolution:"<h3>🧠 Resolução comentada</h3><p><b>Os três critérios de Rotterdam são:</b> (1) oligo-ovulação ou anovulação; (2) hiperandrogenismo clínico (por exemplo, hirsutismo) e/ou bioquímico; (3) morfologia ovariana policística ao ultrassom, conforme os critérios técnicos vigentes.</p><p>Em adultas, são necessários dois dos três critérios, após exclusão de outras causas. Portanto, não é obrigatório que os três estejam presentes. Em adolescentes, o diagnóstico exige mais cautela: irregularidade menstrual apropriada à fase pós-menarca e hiperandrogenismo, e o ultrassom não deve ser usado isoladamente para fechar SOP.</p><p><b>💡 Para a prova:</b> memorize O + H + P, mas lembre que o diagnóstico requer combinação de critérios e exclusão de mimetizadores.</p>"},
{id:'sus26-60',number:60,type:'short',exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'SOP',caseText:'Mulher, 27 anos, com SOP, obesidade e resistência insulínica, tentando engravidar há 1 ano.',prompt:'Indique a primeira conduta terapêutica preconizada para pacientes com esse quadro clínico e que desejam engravidar:',expected:'Mudança do estilo de vida com perda de peso.',accepted:['mudança do estilo de vida','mudanças de estilo de vida','perda de peso','emagrecimento','atividade física e dieta'],concepts:['peso'],resolution:"<h3>🧠 Resolução comentada</h3><p><b>Raciocínio:</b> alimentação equilibrada, atividade física e manejo do peso são componentes importantes para saúde metabólica, ovulação e gestação em pacientes com SOP e excesso de peso. Devem ser individualizados, sem estigma e sem transformar a perda ponderal em barreira para acesso ao cuidado de fertilidade.</p><p><b>Nuance clínica importante:</b> para infertilidade anovulatória por SOP, após avaliação do casal e exclusão de outros fatores, o letrozol é geralmente o fármaco de primeira linha para indução da ovulação quando não há outras contraindicações. Assim, mudança de estilo de vida é parte fundamental do cuidado, mas não deve ser apresentada como substituta universal da indução ovulatória em quem deseja engravidar.</p><p><b>💡 Para a prova:</b> diferencie a intervenção inicial sobre saúde metabólica da primeira medicação para indução da ovulação. Confira o comando exato e a diretriz adotada pela banca.</p>"}

{id:'sus26-16',number:16,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Câncer gástrico',caseText:'Paciente, sexo masculino, 63 anos de idade, procura o ambulatório com queixa de empachamento pós-prandial, perda ponderal de 10,0 kg nos últimos 4 meses e vômitos ocasionais. Nega comorbidades prévias. Ao exame físico, regular estado geral, descorado +2/+4, emagrecido; auscultas respiratória e cardíaca sem alterações; abdome plano, flácido, dor leve à palpação profunda do epigástrio, sem sinais de irritação peritoneal, massas não palpáveis. Foi realizado endoscopia digestiva alta que mostrou lesão ulcerada no antro gástrico, medindo 4,0 cm; feito biópsia que confirmou adenocarcinoma gástrico intestinal de Lauren. Realizado tomografia computadorizada de abdome e pelve que evidenciou espessamento parietal antral, linfonodos perigástricos aumentados e ausência de metástases à distância.',prompt:'Com base no caso, identifique a alternativa correta em relação à epidemiologia e fatores de risco para o câncer gástrico:',alternatives:['O tipo difuso de Lauren está mais relacionado à infecção por Helicobacter pylori do que o tipo intestinal.','A gastrectomia prévia e a gastrite atrófica autoimune aumentam o risco de adenocarcinoma gástrico.','O consumo de frutas e vegetais frescos é fator predisponente para câncer gástrico distal.','O câncer gástrico proximal tem maior associação com dieta rica em sal e nitratos do que o distal.'],correctIndex:1,alternativeExplanations:["O tipo intestinal tem associação clássica mais forte com gastrite atrófica/metaplasia intestinal e fatores ambientais, incluindo H. pylori; a alternativa inverte a associação relativa apresentada na questão.","Correta: gastrectomia prévia e gastrite atrófica autoimune são condições associadas a maior risco de adenocarcinoma gástrico, em parte por alterações crônicas da mucosa.","Frutas e vegetais frescos não são fatores predisponentes; padrões alimentares ricos nesses alimentos podem ser protetores, embora o risco dependa de múltiplos fatores.","Dieta rica em sal e alimentos conservados/nitrosados é classicamente associada sobretudo ao câncer gástrico não cárdico/distal; a alternativa atribui essa associação ao sítio errado."],resolution:"<h3>🧠 Resolução comentada — fatores de risco para câncer gástrico</h3><p><b>Gabarito oficial: B.</b> Gastrectomia prévia e gastrite atrófica autoimune estão associadas a maior risco de adenocarcinoma gástrico. A gastrite atrófica reduz a mucosa glandular normal e pode integrar a sequência inflamação crônica → atrofia → metaplasia intestinal → displasia → câncer. A gastrectomia parcial também pode aumentar o risco tardio no remanescente gástrico, dependendo do contexto e do tempo desde a cirurgia.</p><p><b>Como raciocinar:</b> perda ponderal, vômitos e empachamento são sinais de alarme e exigem investigação de neoplasia/obstrução; não são, isoladamente, fatores epidemiológicos. Outros fatores relevantes incluem infecção por <i>Helicobacter pylori</i>, tabagismo, alimentos conservados/salgados e história familiar. A associação exata entre alternativas depende das opções originais.</p><p><b>💡 Leve para a prova:</b> <i>H. pylori</i> e gastrite atrófica/metaplasia intestinal são pontos clássicos na carcinogênese gástrica.</p>"},
{id:'sus26-17',number:17,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Câncer gástrico',caseText:'Paciente, sexo masculino, 63 anos de idade, com adenocarcinoma gástrico intestinal de Lauren localizado no antro, lesão de 4,0 cm, linfonodos perigástricos aumentados e ausência de metástases à distância.',prompt:'Indique a conduta mais correta para o tratamento cirúrgico do câncer gástrico distal localizado:',alternatives:['Gastrectomia subtotal com margem distal de 3 cm, independentemente do tipo histológico.','Gastrectomia subtotal com linfadenectomia D2, sem necessidade de ressecção do omento.','Gastrectomia total com linfadenectomia D3 e esofagojejunostomia em Y de Roux para todos os tumores antrais.','Gastrectomia subtotal com margem proximal ≥ 5 cm e linfadenectomia D2, preservando o baço se não houver invasão.'],correctIndex:3,alternativeExplanations:["Uma margem fixa de 3 cm independentemente do tipo histológico não é regra universal; a extensão necessária depende do padrão de crescimento, localização e possibilidade de margem microscópica livre.","A linfadenectomia D2 é parte importante da cirurgia oncológica curativa em pacientes selecionados; afirmar que não há necessidade de ressecção do omento pode tornar a proposta incompleta conforme a técnica e o protocolo adotados.","A gastrectomia total e a linfadenectomia D3 não são obrigatórias para todos os tumores antrais; a extensão deve ser individualizada e o baço costuma ser preservado na ausência de invasão/indicação específica.","Correta segundo o gabarito apresentado: para tumor distal ressecável, a gastrectomia subtotal pode preservar estômago proximal quando se obtém margem adequada, associada à linfadenectomia D2; evitar esplenectomia sem indicação reduz morbidade."],resolution:"<h3>🧠 Resolução comentada — cirurgia do câncer gástrico distal</h3><p><b>Gabarito oficial: D.</b> Para tumor distal ressecável, a gastrectomia subtotal pode ser apropriada quando permite ressecção R0 (margens livres), associada à linfadenectomia adequada, habitualmente D2 em centros experientes. A extensão da margem deve respeitar o tipo de crescimento tumoral e a possibilidade de margem microscópica negativa; uma distância fixa de 5 cm não é regra universal para todos os tumores.</p><p><b>Baço:</b> a esplenectomia profilática não é recomendada de rotina, pois aumenta complicações sem benefício claro quando não há invasão direta ou indicação específica. A decisão cirúrgica depende do estadiamento, localização, histologia, condição clínica e discussão multidisciplinar.</p><p><b>💡 Leve para a prova:</b> objetivo da cirurgia oncológica = ressecção R0 + linfadenectomia adequada; preservar órgãos quando não há indicação de ressecção.</p>"},
{id:'sus26-18',number:18,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Câncer gástrico',caseText:'Paciente, sexo masculino, 63 anos de idade, com adenocarcinoma gástrico intestinal de Lauren no antro e ausência de metástases à distância na tomografia.',prompt:'Indique a alternativa correta em relação à avaliação pré-operatória e ao estadiamento desse paciente:',alternatives:['A endoscopia digestiva alta com biópsia é suficiente para definir o estadiamento clínico inicial.','O PET-CT substitui a tomografia de abdome no estadiamento inicial de rotina.','A ultrassonografia endoscópica é útil para determinar profundidade da invasão (T) e linfonodos regionais (N).','O estadiamento laparoscópico não tem papel na avaliação pré-operatória de tumores gástricos'],correctIndex:2,alternativeExplanations:["A endoscopia com biópsia confirma o diagnóstico histológico, mas não define sozinha a extensão T, N e M; o estadiamento requer exames de imagem e, em casos selecionados, métodos adicionais.","O PET-CT não substitui a tomografia contrastada como exame de rotina para todos os pacientes; sua utilidade depende do contexto e do tipo tumoral.","Correta: a ultrassonografia endoscópica pode detalhar a profundidade de invasão da parede gástrica e avaliar linfonodos regionais, sobretudo quando esse dado muda a estratégia terapêutica.","A laparoscopia de estadiamento pode detectar doença peritoneal oculta em pacientes selecionados com câncer potencialmente ressecável; portanto, não é correto afirmar que não tem papel."],resolution:"<h3>🧠 Resolução comentada — estadiamento do câncer gástrico</h3><p><b>Gabarito oficial: C.</b> A ecoendoscopia pode complementar o estadiamento locorregional, sobretudo estimando profundidade de invasão da parede (T) e avaliando linfonodos regionais (N), especialmente quando a doença parece inicial e o resultado pode alterar a estratégia.</p><p><b>Limites:</b> não substitui a tomografia para pesquisa de doença à distância, nem a confirmação histológica por endoscopia com biópsias. A laparoscopia de estadiamento com citologia peritoneal pode ser indicada em tumores com risco relevante de carcinomatose oculta, conforme estágio e protocolo local. Nenhum exame isolado define todo o estágio.</p><p><b>💡 Leve para a prova:</b> ecoendoscopia = avaliação T/N locorregional; TC = avaliação sistêmica; biópsia = confirmação diagnóstica.</p>"},
{id:'sus26-19',number:19,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Sangramento uterino anormal',caseText:'Mulher, 46 anos de idade, G3P3 (três partos vaginais), procura ambulatório por sangramento uterino anormal há 12 meses. Tinha ciclos menstruais regulares anteriormente, mas vem com periodos menstruais mais frequentes este ano, com fluxo intenso nos últimos 6 ciclos (coágulos e troca de absorvente a cada 1 –2 horas nos piores dias). Relata fadiga progressiva, palpitações e dois episódios de lipotimia nas últimas 2 semanas. Nega uso de ACO. Antecedentes: HAS controlada (losartana), IMC 32 Kg/m2. Exame físico: pálida (++/4), PA 130/85 mmHg, FC 88 bpm; tireoide sem alterações. Abdome flácido, indolor, Exame ginecológico: colo sem lesões, útero discretamente aumentado à palpação bimanual, sem dor anexial. Laboratório: Hb 9,8 g/dL, Ht 30%, VCM 74 fL, ferritina 8 ng/mL, TSH 2,1 mUI/L, beta-hCG negativo. USG transvaginal (fase proliferativa tardia): endométrio difusamente espessado (14 mm); miométrio heterogêneo discreto; anexos sem alterações. Paciente refere desejo de manter útero e evitar internações.',prompt:'Indique a conduta inicial mais adequada para essa paciente:',alternatives:['Histeroscopia diagnóstica com biópsia dirigida.','Curetagem uterina diagnóstica.','Progestagênio oral empírico.','Apenas acompanhamento clínico.'],correctIndex:0,resolution:"<h3>🧠 Resolução comentada — investigação do sangramento uterino anormal</h3><p><b>Gabarito oficial: A.</b> Na mulher de 46 anos com sangramento uterino anormal persistente, é necessário investigar causas estruturais e excluir hiperplasia ou câncer endometrial. A histeroscopia permite visualizar a cavidade e realizar biópsia dirigida, sendo especialmente útil quando há suspeita de lesão focal ou quando a investigação inicial não esclarece o quadro.</p><p><b>Nuance importante:</b> em pacientes com 45 anos ou mais, a amostragem endometrial costuma ser indicada na avaliação do SUA; o método inicial pode variar conforme estabilidade clínica, achados de imagem, disponibilidade e protocolo. A histeroscopia não deve atrasar estabilização de sangramento agudo importante.</p><p><b>💡 Leve para a prova:</b> SUA persistente a partir dos 45 anos → avaliar endométrio e obter amostra histológica.</p>"},
{id:'sus26-20',number:20,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Sangramento uterino anormal',caseText:'Mulher, 46 anos, com sangramento uterino anormal, IMC 32 Kg/m2 e endométrio difusamente espessado (14 mm).',prompt:'Com base no caso apresentado e no conhecimento sobre fatores de risco para hiperplasia/carcinoma endometrial, identifique o principal fator de risco:',alternatives:['História familiar de câncer de mama.','Uso de losartana.','Obesidade.','Menarca tardia.'],correctIndex:2,resolution:"<h3>🧠 Resolução comentada — risco de hiperplasia/câncer endometrial</h3><p><b>Gabarito oficial: C.</b> A obesidade é um fator de risco importante para hiperplasia e carcinoma endometrial, sobretudo em contexto de anovulação. O tecido adiposo aumenta a aromatização periférica de andrógenos em estrogênios; sem oposição adequada da progesterona, ocorre estímulo proliferativo endometrial.</p><p><b>Como interpretar:</b> IMC 32 kg/m² e sangramento anormal justificam investigação, mas a espessura endometrial de 14 mm em mulher ainda potencialmente pré-menopáusica não deve ser interpretada isoladamente, pois varia com a fase do ciclo. Idade, padrão do sangramento, fatores de risco e histologia orientam a conduta.</p><p><b>💡 Leve para a prova:</b> obesidade, anovulação crônica, exposição estrogênica sem oposição, tamoxifeno e síndrome de Lynch aumentam o risco endometrial.</p>"},
{id:'sus26-21',number:21,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Sangramento uterino anormal',caseText:'Mulher, 46 anos, com sangramento uterino anormal intenso, Hb 9,8 g/dL, VCM 74 fL e ferritina 8 ng/mL.',prompt:'Indique a medida terapêutica adjuvante que pode ser iniciada concomitantemente à investigação diagnóstica desse caso:',alternatives:['Inserção de DIU medicado com levonorgestrel.','Administração empírica de GnRH agonista por 6 meses.','Terapia estrogênica isolada contínua.','Suplementação de ferro.'],correctIndex:3,resolution:"<h3>🧠 Resolução comentada — anemia associada ao SUA</h3><p><b>Gabarito oficial: D.</b> Hemoglobina de 9,8 g/dL, VCM baixo e ferritina de 8 ng/mL são compatíveis com anemia ferropriva, provavelmente relacionada à perda sanguínea crônica. A reposição de ferro pode ser iniciada paralelamente à investigação e ao controle da causa do sangramento.</p><p><b>Conduta prática:</b> a via oral é frequentemente adequada se houver tolerância e tempo para resposta; ferro intravenoso pode ser considerado conforme gravidade, intolerância, má absorção, necessidade de correção mais rápida ou contexto clínico. Avaliar estabilidade hemodinâmica e intensidade do sangramento; transfusão não é indicada apenas por esse valor de Hb, devendo considerar sintomas, estabilidade e contexto.</p><p><b>💡 Leve para a prova:</b> ferritina baixa confirma depleção de ferro; tratar a anemia não substitui investigar a causa do sangramento.</p>"},
{id:'sus26-22',number:22,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Síndrome do anticorpo antifosfolípide',caseText:'Mulher, 32 anos de idade, G3P0A3. Três perdas gestacionais consecutivas com <12 semanas: 8, 9 e 10 semanas (todas com embrião e BCF prévio, seguidas de sangramento). Nega infecções nas gestações; nega consumo de álcool ou tabagismo. Sem antecedente de trombose, IMC 24 kg/m². Dados da investigação já feita: histerossalpingografia e histeroscopia diagnóstica normais; ultrassom 3D sem malformações. Cariótipo parental: 46, XX/46, XY. TSH 1,5 mUI/L; prolactina normal; trombofilias hereditárias ausentes. Anticorpos antifosfolípides: anticardiolipina IgG elevada em duas coletas com 14 semanas de intervalo; anticoagulante lúpico negativo; anti-β2GP1 limítrofe.',prompt:'Diante do quadro clínico, identifique o diagnóstico mais provável:',alternatives:['Insuficiência lútea.','Síndrome do anticorpo antifosfolípide (SAAF).','Malformação uterina.','Infecção crônica uterina.'],correctIndex:1,resolution:"<h3>🧠 Resolução comentada — diagnóstico de síndrome antifosfolípide</h3><p><b>Gabarito oficial: B.</b> Três perdas gestacionais consecutivas antes de 10 semanas levantam suspeita de síndrome antifosfolípide (SAF), especialmente após excluir outras causas. Para classificação laboratorial, é necessário demonstrar persistência de pelo menos um anticorpo antifosfolípide relevante — anticoagulante lúpico, anticardiolipina IgG/IgM em título significativo ou anti-β2-glicoproteína I — em duas ocasiões com intervalo mínimo de 12 semanas.</p><p><b>Atenção:</b> o diagnóstico clínico exige integrar critérios obstétricos/trombóticos e laboratoriais; perdas gestacionais recorrentes não confirmam SAF sozinhas. A avaliação diferencial inclui alterações anatômicas uterinas, causas genéticas, endócrinas e outras condições clínicas.</p><p><b>💡 Leve para a prova:</b> perdas gestacionais recorrentes + anticorpos antifosfolípides persistentes = pensar em SAF, confirmando critérios clínicos e laboratoriais.</p>"},
{id:'sus26-23',number:23,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Síndrome do anticorpo antifosfolípide',caseText:'Mulher, 32 anos, G3P0A3, com três perdas gestacionais consecutivas e anticardiolipina IgG elevada em duas coletas com 14 semanas de intervalo.',prompt:'Indique a conduta recomendada na próxima gestação, segundo protocolos nacionais e internacionais:',alternatives:['AAS em baixa dose e heparina de baixo peso molecular profilática.','Apenas AAS.','Prednisona e AAS.','Progesterona vaginal isolada.'],correctIndex:0,resolution:"<h3>🧠 Resolução comentada — SAF obstétrica e prevenção de recorrência</h3><p><b>Gabarito oficial: A.</b> Em gestante com SAF obstétrica confirmada e histórico de perdas gestacionais, recomenda-se com frequência AAS em baixa dose associado à heparina em dose profilática, como heparina de baixo peso molecular, conforme avaliação especializada e protocolo vigente.</p><p><b>Não generalizar:</b> essa combinação não deve ser prescrita automaticamente a toda pessoa com abortamento recorrente ou um anticorpo positivo isolado. A persistência dos anticorpos, o perfil de risco, história de trombose, contraindicações e plano de parto/puerpério precisam ser considerados. SAF trombótica pode exigir anticoagulação terapêutica, diferente da estratégia para SAF obstétrica sem trombose.</p><p><b>💡 Leve para a prova:</b> SAF obstétrica com perdas recorrentes: AAS baixa dose + heparina profilática é a estratégia clássica, individualizada pela equipe obstétrica/hematológica.</p>"},
{id:'sus26-24',number:24,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Síndrome do anticorpo antifosfolípide',caseText:'Mulher, 32 anos, com diagnóstico do caso compatível com síndrome do anticorpo antifosfolípide e histórico de perdas gestacionais recorrentes.',prompt:'Indique outra complicação obstétrica associada ao diagnóstico do caso, além de abortos recorrentes:',alternatives:['Acretismo placentário.','Diabetes gestacional.','Pré-eclâmpsia grave e/ou parto prematuro < 34 semanas.','Gestação ectópica.'],correctIndex:2,resolution:"<h3>🧠 Resolução comentada — complicações obstétricas da SAF</h3><p><b>Gabarito oficial: C.</b> A síndrome antifosfolípide associa-se a complicações mediadas por disfunção placentária, incluindo pré-eclâmpsia grave, insuficiência placentária, restrição do crescimento fetal, parto prematuro e óbito fetal. A associação é particularmente relevante quando há parto antes de 34 semanas por pré-eclâmpsia grave/eclâmpsia ou insuficiência placentária.</p><p><b>Como raciocinar:</b> os anticorpos antifosfolípides estão associados a trombose e alterações de implantação/placentação; por isso o quadro não se limita a abortamentos precoces. A presença de uma complicação isolada não confirma SAF sem a avaliação clínica e laboratorial necessária.</p><p><b>💡 Leve para a prova:</b> SAF pode causar perdas precoces, óbito fetal e morbidade placentária com pré-eclâmpsia grave/parto prematuro.</p>"},
{id:'sus26-25',number:25,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Diabetes gestacional',caseText:'Mulher, 28 anos de idade, G2P1, 26 semanas de gestação, sem comorbidades prévias. História familiar de diabetes mellitus tipo 2 (pai). Ganho ponderal de 10 kg até o momento. Teste oral de tolerância à glicose (TOTG) 75 g: jejum 94 mg/dL; 1 h: 185 mg/dL; 2 h: 161 mg/dL. Relata alimentação rica em carboidratos simples e rotina sedentária por trabalho administrativo. Ultrassonografia obstétrica às 26 semanas: feto único, crescimento adequado (p60), líquido amniótico normal, doppler normal. Sem cetonúria. Não usa medicamentos. Solicita plano alimentar estruturado.',prompt:'Segundo as Diretrizes Nacionais da FEBRASGO, os dados clinicos e laboratoriais apresentados por essa paciente são compatíveis com:',alternatives:['Gestação normal.','Diabetes mellitus gestacional.','Pré-diabetes.','Diabetes prévio (diabetes melittus tipo 2).'],correctIndex:1,resolution:"<h3>🧠 Resolução comentada — diagnóstico de diabetes gestacional</h3><p><b>Gabarito oficial: B.</b> No TOTG com 75 g, os pontos de corte amplamente utilizados para diagnóstico de diabetes gestacional são glicemia de jejum ≥92 mg/dL, 1 hora ≥180 mg/dL ou 2 horas ≥153 mg/dL; basta um valor alterado. Neste caso, jejum 94 mg/dL e 1 hora 185 mg/dL ultrapassam os respectivos limites.</p><p><b>Como interpretar:</b> o exame foi realizado no segundo trimestre, período habitual de rastreamento. Os critérios adotados devem seguir a diretriz/protocolo nacional vigente no serviço, mas os dois valores apresentados já são diagnósticos pelos critérios de um passo mais usados.</p><p><b>💡 Leve para a prova:</b> TOTG 75 g: 92 / 180 / 153 mg/dL (jejum / 1 h / 2 h); um único valor alterado basta.</p>"},
{id:'sus26-26',number:26,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Diabetes gestacional',caseText:'Mulher, 28 anos, G2P1, 26 semanas, com TOTG 75 g alterado e quadro classificado pela banca como diabetes mellitus gestacional. Alimentação rica em carboidratos simples e rotina sedentária.',prompt:'Indique a primeira medida terapêutica recomendada para essa gestante:',alternatives:['Iniciar insulina NPH à noite.','Iniciar metformina oral','Modificar a dieta e indicar atividade física.','Prescrever glibenclamida oral.'],correctIndex:2,resolution:"<h3>🧠 Resolução comentada — tratamento inicial do diabetes gestacional</h3><p><b>Gabarito oficial: C.</b> A primeira abordagem costuma incluir orientação nutricional individualizada, distribuição adequada dos carboidratos, atividade física segura e automonitorização glicêmica. Deve-se acompanhar o crescimento fetal e o controle materno.</p><p><b>Quando intensificar:</b> se as metas glicêmicas não forem atingidas após período curto de intervenção no estilo de vida, ou se houver hiperglicemia importante, considera-se tratamento farmacológico — a insulina é a opção preferencial em muitas diretrizes por não atravessar a placenta em quantidade clinicamente relevante. A decisão e o prazo dependem dos valores, do protocolo e da avaliação obstétrica.</p><p><b>💡 Leve para a prova:</b> começar com alimentação + atividade física + monitorização; adicionar fármaco se as metas não forem alcançadas.</p>"},
{id:'sus26-27',number:27,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Diabetes gestacional',caseText:'Gestante de 28 anos, 26 semanas, com diabetes mellitus gestacional em acompanhamento.',prompt:'Indique os níveis glicêmicos desejáveis como metas, no acompanhamento dessa paciente:',alternatives:['Glicemias de Jejum < 110 mg/dL','Glicemias de Jejum entre 65 - 95 mg/dL','Glicemias Pós-prandiais (2h) < 160 mg/dL','Glicemias de Jejum < 100 mg/dL e Pós-prandiais (2h) < 180 mg/dL'],correctIndex:1,resolution:"<h3>🧠 Resolução comentada — metas glicêmicas no diabetes gestacional</h3><p><b>Gabarito oficial: B.</b> Metas frequentemente utilizadas no acompanhamento são glicemia de jejum <95 mg/dL, 1 hora após o início da refeição <140 mg/dL ou 2 horas <120 mg/dL. A alternativa citada pela banca, jejum de 65–95 mg/dL, corresponde ao intervalo-meta adotado em muitos protocolos, desde que não haja hipoglicemia.</p><p><b>Como usar:</b> metas devem ser individualizadas e interpretadas junto às glicemias pós-prandiais, episódios de hipoglicemia e evolução fetal. Uma medida isolada não resume o controle; avalia-se o padrão ao longo dos dias.</p><p><b>💡 Leve para a prova:</b> jejum <95; 1 h pós-prandial <140; 2 h <120 mg/dL — confirme o protocolo local.</p>"},
{id:'sus26-28',number:28,exam:'SUS-BA 2026',area:'Pediatria',topic:'Crescimento e puberdade',caseText:'Menino, 12 anos de idade, vai à consulta pediátrica acompanhado dos pais e apresenta a seguinte queixa: “Meus amigos já cresceram e eu não”. A história mostra uma criança saudável, sem antecedentes de doenças crônicas. O pai refere ter sido o menor da turma e que “cresceu só no último ano do colégio”. Exame físico: altura no percentil 3, velocidade de crescimento de 4 cm/ano, Tanner I. Idade óssea atrasada em 2 anos. Sem dismorfismos.',prompt:'Indique a hipótese diagnóstica a ser considerada, prioritariamente, para esse caso:',alternatives:['Síndrome genética.','Deficiência de GH.','Baixa estatura familiar.','Atraso constitucional do crescimento e da puberdade.'],correctIndex:3,resolution:"<h3>🧠 Resolução comentada — atraso constitucional do crescimento e puberdade</h3><p><b>Gabarito oficial: D.</b> A história familiar de maturação tardia, o bom estado geral e a ausência de doença crônica favorecem atraso constitucional do crescimento e da puberdade. Em geral, há velocidade de crescimento relativamente preservada para a fase pré-puberal, idade óssea atrasada e início puberal mais tardio que o dos pares.</p><p><b>Diagnósticos diferenciais:</b> baixa estatura familiar, desnutrição, doença crônica, hipotireoidismo, deficiência de GH e hipogonadismo. A história e o exame físico orientam a investigação; desaceleração importante da velocidade de crescimento, sinais sistêmicos ou ausência de progressão puberal fora da faixa esperada exigem avaliação.</p><p><b>💡 Leve para a prova:</b> atraso constitucional é diagnóstico de exclusão e costuma ter história familiar e idade óssea atrasada.</p>"},
{id:'sus26-29',number:29,exam:'SUS-BA 2026',area:'Pediatria',topic:'Crescimento e puberdade',caseText:'Menino, 12 anos, saudável, altura no percentil 3, Tanner I, idade óssea atrasada em 2 anos e história paterna de maturação tardia.',prompt:'Analise a evolução natural dessa condição e identifique a alternativa correta:',alternatives:['O crescimento acelera tardiamente, com estatura final normal.','O crescimento geralmente permanece comprometido na vida adulta.','A estatura final é sempre menor que o percentil 3.','Há risco elevado de obesidade e dislipidemia.'],correctIndex:0,resolution:"<h3>🧠 Resolução comentada — evolução do atraso constitucional</h3><p><b>Gabarito oficial: A.</b> No atraso constitucional do crescimento e da puberdade, o estirão puberal ocorre mais tarde. Como a maturação esquelética também está atrasada, há mais tempo para crescimento antes do fechamento das cartilagens; por isso, a estatura adulta frequentemente fica dentro do potencial genético, embora não seja possível garantir resultado normal em todos os casos.</p><p><b>Seguimento:</b> medir altura em série e calcular velocidade de crescimento, avaliar estágio puberal e comparar idade óssea com idade cronológica. Não atribuir automaticamente toda baixa estatura a atraso constitucional sem excluir doença sistêmica ou endocrinológica quando houver sinais de alerta.</p><p><b>💡 Leve para a prova:</b> maturação tardia → estirão tardio; prognóstico geralmente favorável, com acompanhamento.</p>"},
{id:'sus26-30',number:30,exam:'SUS-BA 2026',area:'Pediatria',topic:'Baixa estatura',caseText:'Menino, 12 anos, em investigação de baixa estatura e atraso puberal.',prompt:'Sobre as causas de baixa estatura em crianças, é correto afirmar:',alternatives:['A baixa estatura idiopática é uma condição rara no desenvolvimento infantil.','A maioria dos casos de baixa estatura apresentará uma causa genética identificável.','Cerca de 5% das crianças com baixa estatura têm uma condição patológica definida.','A deficiência de GH está presente entre 20 e 30% das crianças com baixa estatura.'],correctIndex:2,resolution:"<h3>🧠 Resolução comentada — avaliação da baixa estatura</h3><p><b>Gabarito oficial: C.</b> A maioria das crianças com baixa estatura não apresenta doença grave; muitas têm baixa estatura familiar ou atraso constitucional. Uma minoria — a proporção varia conforme a população e os critérios utilizados — terá uma causa patológica definida. Por isso, o percentual de “cerca de 5%” deve ser entendido como estimativa de prova, não como número universal aplicável a toda população.</p><p><b>Abordagem:</b> confirmar medidas e trajetória de crescimento, calcular velocidade de crescimento, avaliar estatura-alvo familiar, proporções corporais, estágio puberal, idade óssea e sinais de doença crônica/endócrina. Queda de percentis, velocidade reduzida, desproporção, sintomas sistêmicos ou estatura muito abaixo do alvo familiar justificam investigação direcionada.</p><p><b>💡 Leve para a prova:</b> não basta um único percentil: a velocidade de crescimento e a trajetória longitudinal são fundamentais.</p>"}

almar. O tecido subcutâneo é escasso e a musculatura é hipotrófica.","prompt":"Indique, entre as deficiências nutricionais citadas, a mais frequente e compatível com a combinação de apatia e cabelos quebradiços observada nesta criança:","alternatives":["Deficiência de vitamina A.","Deficiência de vitamina C .","Deficiência de rerro e zinco.","Deficiência de vitamina D."],"correctIndex":2,"resolution":"<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: C.</b></p>"},{"id":"sus26-37","number":37,"exam":"SUS-BA 2026","area":"Preventiva","topic":"Saúde indígena","caseText":"Uma Equipe Multidisciplinar de Saúde Indígena atua em uma aldeia de um povo originário localizada no semiárido nordestino. A comunidade mantém organização sociopolítica própria, com lideranças tradicionais reconhecidas e práticas de cuidado compartilhadas entre Agentes de Saúde Indígenas, parteiras e rezadores. Com o início da estação seca, o acesso à água potável torna-se mais difícil e a logística de deslocamento até o polo-base é limitada. A equipe identifica aumento de casos de infecções respiratórias, interrupções vacinais e a necessidade de cuidado pré-natal mais próximo. As lideranças da aldeia solicitam que o planejamento seja construído respeitando os rituais, o calendário cultural e as práticas tradicionais de cura, sem imposição externa.","prompt":"A estrutura de Atenção à Saúde Indígena no Brasil fundamenta-se na articulação entre equipes locais e serviços de referência do SUS. Identifique o elemento central para essa organização territorial:","alternatives":["Núcleo de Apoio à Saúde da Família da região urbana mais próxima.","Distrito Sanitário Especial Indígena, com gestão articulada e base territorial definida.","Coordenação direta pelas Secretarias Municipais de Saúde, com supervisão estadual.","Organização assistencial centrada em hospitais gerais de referência regionais."],"correctIndex":1,"resolution":"<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: B.</b></p>"},{"id":"sus2 o da estação seca, o acesso à água potável torna-se mais difícil e a logística de deslocamento até o polo-base é limitada. A equipe identifica aumento de casos de infecções respiratórias, interrupções vacinais e a necessidade de cuidado pré-natal mais próximo. As lideranças da aldeia solicitam que o planejamento seja construído respeitando os rituais, o calendário cultural e as práticas tradicionais de cura, sem imposição externa.","prompt":"Indique a estratégia mais efetiva para melhorar a cobertura vacinal, considerando barreiras geográficas, calendário cultural próprio e limitações de deslocamento ao polo-base:","alternatives":["Realizar campanhas anuais conduzidas por equipes externas.","Priorizar atendimento apenas na demanda espontânea no polo-base.","Planejar microterritorialização com participação da comunidade e de Agentes Indígenas de Saúde.","Padronizar o calendário vacinal e o cronograma de visitas com base no fluxo administrativo municipal."],"correctIndex":2,"resolution":"<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: C.</b></p>"},{"id":"sus26-40","number":40,"exam":"SUS-BA 2026","area":"Preventiva","topic":"Síndrome de Down na APS","caseText":"Criança, 2 anos de idade, com diagnóstico neonatal de Síndrome de Down e história de cardiopatia congênita corrigida cirurgicamente aos 8 meses de idade, acompanhada, inicialmente, em serviço de referência. Após a alta da equipe das especialidades, a família passou a comparecer de forma irregular à Unidade de Saúde da Família (USF). A mãe relata preocupação com atraso motor, pouca interação com outras crianças e dificuldades de acesso regular à fonoaudiologia e à fisioterapia. A criança não frequenta creche, passa a maior parte do tempo em casa sob o cuidado da avó e apresenta poucas oportunidades de estimulação. Os pais demonstram insegurança quanto às metas de desenvolvimento e pedem orientações claras.","prompt":"Indique a conduta central da Atenção Primária à Saúde (APS) para organizar e garantir a co // Reconcile SUS-BA 2024.1 against the definitive Strix answer key, including annulments.
// Retain every original attempt and selected alternative; repair grading and stored seed metadata.
function reconcileSUS241Definitive(){
 let changed=false;
 // Rebuild the FULL official exam from the original source on every local/cloud load.
 // A previously saved question may have the correct ID but a shifted stem or choices.
 const seeds=new Map(SUS241.map(q=>[q.id,q]));
 const officialFields=['number','exam','area','topic','type','caseText','prompt','alternatives','correctIndex','annulled','resolution'];
 const seen=new Set();
 for(const saved of db.bankQuestions||[]){
  const seed=seeds.get(saved.id);if(!seed)continue;
  seen.add(seed.id);
  for(const k of officialFields){
   if(JSON.stringify(saved[k])!==JSON.stringify(seed[k])){
    if(seed[k]===undefined)delete saved[k];else saved[k]=seed[k];
    changed=true;
   }
  }
 }
 for(const seed of SUS241){if(!seen.has(seed.id)){db.bankQuestions.push({...seed});changed=true}}
 // Correct previous grading without deleting attempts or changing selected answers.
 for(const attempt of db.bankAttempts||[]){
  const seed=seeds.get(attempt.questionId);if(!seed||seed.number>45)continue;
  const correct=seed.annulled?true:attempt.answer===seed.correctIndex;
  if(attempt.correct!==correct){attempt.correct=correct;attempt.correctedByDefinitive=true;changed=true}
 }
 return changed;
}

 const t=Date.now(),ms=Math.max(0,t-studyClock.lastFlush),wasVisible=studyClock.lastWasVisible;
 studyClock.lastFlush=t;

 if(!currentUser||!countable||ms<=0)return;
 const key=day(),label=studyClock.route||route||'Geral';
 db.siteUsage=db.siteUsage||{};

 db.siteUsage[key]=before+ms;

 if(ms>=15000)db.studyTime[key][label]=(db.studyTime[key][label]||0)+ms;

// Image occlusion assets live in IndexedDB so large images do not overflow localStorage.
const FLASHMED_ASSET_DB='flashmed_assets_v1',FLASHMED_ASSET_STORE='images';
function flashmedAssetDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(FLASHMED_ASSET_DB,1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains(FLASHMED_ASSET_STORE))d.createObjectStore(FLASHMED_ASSET_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function flashmedAssetPut(id,value){let d=await flashmedAssetDB();return new Promise((resolve,reject)=>{let tx=d.transaction(FLASHMED_ASSET_STORE,'readwrite');tx.objectStore(FLASHMED_ASSET_STORE).put(value,id);tx.oncomplete=()=>{d.close();resolve(true)};tx.onerror=()=>{d.close();reject(tx.error)}})}
async function flashmedAssetGet(id){let d=await flashmedAssetDB();return new Promise((resolve,reject)=>{let tx=d.transaction(FLASHMED_ASSET_STORE,'readonly'),q=tx.objectStore(FLASHMED_ASSET_STORE).get(id);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error);tx.oncomplete=()=>d.close()})}
async function flashmedAssetDelete(id){let d=await flashmedAssetDB();return new Promise((resolve,reject)=>{let tx=d.transaction(FLASHMED_ASSET_STORE,'readwrite');tx.objectStore(FLASHMED_ASSET_STORE).delete(id);tx.oncomplete=()=>{d.close();resolve(true)};tx.onerror=()=>{d.close();reject(tx.error)}})}
const OCCLUSION_CARDS_STORE_KEY='__flashmed_occlusion_cards_v1__';
async function occlusionLoadDedicatedCards(target=db){
  try{let box=await flashmedAssetGet(OCCLUSION_CARDS_STORE_KEY);let saved=box&&Array.isArray(box.cards)?box.cards:[];target.cards=target.cards||[];let seen=new Set(target.cards.map(c=>String(c.id)));let added=0;for(const c of saved){if(!seen.has(String(c.id))){target.cards.push(c);seen.add(String(c.id));added++}}return added}catch(e){console.warn('Não foi possível carregar cartões de oclusão',e);return 0}
}
async function occlusionSaveDedicatedCards(cards){
  try{
    let box=await flashmedAssetGet(OCCLUSION_CARDS_STORE_KEY),saved=box&&Array.isArray(box.cards)?box.cards:[],byId=new Map(saved.map(c=>[String(c.id),c]));
    for(const c of cards)byId.set(String(c.id),JSON.parse(JSON.stringify(c)));
    await flashmedAssetPut(OCCLUSION_CARDS_STORE_KEY,{cards:[...byId.values()],savedAt:Date.now()});
    let verify=await flashmedAssetGet(OCCLUSION_CARDS_STORE_KEY),ids=new Set((verify&&Array.isArray(verify.cards)?verify.cards:[]).map(c=>String(c.id))),written=cards.filter(c=>ids.has(String(c.id))).length;
    return {ok:written===cards.length,written,total:cards.length};
  }catch(e){console.error('Falha no banco dedicado de oclusão',e);return {ok:false,written:0,total:cards.length}}
}
async function occlusionDeleteDedicatedCard(id){
  try{let box=await flashmedAssetGet(OCCLUSION_CARDS_STORE_KEY);if(!box||!Array.isArray(box.cards))return true;box.cards=box.cards.filter(c=>String(c.id)!==String(id));box.savedAt=Date.now();await flashmedAssetPut(OCCLUSION_CARDS_STORE_KEY,box);return true}catch(e){console.warn('Falha ao remover cartão dedicado',e);return false}

function agendaEvents(){const events=Array.isArray(db.agendaEvents)?db.agendaEvents:[],deleted=new Set(Array.isArray(db.deletedAgendaEventIds)?db.deletedAgendaEventIds.map(String):[]);const crem={id:"fm-cremeb-crm-docs-20261103",title:"Ida ao CREMEB — entrega de documentação para o CRM",date:"2026-11-03",time:"",category:"Compromisso importante",priority:"alta",duration:0,important:true};const all=events.some(e=>String(e.id)===crem.id)?events:events.concat([crem]);return all.filter(e=>!deleted.has(String(e.id)))}
function agendaParseQuickText(raw){
 const text=String(raw||'').trim();if(!text)return {title:'',date:'',time:''};
 let work=text,date='',time='';
 const nowDate=new Date();nowDate.setHours(12,0,0,0);
 const explicit=work.match(/\b(?:dia\s*)?(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);
 if(explicit){let y=explicit[3]?Number(explicit[3]):nowDate.getFullYear();if(y<100)y+=2000;const d=Number(explicit[1]),m=Number(explicit[2]);const candidate=new Date(y,m-1,d,12);if(candidate.getFullYear()===y&&candidate.getMonth()===m-1&&candidate.getDate()===d){date=agendaDateKey(candidate);work=work.replace(explicit[0],' ')}}
 if(!date){
  const rel=work.match(/\b(depois de amanh[ãa]|amanh[ãa]|hoje)(?=\s|$|[,.;])/i);
  if(rel){const d=new Date(nowDate);const word=rel[1].toLocaleLowerCase('pt-BR');d.setDate(d.getDate()+(word.startsWith('depois')?2:word.startsWith('amanh')?1:0));date=agendaDateKey(d);work=work.replace(rel[0],' ')}
 }
 if(!date){
  const normalized=work.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
  const weekday=normalized.match(/\b(domingo|segunda(?:-feira)?|terca(?:-feira)?|quarta(?:-feira)?|quinta(?:-feira)?|sexta(?:-feira)?|sabado)\b/);
  const originalWeekday=work.match(/\b(domingo|segunda(?:-feira)?|terça(?:-feira)?|terca(?:-feira)?|quarta(?:-feira)?|quinta(?:-feira)?|sexta(?:-feira)?|sábado|sabado)\b/i);
  if(weekday){const names=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];let word=weekday[1].split('-')[0],target=names.indexOf(word),delta=(target-nowDate.getDay()+7)%7;const d=new Date(nowDate);d.setDate(d.getDate()+delta);date=agendaDateKey(d);if(originalWeekday)work=work.replace(originalWeekday[0],' ')}
 }
 const tm=work.match(/\b(?:às?\s*)?([01]?\d|2[0-3])(?:h|:([0-5]\d))\b/i);
 if(tm){time=String(Number(tm[1])).padStart(2,'0')+':'+(tm[2]||'00');work=work.replace(tm[0],' ')}
 work=work.replace(/\b(as|dia|na|no|em)\b|às/gi,' ').replace(/[,\-–—]+/g,' ').replace(/\s+/g,' ').trim();
 return {title:work,date,time};
}
