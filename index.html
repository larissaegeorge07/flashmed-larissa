function plannerParseNaturalTask(raw){let title=String(raw||'').trim(),date='',minutes=30,time='';const dm=title.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/);if(dm){let y=+dm[3];if(y<100)y+=2000;const d=new Date(y,+dm[2]-1,+dm[1],12);if(d.getFullYear()!==y||d.getMonth()!==+dm[2]-1||d.getDate()!==+dm[1])return {error:'Confira a data.'};date=agendaDateKey(d);title=title.replace(dm[0],' ')}const du=title.match(/\b(?:durante|por)\s+(\d{1,3})\s*(?:minutos|min)\b/i)||title.match(/\b(\d{1,3})\s*(?:minutos|min)\b/i);if(du){minutes=+du[1];if(minutes<15||minutes>720)return {error:'Use duração de 15 a 720 minutos.'};title=title.replace(du[0],' ')}const tm=title.match(/\b(?:às?\s*)?([01]?\d|2[0-3])(?:h|:([0-5]\d))\b/i);if(tm){time=String(+tm[1]).padStart(2,'0')+':'+(tm[2]||'00');title=title.replace(tm[0],' ')}title=title.replace(/[,;]+/g,' ').replace(/\s+/g,' ').trim();if(!title)return {error:'Escreva a tarefa.'};if(!date)return {error:'Inclua a data (DD/MM/AAAA).'};return {title,date,minutes,time,priority:'normal'}}
function plannerPriorityMeta(p){const map={alta:{label:'Alta prioridade',cls:'high'},normal:{label:'Prioridade normal',cls:'normal'},baixa:{label:'Pode ser feito depois',cls:'low'}};return map[p]||map.normal}
function plannerSetTaskPriority(id,value){if(!['alta','normal','baixa'].includes(value))return;const p=db.studyPlan||{},t=(p.weeklyTasks||[]).find(x=>String(x.id)===String(id));if(!t)return;t.priority=value;for(const item of p.weekSchedule||[])if(String(item.taskId||item.id)===String(id))item.priority=value;for(const e of db.agendaEvents||[])if(String(e.studyTaskId||'')===String(id))e.priority=value;save();render()}
function plannerTaskListHtml(){const ts=db.studyPlan?.weeklyTasks||[];return ts.length?ts.map(t=>{const pr=plannerPriorityMeta(t.priority);return '<div class="fmTaskItem priority-'+pr.cls+'"><div><b>'+esc(t.title)+'</b><small>'+esc(agendaFormatDate(t.date||'',{day:'2-digit',month:'short',year:'numeric'}))+' · '+(t.minutes||30)+' min · <span class="fmPriorityLabel">'+pr.label+'</span></small></div><div class="fmTaskActions"><select aria-label="Prioridade" onchange="plannerSetTaskPriority('+JSON.stringify(t.id).replace(/"/g,'&quot;')+',this.value)" class="fmPrioritySelect"><option value="alta" '+(t.priority==='alta'?'selected':'')+'>Alta</option><option value="normal" '+((!t.priority||t.priority==='normal')?'selected':'')+'>Normal</option><option value="baixa" '+(t.priority==='baixa'?'selected':'')+'>Depois</option></select><button onclick="plannerEditNaturalTask('+JSON.stringify(t.id).replace(/"/g,'&quot;')+')">Editar</button><button onclick="plannerDeleteNaturalTask('+JSON.stringify(t.id).replace(/"/g,'&quot;')+')">×</button></div></div>'}).join(''):'<p class="muted">Nenhuma tarefa cadastrada.</p>'}

function plannerAddStructuredTask(){const title=(document.getElementById('spTaskTitle')?.value||'').trim(),dateInput=document.getElementById('spTaskDate')?.value||'',time=document.getElementById('spTaskTime')?.value||'',msg=document.getElementById('spTaskMessage'),recurring=!!document.getElementById('spTaskRecurring')?.checked,minutes=Number(document.getElementById('spTaskDuration')?.value||30);if(!title){if(msg)msg.textContent='Informe o nome da atividade.';return}if(!Number.isFinite(minutes)||minutes<5||minutes>720){if(msg)msg.textContent='A duração deve ser entre 5 e 720 minutos.';return}const startDate=dateInput||agendaDateKey(new Date());if(!recurring&&!dateInput){if(msg)msg.textContent='Escolha a data da tarefa.';return}const days=recurring?[...document.querySelectorAll('input[name="spRecurringDay"]:checked')].map(x=>Number(x.value)):[];if(recurring&&!days.length){if(msg)msg.textContent='Escolha pelo menos um dia da semana.';return}const p=db.studyPlan||(db.studyPlan={}),priority=document.getElementById('spTaskPriority')?.value||'normal',taskCategory=document.getElementById('spTaskCategory')?.value||'outros',color=plannerCategoryColor(taskCategory);if(!Array.isArray(p.weeklyTasks))p.weeklyTasks=[];if(!Array.isArray(p.weekSchedule))p.weekSchedule=[];if(!Array.isArray(db.agendaEvents))db.agendaEvents=[];const seriesId='routine_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),base=new Date(startDate+'T12:00:00');if(recurring){let count=0;for(let w=0;w<53;w++){for(const weekday of days){const d=new Date(base);d.setDate(base.getDate()+w*7+((weekday-(base.getDay()||7)+7)%7));const date=agendaDateKey(d);if(date<startDate)continue;if(count>=days.length*53)break;const id=seriesId+'_'+date;p.weeklyTasks.push({id,seriesId,recurring:true,title,date,minutes,priority,color,taskCategory,done:false,time});p.weekSchedule.push({id:'ws_'+id,date,dateLabel:d.toLocaleDateString('pt-BR'),taskId:id,title,priority,color,taskCategory,minutes,startTime:time,endTime:' function plannerAddNaturalTask(){const el=document.getElementById('spTaskQuick'),msg=document.getElementById('spTaskMessage'),v=plannerParseNaturalTask(el?.value||'');if(v.error){if(msg)msg.textContent=v.error;return}const p=db.studyPlan||(db.studyPlan={}),priority=document.getElementById('spTaskPriority')?.value||'normal',color=document.getElementById('spTaskColor')?.value||'#8b6bb1';if(!Array.isArray(p.weeklyTasks))p.weeklyTasks=[];const id='wt_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);p.weeklyTasks.push({id,title:v.title,date:v.date,minutes:v.minutes,priority,color,done:false,time:v.time});if(!Array.isArray(db.agendaEvents))db.agendaEvents=[];db.agendaEvents.push({id:'ag_task_'+id,title:v.title,date:v.date,time:v.time||'',duration:v.minutes,category:'Estudos',priority,color,studyTaskId:id,createdAt:new Date().toISOString(),updatedAt:Date.now()});save();render()}
function plannerEditNaturalTask(id){const t=(db.studyPlan?.weeklyTasks||[]).find(x=>x.id===id);if(!t)return;const ans=prompt('Edite: tarefa, DD/MM/AAAA, durante 60 minutos',t.title+', '+t.date.split('-').reverse().join('/')+', durante '+t.minutes+' minutos');if(ans===null)return;const v=plannerParseNaturalTask(ans);if(v.error){alert(v.error);return}Object.assign(t,v);const e=(db.agendaEvents||[]).find(x=>x.studyTaskId===id);if(e)Object.assign(e,{title:v.title,date:v.date,time:v.time||'',duration:v.minutes,priority:t.priority||'normal',color:t.color||e.color});save();render()}
function plannerDeleteNaturalTask(id){if(!confirm('Excluir a tarefa e sua entrada na agenda?'))return;const p=db.studyPlan||{};p.weeklyTasks=(p.weeklyTasks||[]).filter(t=>t.id!==id);p.weekSchedule=(p.weekSchedule||[]).filter(t=>t.taskId!==id);db.agendaEvents=(db.agendaEvents||[]).filter(e=>e.studyTaskId!==id);save();render()}
function saveWeeklyPlanner(){
 const p=db.studyPlan||(db.studyPlan={}),availability={},startTimes={};
 for(const [k,label] of plannerWeekDays){const el=document.getElementById('spAvail_'+k),n=Number(el?.value||0);if(!Number.isFinite(n)||n<0||n>720){toast('Use de 0 a 720 minutos por dia.');return false}availability[k]=Math.round(n/15)*15;const st=document.getElementById('spStart_'+k)?.value||'05:30';if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(st)){toast('Confira o horário inicial de estudo.');return false}startTimes[k]=st}
 const taskInput=document.getElementById('spWeeklyTasks');let tasks=Array.isArray(p.weeklyTasks)?p.weeklyTasks:[];if(taskInput){const raw=taskInput.value||'';tasks=raw.split(/\\n|[\\r\\n]+/).map(x=>x.trim()).filter(Boolean).map((line,i)=>{const parts=line.split('|'),title=parts[0].trim(),n=Number((parts[1]||'').trim()),rawPriority=String(parts[2]||'normal').trim().toLowerCase(),priority=/^(alta|high|1)$/.test(rawPriority)?'alta':/^(baixa|low|3)$/.test(rawPriority)?'baixa':'normal',id='wt_'+i+'_'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,24),prior=(p.weeklyTasks||[]).find(t=>t.id===id||t.title===title);return {id,title,minutes:Number.isFinite(n)&&n>0?Math.min(720,Math.round(n/15)*15):30,priority,done:!!prior?.done}})}

function generateWeeklySchedule(){
 if(saveWeeklyPlanner()===false)return;const p=db.studyPlan||{},tasks=Array.isArray(p.weeklyTasks)?p.weeklyTasks:[],av=p.weeklyAvailability||{};
 if(!tasks.length){toast('Adicione ao menos uma tarefa para montar o cronograma.');return}

 for(let d=0;d<7;d++){const date=new Date(monday);date.setDate(monday.getDate()+d);const dateKey=agendaDateKey(date),key=plannerWeekDays[d][0];let capacity=Number(av[key]||0),slot=0;const initial=startTimes[key]||'05:30';let cursor=Number(initial.slice(0,2))*60+Number(initial.slice(3,5)),guard=0;
  const busy=agendaEvents().filter(e=>e&&e.date===dateKey&&e.time&&Number(e.duration)>0).map(e=>({start:Number(e.time.slice(0,2))*60+Number(e.time.slice(3,5)),end:Number(e.time.slice(0,2))*60+Number(e.time.slice(3,5))+Number(e.duration)})).sort((a,b)=>a.start-b.start);

 }

let fmCalendarMonthOffset=0;
function flashmedStreakStats(){
 const active=new Set();
 const addDate=value=>{const date=String(value||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(date))active.add(date)};
 // A ofensiva do FlashMed representa uso real do site, não apenas estudo acadêmico.
 // Trinta minutos acumulados com a página visível tornam o dia ativo.
 Object.entries(db.siteUsage||{}).forEach(([date,ms])=>{if((Number(ms)||0)>=FM_SITE_STREAK_MINUTES*60000)addDate(date)});
 // Mantém compatibilidade com registros antigos e outras atividades já salvas.
 (db.sessions||[]).forEach(session=>{if((Number(session.minutes)||0)>=1)addDate(session.date)});
 (db.bankAttempts||[]).forEach(attempt=>addDate(attempt.date));
 (db.studyPlan?.weekSchedule||[]).forEach(task=>{if(task.done&&task.completedAt)addDate(task.completedAt)});
 const today=day(),yesterday=new Date(Date.parse(today+'T00:00:00Z')-86400000).toISOString().slice(0,10);
 const lastActive=active.has(today)?today:(active.has(yesterday)?yesterday:null);
 let current=0;
 if(lastActive){let cursor=lastActive;while(active.has(cursor)){current++;cursor=new Date(Date.parse(cursor+'T00:00:00Z')-86400000).toISOString().slice(0,10)}}
 let best=0,run=0,previous=null;
 [...active].sort().forEach(date=>{
  run=previous&&Date.parse(date+'T00:00:00Z')-Date.parse(previous+'T00:00:00Z')===86400000?run+1:1;
  if(run>best)best=run;previous=date;
 });
 return {current,best,studiedToday:active.has(today),activeDays:active.size,activeDates:[...active]};
}

function knowledgeParseAttachmentUrls(raw){
 const seen=new Set(),out=[];
 for(const line of String(raw||'').split(/\r?\n/)){
  const value=line.trim();if(!value)continue;
  try{
   const u=new URL(value);
   if(!['http:','https:'].includes(u.protocol))continue;
   const url=u.href;if(seen.has(url))continue;seen.add(url);
   const path=(u.pathname||'').toLowerCase();
   let type='link';
   if(/\.(png|jpe?g|gif|webp|bmp|svg)(\?|$)/i.test(path))type='image';
   else if(/\.(mp3|m4a|aac|wav|ogg|oga|opus)(\?|$)/i.test(path))type='audio';
   else if(/\.(mp4|webm|mov|m4v|ogv)(\?|$)/i.test(path))type='video';
   else if(/(^|\.)youtube\.com$|(^|\.)youtu\.be$|(^|\.)vimeo\.com$/i.test(u.hostname))type='video';
   out.push({url,type,label:u.hostname.replace(/^www\./i,'')});
  }catch(e){}
 }
 return out;
}

function knowledgeGuessFileType(file){

const knowledgeMediaObjectUrls=new Map();
async function knowledgeHydrateLocalAttachments(root){

  if(el.dataset.mediaReady==='1')continue;

   let url=knowledgeMediaObjectUrls.get(id);
   if(!url){
    const record=await flashmedAssetGet(id);
    const blob=record&&(record.blob instanceof Blob?record.blob:record.data instanceof Blob?record.data:null);
    if(!blob){
     if(el.tagName==='IMG'){
      el.alt='Imagem não encontrada neste aparelho';el.style.display='none';
      const wrap=el.closest('.knowledgeAttachmentImage');
      if(wrap&&!wrap.querySelector('.knowledgeMediaMissing')){const msg=document.createElement('span');msg.className='knowledgeMediaMissing';msg.textContent='Imagem indisponível neste aparelho. Anexe novamente neste dispositivo.';wrap.appendChild(msg)}

     }

    }
    url=URL.createObjectURL(blob);knowledgeMediaObjectUrls.set(id,url);
   }
   if(el.tagName==='IMG'){
    el.src=url;
    el.onerror=()=>{el.style.display='none';const wrap=el.closest('.knowledgeAttachmentImage');if(wrap&&!wrap.querySelector('.knowledgeMediaMissing')){const msg=document.createElement('span');msg.className='knowledgeMediaMissing';msg.textContent='Não foi possível exibir esta imagem.';wrap.appendChild(msg)}};
   }else if(el.tagName==='AUDIO'||el.tagName==='VIDEO')el.src=url;

  }catch(e){console.warn('Não foi possível carregar anexo local',e);el.dataset.mediaReady='1'}
 }
}
async function knowledgeImageToCloudDataUrl(file){
 const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(reader.error||new Error('Falha ao ler imagem'));reader.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const el=new Image();el.onload=()=>resolve(el);el.onerror=()=>reject(new Error('Não foi possível abrir a imagem'));el.src=source});
 const maxSide=1000,scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
 const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas indisponível');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
 let quality=.7,data=canvas.toDataURL('image/jpeg',quality);
 while(data.length>190000&&quality>.35){quality-=.07;data=canvas.toDataURL('image/jpeg',quality)}
 if(data.length>240000)throw new Error('Imagem muito grande para sincronizar; recorte o print e tente novamente');
 return data;
}

}

async function fmShareEncode(value){
 const raw=new TextEncoder().encode(JSON.stringify(value));let bytes=raw,prefix='j.';
 if('CompressionStream'in window){try{const stream=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));bytes=new Uint8Array(await new Response(stream).arrayBuffer());prefix='g.'}catch(e){}}
 let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
 return prefix+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function fmShareDecode(token){

 const prefix=token.slice(0,2),b64=token.slice(2).replace(/-/g,'+').replace(/_/g,'/'),bin=atob(b64+'='.repeat((4-b64.length%4)%4)),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 let raw=bytes;if(prefix==='g.'){if(!('DecompressionStream'in window))throw new Error('Este navegador não consegue abrir este link. Atualize o navegador.');raw=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}else if(prefix!=='j.')throw new Error('Formato de compartilhamento inválido.');
 return JSON.parse(new TextDecoder().decode(raw));
}

function bankFlashcardPlain(text){return String(text||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()}
function bankFlashcardSuggest(phrase){
 let t=bankFlashcardPlain(phrase).replace(/[.!?]+$/,'').trim();if(!t)return{front:'',back:''};
 let marked=t.match(/^(.*?)\[([^\[\]]{1,220})\](.*)$/);if(marked)return{front:'Complete a frase: '+marked[1]+'[...]'+marked[3],back:marked[2]};
 let m=t.match(/^(.{4,110}?)\s+(é|são|corresponde a|caracteriza-se por|é caracterizado por|tem como causa|é causado por|é causada por|deve ser tratado com|deve ser tratada com)\s+(.{3,})$/i);
 if(m){let subject=m[1].trim(),verb=m[2].toLowerCase(),answer=m[3].trim();let question=/causad|causa/.test(verb)?'Qual é a causa de '+subject+'?':/tratad/.test(verb)?'Qual é o tratamento de '+subject+'?':/caracteriz/.test(verb)?'Como se caracteriza '+subject+'?':'O que é / qual a característica de '+subject+'?';return{front:question,back:answer}}
 let colon=t.match(/^([^:]{4,110}):\s*(.{3,})$/);if(colon)return{front:'O que você deve lembrar sobre '+colon[1].trim()+'?',back:colon[2].trim()};
 return{front:'Qual é a informação-chave desta frase?',back:t};
}
function openBankFlashcardMaker(){let q=db.bankQuestions.find(x=>x.id===bankCurrent),box=document.getElementById('bankFlashcardMaker');if(!box||!q)return;box.style.display=box.style.display==='none'?'block':'none';if(box.style.display==='none')return;box.innerHTML='<h3>🃏 Criar flashcard • '+esc(q.exam)+' • Q'+esc(q.number)+'</h3><p class=muted>Digite uma frase do comentário ou uma decoreba. Para escolher exatamente o trecho que será a resposta, coloque-o entre colchetes: <b>A primeira escolha é [fenobarbital].</b></p><label>Frase</label><textarea id=bankFlashcardPhrase class=field rows=3 placeholder="Ex.: A primeira escolha na convulsão neonatal é [fenobarbital]." oninput="previewBankFlashcard()" style="width:100%;resize:vertical"></textarea><div class=row><button class="btn ghost mini" onclick="useBankSelectedText()">Usar texto selecionado da questão</button><span class=muted>Edite a pergunta e a resposta antes de salvar.</span></div><label>Frente / pergunta</label><textarea id=bankFlashcardFront class=field rows=3 style="width:100%;resize:vertical"></textarea><label>Verso / resposta</label><textarea id=bankFlashcardBack class=field rows=3 style="width:100%;resize:vertical"></textarea><label>Matéria</label><select id=bankFlashcardSubject class=field>'+db.subjects.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><div class=row><button class=btn onclick="saveBankFlashcard()">Salvar flashcard</button><button class="btn ghost" onclick="document.getElementById(\'bankFlashcardMaker\').style.display=\'none\'">Cancelar</button></div>';let subject=db.subjects.find(x=>String(q.area||'').toLowerCase().includes(x.toLowerCase())||x.toLowerCase().includes(String(q.area||'').toLowerCase()));if(subject)document.getElementById('bankFlashcardSubject').value=subject;let selected=window.getSelection()?.toString().trim();if(selected&&selected.length<1200){document.getElementById('bankFlashcardPhrase').value=selected;previewBankFlashcard()}}
function previewBankFlashcard(){let p=document.getElementById('bankFlashcardPhrase'),front=document.getElementById('bankFlashcardFront'),back=document.getElementById('bankFlashcardBack');if(!p||!front||!back)return;let x=bankFlashcardSuggest(p.value);front.value=x.front;back.value=x.back}
function useBankSelectedText(){let t=window.getSelection()?.toString().trim();if(!t)return toast('Selecione primeiro uma frase da questão');document.getElementById('bankFlashcardPhrase').value=t;previewBankFlashcard()}
function saveBankFlashcard(){let q=db.bankQuestions.find(x=>x.id===bankCurrent),front=document.getElementById('bankFlashcardFront')?.value.trim(),back=document.getElementById('bankFlashcardBack')?.value.trim(),subject=document.getElementById('bankFlashcardSubject')?.value;if(!q||!front||!back)return toast('Preencha frente e verso antes de salvar');let duplicate=db.cards.some(c=>c.sourceQuestionId===q.id&&bankFlashcardPlain(c.front)===front&&bankFlashcardPlain(c.back)===back);if(duplicate)return toast('Este flashcard já foi salvo nesta questão');db.cards.push({id:Date.now()+Math.floor(Math.random()*10000),subject:subject||db.subjects[0]||'Geral',front:esc(front),back:esc(back),media:'',tags:'banco de questões, '+q.exam+', questão '+q.number,sourceQuestionId:q.id,ok:0,bad:0,interval:0,due:day(),history:[]});save();document.getElementById('bankFlashcardMaker').style.display='none';toast('Flashcard salvo para revisão ♡')}

function bankOrdered(){let base=bankSelectionIds?(db.bankQuestions||[]).filter(q=>bankSelectionIds.includes(q.id)):bankExamQuestions();return base.slice().sort((a,b)=>bankTopicIds?(String(a.exam).localeCompare(String(b.exam),'pt-BR',{numeric:true})||(a.number||0)-(b.number||0)):(a.number||0)-(b.number||0))}

function refreshBankErrorFlashcards(options={}){
 // Migrate only flashcards linked to bank questions; keep manually edited cards intact.
 // The migration is idempotent and preserves all study history, intervals and due dates.
 let changed=false,updated=0,skipped=0;
 const oldPattern=/^(Em .+, qual exame ou teste|Em .+, qual é a conduta|Qual é o principal agente ou causa|Qual é o critério ou definição|Qual é a principal medida de prevenção|Qual é o ponto-chave cobrado)/i;
 const questions=new Map((db.bankQuestions||[]).map(q=>[String(q.id),q]));
 for(const card of db.cards||[]){
  if(card.bankQuestionId==null)continue;
  const q=questions.get(String(card.bankQuestionId));if(!q){skipped++;continue}
  const front=esc(bankFlashcardQuestion(q));
  const back=esc(bankFlashcardTakeaway(q));
  const previous=stripBankHtml(card.front||'').trim();
  const autoFront=card.bankAutoFront?card.front===card.bankAutoFront:oldPattern.test(previous);
  if(!autoFront){skipped++;continue}
  const autoBack=card.bankAutoBack?card.back===card.bankAutoBack:true;
  if(card.front!==front){card.front=front;changed=true;updated++}
  if(autoBack&&card.back!==back){card.back=back;changed=true}
  if(card.bankAutoFront!==front||card.bankCardVersion!==2){card.bankAutoFront=front;card.bankCardVersion=2;changed=true}
  if(autoBack&&card.bankAutoBack!==back){card.bankAutoBack=back;changed=true}
 }
 if(changed){
  db.updatedAt=Date.now();
  if(!options.deferSave){
   localStorage.setItem(KEY,JSON.stringify(flashmedLocalPayload(db)));
   if(cloud){clearTimeout(cloudTimer);cloudTimer=setTimeout(syncUp,800)}

 }

}

  remote.studyNotebooks=Array.isArray(remote.studyNotebooks)?remote.studyNotebooks:[];

  for(const item of local.studyNotebooks){

    const ix=remote.studyNotebooks.findIndex(x=>String(x.id)===id);

   }

 }

 if(Array.isArray(local.pdfLibrary)){remote.pdfLibrary=Array.isArray(remote.pdfLibrary)?remote.pdfLibrary:[];const pdfById=new Map(remote.pdfLibrary.map(x=>[String(x.id),x]));for(const item of local.pdfLibrary){const id=String(item?.id??'');if(!id)continue;const old=pdfById.get(id);if(!old){remote.pdfLibrary.push(item);pdfById.set(id,item);changed=true}else if((item.updatedAt||0)>(old.updatedAt||0)){const ix=remote.pdfLibrary.findIndex(x=>String(x.id)===id);if(ix>=0)remote.pdfLibrary[ix]=item;pdfById.set(id,item);changed=true}}}

 }

  const a=remote.studyPlan[key]&&typeof remote.studyPlan[key]==='object'?remote.studyPlan[key]:{};

function mergeCardStudyHistory(remote,local){
 if(!remote||!local||!Array.isArray(remote.cards)||!Array.isArray(local.cards))return false;
 const localById=new Map(local.cards.map(c=>[String(c.id),c]));
 let changed=false;
 for(const card of remote.cards){
  const old=localById.get(String(card.id));if(!old)continue;
  const existing=Array.isArray(card.history)?card.history:[];
  const previous=Array.isArray(old.history)?old.history:[];
  const count=new Map();
  const signature=h=>JSON.stringify([h.date||'',h.rating||'',h.at||h.timestamp||'']);
  for(const h of existing){const k=signature(h);count.set(k,(count.get(k)||0)+1)}
  for(const h of previous){
   const k=signature(h),n=count.get(k)||0;
   if(n>0){count.set(k,n-1);continue}
   existing.push(h);changed=true;
  }
  if(changed)card.history=existing;
  const good=existing.filter(h=>h.rating==='ok'||h.rating==='easy').length;
  const bad=existing.filter(h=>h.rating!=='ok'&&h.rating!=='easy').length;
  const newOk=Math.max(card.ok||0,old.ok||0,good),newBad=Math.max(card.bad||0,old.bad||0,bad);
  if(newOk!==(card.ok||0)||newBad!==(card.bad||0)){card.ok=newOk;card.bad=newBad;changed=true}
  if(previous.length>0&&(!card.due||((old.history||[]).length>=(card.history||[]).length&&old.due&&old.due>card.due))){
   if(old.due&&old.due!==card.due){card.due=old.due;card.interval=Math.max(card.interval||0,old.interval||0);changed=true}
  }
 }
 return changed;
}

  if(!current||!imported||typeof current!=='object'||typeof imported!=='object')throw new Error('Backup inválido');
  const clone=x=>JSON.parse(JSON.stringify(x));
  const merged=clone(current);
  const uniqueMerge=(existing,incoming,key='id')=>{
    const out=Array.isArray(existing)?existing.slice():[];
    const seen=new Set(out.map(x=>String(x?.[key]??'')));
    let added=0;
    for(const item of (Array.isArray(incoming)?incoming:[])){
      const id=String(item?.[key]??'');
      if(id&&seen.has(id))continue;
      if(id)seen.add(id);
      out.push(clone(item));added++;
    }
    return {items:out,added};
  };
  const result={tasks:0,blocks:0,events:0,reminders:0};
  const currentPlan=merged.studyPlan&&typeof merged.studyPlan==='object'?merged.studyPlan:{};
  const importPlan=imported.studyPlan&&typeof imported.studyPlan==='object'?imported.studyPlan:{};
  const plan=clone(currentPlan);
  for(const key of ['weeklyTasks','weekSchedule']){
    const res=uniqueMerge(plan[key],importPlan[key],'id');
    plan[key]=res.items;
    result[key==='weeklyTasks'?'tasks':'blocks']=res.added;
  }
  for(const key of ['weeklyCardOrder']){
    const a=plan[key]&&typeof plan[key]==='object'?plan[key]:{};
    const b=importPlan[key]&&typeof importPlan[key]==='object'?importPlan[key]:{};
    plan[key]=clone(a);
    for(const [date,ids] of Object.entries(b)){
      if(!Array.isArray(plan[key][date]))plan[key][date]=clone(ids);
      else plan[key][date]=[...new Set([...plan[key][date],...(Array.isArray(ids)?ids:[])])];
    }
  }
  for(const key of ['weeklyStartTimes','weeklyAvailability']){
    const a=plan[key]&&typeof plan[key]==='object'?plan[key]:{};
    const b=importPlan[key]&&typeof importPlan[key]==='object'?importPlan[key]:{};
    plan[key]=clone(a);
    for(const [k,v] of Object.entries(b))if(!(k in plan[key]))plan[key][k]=clone(v);
  }
  for(const [key,value] of Object.entries(importPlan)){
    if(['weeklyTasks','weekSchedule','weeklyCardOrder','weeklyStartTimes','weeklyAvailability'].includes(key))continue;
    if(plan[key]===undefined||plan[key]===null||plan[key]==='')plan[key]=clone(value);
  }
  merged.studyPlan=plan;
  const deleted=new Set((Array.isArray(merged.deletedAgendaEventIds)?merged.deletedAgendaEventIds:[]).map(String));
  const agenda=uniqueMerge((merged.agendaEvents||[]).filter(e=>!deleted.has(String(e.id))), (imported.agendaEvents||[]).filter(e=>!deleted.has(String(e.id))),'id');
  merged.agendaEvents=agenda.items;
  result.events=agenda.added;
  // Recover quick reminders only if the backup actually contains them; this backup does not,
  // so existing quick reminders are deliberately left untouched.
  if(Array.isArray(imported.quickReminders)){
    const qr=uniqueMerge(merged.quickReminders,imported.quickReminders,'id');
    merged.quickReminders=qr.items;result.reminders=qr.added;
  }

  return {data:merged,counts:result};
}

  };

}

{id:'cc2',area:'Pediatria',level:'Pronto atendimento',title:'Criança com dificuldade para respirar',patient:'Lactente de 5 meses, previamente saudável, com coriza e tosse há 3 dias. Hoje a mãe percebeu respiração mais rápida e dificuldade para mamar. Ao exame: alerta, FR 58 irpm, tiragem subcostal leve, sibilos e estertores difusos, SatO₂ 94% em ar ambiente.',tasks:['Qual sua hipótese principal?','Como classificaria a gravidade?','O que faria nos primeiros minutos?','Prescreveria broncodilatador, corticoide ou antibiótico? Explique.','Quais critérios fariam você observar/internar?'],model:'O padrão sugere bronquiolite viral. Avalie oxigenação, esforço respiratório, hidratação/alimentação, apneia e fatores de risco. O manejo é predominantemente de suporte; oxigênio é indicado conforme hipoxemia e protocolo, além de higiene/aspiração nasal e suporte hídrico quando necessário. Broncodilatadores, corticoides e antibióticos não são rotina em bronquiolite típica. A decisão de alta, observação ou internação depende da evolução clínica, saturação, esforço, ingestão, apneia e vulnerabilidades.'},
{id:'cc3',area:'Ginecologia e Obstetrícia',level:'Urgência',title:'Gestante com cefaleia',patient:'Gestante de 35 semanas chega à maternidade com cefaleia intensa e escotomas. PA 168×112 mmHg em duas medidas. Refere dor em hipocôndrio direito. BCF presente.',tasks:['Qual o diagnóstico sindrômico mais provável?','Quais exames solicita imediatamente?','Quais são suas prioridades terapêuticas?','Escreva uma prescrição inicial simulada.','O que define o momento da resolução da gestação?'],model:'O quadro deve ser tratado como pré-eclâmpsia com sinais de gravidade até avaliação completa. Prioridades: estabilização materna, controle da hipertensão grave, prevenção de eclâmpsia com sulfato de magnésio quando indicado, avaliação laboratorial de órgão-alvo e avaliação fetal. A resolução depende da estabilidade materno-fetal, idade gestacional e presença de critérios que contraindiquem conduta expectante; em cenário grave, segurança materna é central.'}
];

/* Biblioteca de Leituras: arquivos binários em Supabase Storage privado; metadados sincronizados na conta. */
const FLASHMED_PDF_BUCKET='flashmed-pdfs';
let pdfLibraryFilter='',pdfLibraryReaderId=null,pdfLibraryObjectUrl=null,pdfLibraryDocxHtml='';
function pdfLibraryInit(){db.pdfLibrary=Array.isArray(db.pdfLibrary)?db.pdfLibrary:[]}
function pdfLibraryView(){
 pdfLibraryInit();
 const q=String(pdfLibraryFilter||'').toLocaleLowerCase('pt-BR');
 const docs=db.pdfLibrary.filter(d=>!q||[d.title,d.fileName,d.category,d.notes].join(' ').toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
 const categories=['Geral','Obstetrícia','Ginecologia','Pediatria','Clínica Médica','Medicina Preventiva','Outros'];
 return '<div class="panel hero"><div class="row" style="align-items:center"><div style="flex:1"><h2>📚 Biblioteca de Leituras</h2><p>Guarde seus PDFs e documentos Word na sua conta, abra-os em uma página de leitura e retome de onde parou. Os arquivos ficam privados.</p></div><span class="pill">'+docs.length+' arquivo(s)</span></div><div class="muted" style="font-size:12px">PDF até 25 MB · Word (.docx) até 25 MB · busca, categorias e progresso de leitura</div></div>'+
 '<div class="panel" style="margin-top:14px"><h3>＋ Adicionar material</h3><div class="grid2"><label>Título<input id="pdfLibTitle" class="field" placeholder="Ex.: Protocolo de pré-eclâmpsia"></label><label>Categoria<select id="pdfLibCategory" class="field">'+categories.map(c=>'<option>'+c+'</option>').join('')+'</select></label></div><label>Arquivo PDF ou Word (.docx)<input id="pdfLibFile" class="field" type="file" accept=".pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><label>Observação (opcional)<input id="pdfLibNotes" class="field" placeholder="Ex.: revisar capítulo 3"></label><button class="btn" onclick="pdfLibraryUpload()">Enviar para minha biblioteca ☁️</button><p class="muted" style="font-size:12px;margin-bottom:0">Antes do primeiro envio, configure o armazenamento privado no Supabase usando o <a href="https://github.com/larissaegeorge07/flashmed-larissa/blob/main/supabase-pdf-library-setup.sql" target="_blank" rel="noopener">script de configuração</a>. Os arquivos não são publicados como links públicos.</p></div>'+
 '<div class="panel" style="margin-top:14px"><label>Buscar na biblioteca<input class="field" placeholder="Título, categoria ou observação…" value="'+esc(pdfLibraryFilter)+'" oninput="pdfLibraryFilter=this.value;pdfLibraryRefreshResults()"></label><div id="pdfLibraryResults" class="knowledgeBookGrid">'+pdfLibraryCards(docs)+'</div></div>'+
 (pdfLibraryReaderId?pdfLibraryReaderView(pdfLibraryReaderId):'');
}
function pdfLibraryCards(docs){
 if(!docs.length)return '<div class="panel" style="grid-column:1/-1;text-align:center"><h3>Sua biblioteca começa aqui</h3><p class="muted">Adicione os PDFs e arquivos Word que você usa nos estudos.</p></div>';
 return docs.map(d=>'<article class="panel" style="padding:16px"><div class="row" style="align-items:flex-start"><div style="font-size:28px">'+(d.kind==='docx'?'📝':'📄')+'</div><div style="flex:1;min-width:0"><h3 style="margin:0 0 5px;overflow-wrap:anywhere">'+esc(d.title||d.fileName)+'</h3><div class="muted" style="font-size:12px">'+esc(d.category||'Geral')+' · '+(d.kind==='docx'?'Word':'PDF')+' · '+esc(d.fileName||'')+'</div>'+(d.notes?'<p style="font-size:13px">'+esc(d.notes)+'</p>':'')+(d.lastPage?'<span class="pill">Retomar na página '+Number(d.lastPage)+'</span>':'')+'</div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="pdfLibraryOpen('+esc(JSON.stringify(String(d.id)))+')">📖 Ler</button><button class="btn ghost" onclick="pdfLibraryEditMeta('+esc(JSON.stringify(String(d.id)))+')">Editar detalhes</button><button class="btn ghost" onclick="pdfLibraryDelete('+esc(JSON.stringify(String(d.id)))+')">Excluir</button></div></article>').join('');
}
function pdfLibraryRefreshResults(){const el=document.getElementById('pdfLibraryResults');if(el){const q=String(pdfLibraryFilter||'').toLocaleLowerCase('pt-BR');el.innerHTML=pdfLibraryCards(db.pdfLibrary.filter(d=>!q||[d.title,d.fileName,d.category,d.notes].join(' ').toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0))) }}
async function pdfLibraryUpload(){
 pdfLibraryInit();const input=document.getElementById('pdfLibFile'),file=input?.files?.[0];if(!file)return toast('Escolha um PDF ou arquivo Word primeiro');
 if(file.size>25*1024*1024)return toast('O limite por arquivo é 25 MB');
 const lower=file.name.toLowerCase(),kind=lower.endsWith('.pdf')||file.type==='application/pdf'?'pdf':lower.endsWith('.docx')||file.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'?'docx':'';
 if(!kind)return toast('Formato não suportado. Use PDF ou Word .docx');
 if(!cloud||!currentUser)return toast('Entre na sua conta para salvar materiais na nuvem');
 const title=document.getElementById('pdfLibTitle').value.trim()||file.name.replace(/\.(pdf|docx)$/i,'');
 const category=document.getElementById('pdfLibCategory').value,notes=document.getElementById('pdfLibNotes').value.trim();
 const id='pdf_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9),path=currentUser.id+'/'+id+'/'+file.name.replace(/[^\w.() -]/g,'_');
 const btn=document.querySelector('button[onclick="pdfLibraryUpload()"]');if(btn){btn.disabled=true;btn.textContent='Enviando com segurança…'}
 try{
  const {data,error}=await cloud.storage.from(FLASHMED_PDF_BUCKET).upload(path,file,{contentType:kind==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document',upsert:false});
  if(error)throw error;
  db.pdfLibrary.unshift({id,title,fileName:file.name,kind,category,notes,storagePath:data.path,ownerId:currentUser.id,createdAt:Date.now(),updatedAt:Date.now(),lastPage:1,favorite:false});
  if(!save())throw new Error('O arquivo foi enviado, mas os metadados não puderam ser salvos localmente. Não reenvie; atualize a página e confira a biblioteca.');
  pdfLibraryFilter='';render();toast('Material adicionado à sua biblioteca!');
 }catch(e){console.error('Biblioteca FlashMed',e);toast(/Bucket not found|not found/i.test(e.message||'')?'O armazenamento ainda precisa ser configurado no Supabase. Veja as instruções abaixo.':('Falha no envio: '+(e.message||'verifique a conexão')).slice(0,170))}
 finally{if(btn){btn.disabled=false;btn.textContent='Enviar para minha biblioteca ☁️'}}
}
async function pdfLibraryOpen(id){
 pdfLibraryInit();const d=db.pdfLibrary.find(x=>String(x.id)===String(id));if(!d)return;
 pdfLibraryReaderId=String(id);pdfLibraryDocxHtml='';render();
 const host=document.getElementById('pdfLibraryReaderContent');if(!host)return;
 host.innerHTML='<div class="panel"><p>Preparando leitura segura…</p></div>';
 try{
  const {data,error}=await cloud.storage.from(FLASHMED_PDF_BUCKET).createSignedUrl(d.storagePath,300);
  if(error)throw error;
  if(d.kind==='pdf'){
   host.innerHTML='<div class="panel" style="padding:6px"><iframe title="'+esc(d.title)+'" src="'+esc(data.signedUrl)+'#page='+Math.max(1,Number(d.lastPage)||1)+'&toolbar=1&navpanes=1" style="width:100%;height:min(78vh,1000px);border:0;border-radius:10px;background:#eee"></iframe><p class="muted" style="padding:8px 12px;font-size:12px">Use as ferramentas do leitor do navegador para zoom, busca e impressão. Para retomar depois, atualize a página salva abaixo.</p><label>Última página lida<input id="pdfLibLastPage" type="number" min="1" value="'+Math.max(1,Number(d.lastPage)||1)+'" class="field" style="max-width:140px" onchange="pdfLibrarySaveProgress('+esc(JSON.stringify(String(d.id)))+')"></label></div>';
  }else{
   const response=await fetch(data.signedUrl);if(!response.ok)throw new Error('Não foi possível abrir o documento Word');const blob=await response.arrayBuffer();
   if(!window.mammoth){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)})}
   const converted=await mammoth.convertToHtml({arrayBuffer:blob});pdfLibraryDocxHtml=converted.value;
   host.innerHTML='<div class="panel" id="pdfLibDocxPaper" style="max-width:900px;margin:0 auto;background:#fff;color:#222;padding:clamp(18px,5vw,55px);line-height:1.7">'+pdfLibraryDocxHtml+'</div><div class="panel"><p class="muted">Documento Word exibido em modo de leitura. Para criar uma cópia PDF, use “Imprimir / Salvar em PDF”.</p><button class="btn" onclick="pdfLibraryPrintDocx()">Imprimir / Salvar em PDF</button></div>';
  }
 }catch(e){console.error(e);host.innerHTML='<div class="panel"><h3>Não foi possível abrir este arquivo</h3><p>'+esc(e.message||'Verifique se o armazenamento está configurado e se você está conectado à conta.')+'</p><button class="btn ghost" onclick="pdfLibraryBack()">Voltar à biblioteca</button></div>'}
}
function pdfLibraryReaderView(id){const d=db.pdfLibrary.find(x=>String(x.id)===String(id));if(!d)return '';return '<div class="panel" style="margin-top:14px"><div class="row"><button class="btn ghost" onclick="pdfLibraryBack()">← Biblioteca</button><h2 style="margin:0;flex:1">'+esc(d.title)+'</h2><button class="btn ghost" onclick="pdfLibraryOpen('+esc(JSON.stringify(String(d.id)))+')">Reabrir</button></div><div id="pdfLibraryReaderContent" style="margin-top:12px"><p class="muted">Carregando leitor…</p></div></div>'}
function pdfLibraryBack(){pdfLibraryReaderId=null;pdfLibraryDocxHtml='';if(pdfLibraryObjectUrl){URL.revokeObjectURL(pdfLibraryObjectUrl);pdfLibraryObjectUrl=null}render()}
function pdfLibrarySaveProgress(id){const d=db.pdfLibrary.find(x=>String(x.id)===String(id));const p=Math.max(1,Number(document.getElementById('pdfLibLastPage')?.value)||1);if(d){d.lastPage=p;d.updatedAt=Date.now();save();toast('Progresso de leitura salvo')}}
function pdfLibraryPrintDocx(){const paper=document.getElementById('pdfLibDocxPaper');if(!paper)return;const w=window.open('','_blank');if(!w)return toast('Permita pop-ups para imprimir o documento');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Documento Word</title><style>body{font:12pt/1.6 Arial,sans-serif;max-width:850px;margin:30px auto;color:#222}img{max-width:100%}@media print{body{margin:15mm}}</style></head><body>'+paper.innerHTML+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),400)}
function pdfLibraryEditMeta(id){const d=db.pdfLibrary.find(x=>String(x.id)===String(id));if(!d)return;const title=prompt('Título do material:',d.title||'');if(title===null)return;const notes=prompt('Observações:',d.notes||'');if(notes===null)return;d.title=title.trim()||d.fileName;d.notes=notes.trim();d.updatedAt=Date.now();save();render()}
async function pdfLibraryDelete(id){const d=db.pdfLibrary.find(x=>String(x.id)===String(id));if(!d||!confirm('Excluir "'+d.title+'" da biblioteca e da nuvem?'))return;try{const {error}=await cloud.storage.from(FLASHMED_PDF_BUCKET).remove([d.storagePath]);if(error)throw error;db.pdfLibrary=db.pdfLibrary.filter(x=>String(x.id)!==String(id));if(pdfLibraryReaderId===String(id))pdfLibraryReaderId=null;save();render();toast('Material excluído')}catch(e){toast('Não foi possível excluir o arquivo: '+(e.message||''))}}

function flashmedRepairCardSubjects(){
 const cards=Array.isArray(db.cards)?db.cards:[];
 db.subjects=Array.isArray(db.subjects)?db.subjects:[];
 db.subjectIcons=db.subjectIcons||{};
 // Add subject labels only; never create, clone, or delete flashcards here.
 const ensure=(name,icon)=>{if(!db.subjects.includes(name))db.subjects.push(name);if(!db.subjectIcons[name])db.subjectIcons[name]=icon};
 ensure('Obstetrícia','🤰');ensure('Ginecologia','🌸');

async function bootAuth(){
 cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 let session=null;
 try{const z=await cloud.auth.getSession();session=z.data?.session||null}catch(e){console.error('FlashMed session check',e)}
 if(session&&session.user){
  currentUser=session.user;
  authGate.classList.add('hidden');appRoot.classList.remove('authHidden');cloudDot.classList.add('ok');
  try{
   flashmedPruneRecoverySnapshots(false);
   await occlusionLoadDedicatedCards(db);await flashmedEmergencyRestore(db);await occlusionHydrateAssets(db);
   await syncDown(true);await occlusionHydrateAssets(db);flashmedRepairCardSubjects();refreshBankErrorFlashcards();renderNav();render();flashmedAskDisplayName();await flashmedHandleSharedImport();
  }catch(e){
   console.error('FlashMed pós-login: falha ao carregar dados',e);
   authGate.classList.add('hidden');appRoot.classList.remove('authHidden');
   const view=document.getElementById('view');
   if(view&&!view.innerHTML.trim())view.innerHTML='<section class="panel"><h2>Você entrou no FlashMed</h2><p>O acesso foi confirmado, mas uma parte dos dados não carregou. Atualize a página para tentar novamente. Seus dados na nuvem não foram apagados.</p></section>';
   const status=document.getElementById('saveState');if(status)status.textContent='falha ao carregar alguns dados';
  }
 }else{
  try{flashmedPruneRecoverySnapshots(false);await occlusionLoadDedicatedCards(db);await flashmedEmergencyRestore(db);await occlusionHydrateAssets(db)}catch(e){console.warn('FlashMed recuperação local',e)}
  authGate.classList.remove('hidden');appRoot.classList.add('authHidden');
 }
}
loginBtn.onclick=async function(){
 authError.textContent='';
 const email=loginEmail.value.trim(),password=loginPassword.value;
 if(!email){authError.textContent='Informe seu e-mail.';loginEmail.focus();return}
 if(!password){authError.textContent='Informe sua senha.';loginPassword.focus();return}
 loginBtn.disabled=true;loginBtn.textContent='Entrando…';signupBtn.disabled=true;
 try{
  if(!cloud)throw new Error('O serviço de autenticação não foi inicializado. Atualize a página e tente novamente.');
  const z=await cloud.auth.signInWithPassword({email,password});
  if(z.error){
   console.error('FlashMed login',z.error);
   authError.textContent=/invalid login credentials/i.test(z.error.message||'')?'E-mail ou senha incorretos.':(z.error.message||'Não foi possível entrar. Tente novamente.');
   return;
  }
  if(!z.data?.user)throw new Error('O login não retornou uma sessão. Tente novamente.');
  currentUser=z.data.user;authGate.classList.add('hidden');appRoot.classList.remove('authHidden');cloudDot.classList.add('ok');
  try{
   await syncDown(true);await occlusionHydrateAssets(db);flashmedRepairCardSubjects();refreshBankErrorFlashcards();renderNav();render();flashmedAskDisplayName();await flashmedHandleSharedImport();
  }catch(postLoginError){
   console.error('FlashMed: login confirmado, mas houve falha ao carregar dados',postLoginError);
   authGate.classList.add('hidden');appRoot.classList.remove('authHidden');
   const view=document.getElementById('view');
   if(view&&!view.innerHTML.trim())view.innerHTML='<section class="panel"><h2>Login realizado</h2><p>Seu acesso foi confirmado. Uma parte dos dados não carregou; atualize a página para tentar novamente. Seus dados na nuvem não foram apagados.</p></section>';
   authError.textContent='';
  }
 }catch(e){
  console.error('FlashMed login',e);
  authError.textContent='Não foi possível entrar: '+(e?.message||'verifique a conexão e tente novamente.');
 }finally{
  loginBtn.disabled=false;loginBtn.textContent='Entrar';signupBtn.disabled=false;
 }
};
signupBtn.onclick=async function(){
 authError.textContent='';
 const email=loginEmail.value.trim(),password=loginPassword.value;
 if(!email){authError.textContent='Informe seu e-mail.';loginEmail.focus();return}
 if(password.length<6){authError.textContent='A senha precisa ter pelo menos 6 caracteres.';loginPassword.focus();return}
 signupBtn.disabled=true;signupBtn.textContent='Criando conta…';loginBtn.disabled=true;
 try{
  const z=await cloud.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
  if(z.error){authError.textContent=z.error.message||'Não foi possível criar a conta.';return}
  if(!z.data.session||!z.data.user){
   authError.textContent='Cadastro iniciado! Confira seu e-mail para confirmar a conta. Depois, volte aqui e entre com seu e-mail e senha.';
   return;
  }
  currentUser=z.data.user;
  // A new account starts empty: never seed it with the previous browser user's personal data.
  flashmedResetLocalForAccount(currentUser.id);
  authGate.classList.add('hidden');appRoot.classList.remove('authHidden');cloudDot.classList.add('ok');
  await syncDown(true);
  if(!cloudDot.classList.contains('ok')){
   await cloud.auth.signOut();currentUser=null;authGate.classList.remove('hidden');appRoot.classList.add('authHidden');
   authError.textContent='A conta foi criada, mas o perfil ainda não foi preparado. Aplique a configuração de cadastro do Supabase antes de entrar novamente.';
   return;
  }
  await occlusionHydrateAssets(db);refreshBankErrorFlashcards();renderNav();render();await flashmedHandleSharedImport();
 }catch(e){console.error('FlashMed signup',e);authError.textContent='Não foi possível concluir o cadastro. Tente novamente.'}
 finally{signupBtn.disabled=false;signupBtn.textContent='Criar minha conta';loginBtn.disabled=false}
};
window.addEventListener('error',function(e){
 try{
  const box=document.getElementById('authError');
  if(box){box.textContent='Erro ao carregar o FlashMed: '+(e.message||'falha no JavaScript')+'. Atualize a página; se persistir, envie esta mensagem.';}
  const gate=document.getElementById('authGate');
  if(gate)gate.classList.remove('hidden');
 }catch(_){}
});
window.addEventListener('unhandledrejection',function(e){
 try{
  const box=document.getElementById('authError');
  if(box)box.textContent='Falha ao iniciar o FlashMed: '+(e.reason?.message||String(e.reason||'erro inesperado'));
  const gate=document.getElementById('authGate');
  if(gate)gate.classList.remove('hidden');
 }catch(_){}
});
bootAuth().catch(function(e){
 console.error('FlashMed bootAuth',e);
 const box=document.getElementById('authError');
 if(box)box.textContent='Não foi possível inicializar o acesso: '+(e?.message||'erro inesperado');
 const gate=document.getElementById('authGate');
 if(gate)gate.classList.remove('hidden');
});</script></body></html>
