{id:'sus26-1',number:1,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, trabalhador da construção civil, com tosse produtiva há quatro semanas, febre vespertina, sudorese noturna e perda de 5 kg. Teve contato recente com colega tratado para tuberculose. Ao exame, está emagrecido e apresenta estertores em ápice direito. Radiografia: infiltrado com cavitação em lobo superior direito. Reside com esposa e dois filhos, de 4 e 8 anos.',prompt:'Indique a conduta prioritária para a confirmação diagnóstica do paciente:',alternatives:['Solicitar teste tuberculínico (PPD) e aguardar o resultado em 72 horas para definir a conduta.','Coletar duas amostras de escarro para baciloscopia e teste rápido molecular (TRM-TB).','Realizar broncoscopia com lavado broncoalveolar e cultura em meio de Lowenstein-Jensen.','Iniciar imediatamente o esquema terapêutico padrão e observar a resposta clínica do paciente.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada — diagnóstico de tuberculose</h3><p><b>Resposta B.</b> Tosse há quatro semanas, febre vespertina, emagrecimento, contato epidemiológico e cavitação apical formam um quadro de alta suspeita de TB pulmonar. Como o paciente produz escarro, a prioridade é colher material respiratório para investigação bacteriológica, incluindo TRM-TB. Pense no TRM como uma identificação rápida do bacilo: além de detectar DNA do complexo M. tuberculosis, alguns testes avaliam resistência à rifampicina.</p><p><b>🔎 Alternativa por alternativa</b></p><p><b>A — Incorreta:</b> PPD indica resposta imunológica à infecção, mas não diferencia infecção latente de doença ativa. Não confirma a causa da cavitação.</p><p><b>B — Correta:</b> escarro é a amostra inicial acessível; o TRM-TB é recomendado como teste inicial em pessoas com sinais e sintomas de TB. A coleta de duas amostras para baciloscopia segue a formulação da alternativa da prova; protocolos atuais de TRM podem utilizar uma amostra, conforme o fluxo local.</p><p><b>C — Incorreta:</b> broncoscopia é útil quando não se consegue escarro ou a investigação inicial não esclarece o caso; é invasiva e não substitui a primeira coleta espontânea disponível.</p><p><b>D — Incorreta:</b> tratamento empírico pode ser necessário em situações específicas, mas observar resposta terapêutica não é o método prioritário de confirmação quando é possível obter escarro.</p><p><b>💡 Analogia:</b> a radiografia aponta onde está a fumaça; o exame do escarro procura identificar o agente que iniciou o incêndio.</p><p><b>📚 Referências reais:</b> <a href="https://www.gov.br/saude/pt-br/centrais-de-conteudo/publicacoes/svsa/tuberculose/manual-de-recomendacoes-e-para-diagnostico-laboratorial-de-tuberculose-e-micobacterias-nao-tuberculosas-de-interesse-em-saude-publica-no-brasil.pdf" target="_blank" rel="noopener noreferrer">Ministério da Saúde — Manual de diagnóstico laboratorial da tuberculose</a>; <a href="https://www.who.int/publications/i/item/9789240089488" target="_blank" rel="noopener noreferrer">OMS — Diretrizes consolidadas para diagnóstico rápido da TB, 2024</a>.</p>'},
{id:'sus26-2',number:2,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, trabalhador da construção civil, com tosse produtiva há quatro semanas, febre vespertina, sudorese noturna e perda de 5 kg. Radiografia mostra infiltrado cavitário em lobo superior direito.',prompt:'Indique o esquema de tratamento de primeira linha recomendado pelo Ministério da Saúde para esse paciente:',alternatives:['Rifampicina, isoniazida e pirazinamida por 6 meses, associado a etambutol nos 2 primeiros meses.','Rifampicina, isoniazida, pirazinamida e etambutol (RIPE) por 2 meses, seguido por rifampicina e isoniazida (RI) por 4 meses.','RIPE por 4 meses, seguido por RI por 2 meses.','Isoniazida, pirazinamida e etambutol por 4 meses, seguido por isoniazida e rifampicina por 2 meses.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>Para o adulto com TB pulmonar sensível, o esquema básico é 2 meses de RHZE (RIPE) na fase intensiva e 4 meses de RH na manutenção.</p><p><b>💡 Leve para a prova:</b> TB sensível no adulto = 2RHZE/4RH.</p>'},
{id:'sus26-3',number:3,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, com quadro clínico-radiológico compatível com tuberculose pulmonar cavitária.',prompt:'Identifique o principal critério para definir a cura do paciente ao término do tratamento, segundo as normas do Ministério da Saúde:',alternatives:['Resolução completa das alterações na radiografia de tórax ao final do sexto mês.','Ausência de sintomas respiratórios e resolução da cavitação ao final do sexto mês.','Negativação do teste tuberculínico (PPD) após a conclusão do esquema terapêutico.','Apresentação de duas baciloscopias de escarro negativas no quinto e sexto meses de tratamento.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A alternativa oficial privilegia a negativação bacteriológica no seguimento. Alterações radiológicas podem persistir mesmo após cura, sintomas isolados não bastam e PPD não é usado para documentar cura.</p><p><b>💡 Leve para a prova:</b> cura da TB não exige normalização radiológica nem negativação do PPD.</p>'},
{id:'sus26-4',number:4,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, IMC 32 kg/m², com edema generalizado, ascite e PA 150/95 mmHg. Creatinina 1,6 mg/dL, albumina 1,8 g/dL, colesterol 450 mg/dL, triglicerídeos 380 mg/dL e proteinúria de 24 h de 8,5 g. Sedimento com lipidúria e hematúria microscópica; sorologias B, C e HIV negativas e FAN não reagente.',prompt:'Diante dos dados clínicos apresentados, identifique a causa primária mais provável para o quadro atual da paciente:',alternatives:['Glomeruloesclerose segmentar e focal (GESF).','Nefropatia por IgA (Doença de Berger).','Glomerulonefrite membranoproliferativa (GNMP).','Doença de lesões mínimas (DLM).'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>O conjunto define síndrome nefrótica importante. Em adulto com obesidade, a GESF é uma causa particularmente associada e é a resposta oficial. IgA e GNMP tendem a apresentar fenótipo mais nefrítico/misto; doença de lesões mínimas é possível em adultos, mas o contexto favorece GESF.</p><p><b>💡 Leve para a prova:</b> obesidade é associação clássica com GESF secundária.</p>'},
{id:'sus26-5',number:5,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, com síndrome nefrótica: proteinúria 8,5 g/24 h, albumina 1,8 g/dL, edema, colesterol 450 mg/dL e triglicerídeos 380 mg/dL.',prompt:'Indique a fisiopatologia envolvida na hiperlipidemia apresentada pela paciente:',alternatives:['Redução da atividade da lipase lipoproteica, diminuindo a depuração de triglicerídeos.','Absorção intestinal aumentada de colesterol devido à perda de proteínas reguladoras.','Aumento da síntese hepática de lipoproteínas, estimulada pela baixa pressão oncótica.','Diminuição da excreção de colesterol pela bile por disfunção hepatocelular secundária.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p>Na síndrome nefrótica, a perda urinária maciça de proteínas reduz a pressão oncótica plasmática e estimula síntese hepática, inclusive de lipoproteínas, contribuindo para hiperlipidemia.</p><p><b>💡 Leve para a prova:</b> hipoalbuminemia nefrótica → resposta hepática compensatória → ↑ lipoproteínas.</p>'},
{id:'sus26-6',number:6,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, com edema generalizado, hipoalbuminemia grave, hiperlipidemia e proteinúria nefrótica.',prompt:'Identifique as complicações mais provavelmente associadas ao quadro clínico dessa paciente:',alternatives:['Acidose metabólica com ânion gap elevado, hipertensão maligna, encefalopatia hipertensiva.','Hipocalcemia sintomática, anemia hemolítica microangiopática e insuficiência cardíaca.','Glomerulonefrite rapidamente progressiva, síndrome urêmica e hipercalemia grave.','Trombose de veia renal, infecções por germes encapsulados e hiperlipidemia refratária.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A síndrome nefrótica favorece hipercoagulabilidade, perda urinária de imunoglobulinas e alterações lipídicas. Isso explica risco trombótico, maior suscetibilidade a infecções e hiperlipidemia.</p><p><b>💡 Leve para a prova:</b> síndrome nefrótica = trombose + infecção + dislipidemia.</p>'},
{id:'sus26-7',number:7,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome torácica aguda',caseText:'Homem, 28 anos, com anemia falciforme e uso irregular de hidroxiureia, apresenta dor torácica pleurítica, febre, tosse e dispneia. SpO₂ 88% em ar ambiente e radiografia mostra novo infiltrado em lobo inferior direito. Hb 7,2 g/dL e leucócitos 18.500/mm³.',prompt:'Identifique a fisiopatologia central envolvida no quadro atual do paciente:',alternatives:['Vaso-oclusão pulmonar por falcização de eritrócitos, infecção bacteriana e embolia gordurosa medular.','Tromboembolismo pulmonar recorrente por estado de hipercoagulabilidade crônica da anemia falciforme.','Lesão pulmonar aguda mediada por citocinas inflamatórias liberadas durante a hemólise intravascular.','Hipertensão pulmonar aguda por aumento súbito da resistência vascular pulmonar durante crise vaso-oclusiva.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>Febre, sintomas respiratórios, hipoxemia e novo infiltrado pulmonar em pessoa com doença falciforme caracterizam síndrome torácica aguda. Sua fisiopatologia é multifatorial, envolvendo vaso-oclusão/falcização, infecção e embolização gordurosa.</p><p><b>💡 Leve para a prova:</b> falciforme + novo infiltrado + sintomas respiratórios = síndrome torácica aguda.</p>'},
{id:'sus26-8',number:8,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome torácica aguda',caseText:'Homem, 28 anos, com anemia falciforme, febre, dor torácica, dispneia, SpO₂ 88% e novo infiltrado pulmonar.',prompt:'Indique a conduta terapêutica inicial mais adequada para esse quadro:',alternatives:['Hidratação volêmica vigorosa, iniciar ceftriaxone e realizar exsanguineotransfusão total.','Hidratação cautelosa, ceftriaxone e azitromicina, oxigênio suplementar.','Administrar corticoide sistêmico, iniciar levofloxacino e oxigênio suplementar.','Hidratação cautelosa, iniciar heparina não fracionada para anticoagulação plena.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>Na síndrome torácica aguda, o manejo inicial inclui oxigênio para hipoxemia, analgesia, hidratação cuidadosa e antibióticos cobrindo germes típicos e atípicos. Hidratação excessiva pode piorar o comprometimento pulmonar; anticoagulação não é tratamento de rotina.</p><p><b>⚠️ Atenção:</b> o gabarito desta questão foi retificado para B.</p><p><b>💡 Leve para a prova:</b> STA → O₂ + antibiótico + hidratação cautelosa; transfusão depende da gravidade.</p>'},
{id:'sus26-9',number:9,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Doença falciforme',caseText:'Após episódio de síndrome torácica aguda em paciente de 28 anos com anemia falciforme e acompanhamento irregular.',prompt:'Identifique as medidas mais indicadas para prevenir novos episódios, semelhantes ao atual, após a alta hospitalar:',alternatives:['Uso regular da hidroxiureia, profilaxia com penicilina benzatina e vacinação contra germes encapsulados.','Esplenectomia eletiva, profilaxia com amoxicilina oral e vacinação contra germes encapsulados.','Anticoagulação com varfarina, transfusões para manter Hb acima de 10 g/dL e profilaxia com amoxicilina.','Transfusões mensais para Hb acima de 10 g/dL, esplenectomia eletiva e profilaxia com penicilina benzatina.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>A alternativa oficial reúne medidas preventivas relacionadas à doença falciforme: adesão à hidroxiureia e prevenção de infecções por germes encapsulados. Esplenectomia e anticoagulação crônica não são estratégias rotineiras para prevenir síndrome torácica aguda.</p><p><b>💡 Leve para a prova:</b> hidroxiureia reduz complicações vaso-oclusivas da doença falciforme.</p>'},
{id:'sus26-10',number:10,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, vítima de espancamento, chega pálido, sudorético, FC 128 bpm, PA 90/58 mmHg, confuso, com extremidades frias, lactato 4,8 mmol/L, glicemia 178 mg/dL, hipotermia e oligúria.',prompt:'Indique o principal hormônio que promove a hiperglicemia durante a fase aguda do trauma:',alternatives:['Insulina.','Cortisol.','Glucagon.','Aldosterona.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p>A resposta aguda ao trauma é contrarregulatória. Entre as alternativas, o glucagon é o principal responsável por elevar rapidamente a glicemia por glicogenólise e gliconeogênese.</p><p><b>💡 Leve para a prova:</b> trauma agudo → hormônios contrarreguladores ↑; glucagon favorece hiperglicemia.</p>'},
{id:'sus26-11',number:11,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, em fase aguda após trauma com choque e resposta metabólica ao estresse.',prompt:'Indique a alternativa que descreve corretamente as modificações da fase de catabolismo agudo do trauma:',alternatives:['Mobilização de substratos energéticos e balanço nitrogenado negativo.','Predomínio de síntese proteica e armazenamento de energia.','Aumento da secreção de insulina e diminuição do consumo de oxigênio.','Retenção de glicose e formação de corpos cetônicos.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>A fase catabólica mobiliza reservas para sustentar a resposta ao estresse: aumenta proteólise e disponibilização de substratos, produzindo balanço nitrogenado negativo.</p><p><b>💡 Leve para a prova:</b> catabolismo pós-trauma = mobilização energética + perda proteica.</p>'},
{id:'sus26-12',number:12,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, em resposta aguda ao trauma e à hipovolemia.',prompt:'Indique o hormônio que tem como principal efeito aumentar a reabsorção de sódio e água nos rins, contribuindo para a manutenção do volume intravascular durante o trauma:',alternatives:['Hormônio antidiurético (ADH).','Cortisol.','Renina.','Aldosterona.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A aldosterona aumenta a reabsorção renal de sódio, com retenção secundária de água, ajudando a preservar o volume intravascular. O ADH atua sobretudo aumentando a reabsorção de água livre.</p><p><b>💡 Leve para a prova:</b> aldosterona → Na⁺; ADH → água.</p>'},
{id:'sus26-13',number:13,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Avaliação pré-operatória',caseText:'Homem, 68 anos, HAS, DM2 e DPOC leve, em avaliação para colectomia direita eletiva por adenocarcinoma. Refere dispneia apenas aos grandes esforços, sem doença coronariana prévia; ECG com extrassístoles supraventriculares isoladas.',prompt:'Indique a conduta mais adequada em relação à avaliação cardiovascular pré-operatória para esse paciente:',alternatives:['Realizar teste não invasivo (teste ergométrico ou cintilografia) se o resultado alterar a conduta cirúrgica e a capacidade funcional for < 4 METs.','Solicitar ecocardiograma transtorácico e teste ergométrico como recomendado para pacientes com mais de 65 anos.','Iniciar betabloqueador 10 dias antes da cirurgia para controle da hipertensão e da frequência cardíaca.','Cancelar o procedimento até avaliação cardiológica, independentemente da gravidade.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>Testes cardíacos adicionais no pré-operatório devem ser solicitados quando o resultado tiver potencial de modificar a conduta, especialmente diante de capacidade funcional reduzida e risco clínico/cirúrgico relevante. Idade isolada não obriga eco ou teste de esforço.</p><p><b>💡 Leve para a prova:</b> não peça teste pré-operatório “por rotina”; pergunte se o resultado mudará a conduta.</p>'},
{id:'sus26-14',number:14,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Avaliação pré-operatória',caseText:'Homem, 68 anos, DM2 em uso de metformina, será submetido a colectomia direita eletiva.',prompt:'Indique a conduta mais adequada para o controle glicêmico no perioperatório:',alternatives:['Suspender metformina 24 horas antes da cirurgia e reiniciar imediatamente após o término do procedimento.','Manter metformina até o dia da cirurgia e ajustar a dose de insulina conforme necessidade intraoperatória.','Suspender metformina uma semana antes da cirurgia devido ao risco de hipoglicemia.','Suspender metformina no dia anterior à cirurgia e utilizar esquema de insulina regular em bomba ou em correção conforme glicemia capilar.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>Entre as alternativas da prova, a estratégia correta é interromper a metformina no perioperatório e realizar controle glicêmico com insulina conforme monitorização. Reinício não deve ser automático imediatamente após a cirurgia, devendo considerar condições clínicas e função renal.</p><p><b>💡 Leve para a prova:</b> perioperatório exige monitorização glicêmica e ajuste temporário do tratamento.</p>'},
{id:'sus26-15',number:15,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Avaliação pré-operatória',caseText:'Homem, 68 anos, com DPOC leve em uso de tiotrópio, em avaliação pré-operatória para colectomia eletiva.',prompt:'Indique a melhor conduta em relação à avaliação pulmonar pré-operatória para este paciente:',alternatives:['Adiar a cirurgia e iniciar corticoide sistêmico profilático se o paciente for portador de DPOC.','Solicitar espirometria apenas se o resultado influenciar o planejamento anestésico ou cirúrgico.','Suspender o broncodilatador tiotrópio uma semana antes da cirurgia para evitar interação medicamentosa.','Realizar radiografia de tórax e espirometria de rotina, pois o paciente tem mais de 60 anos.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>A espirometria não é exame universal de rotina no pré-operatório de cirurgia não torácica. Ela é útil quando seus achados podem alterar planejamento ou manejo. Broncodilatadores habituais não devem ser suspensos sem indicação, e DPOC estável não exige corticoide sistêmico profilático.</p><p><b>💡 Leve para a prova:</b> avaliação pulmonar pré-op deve ser dirigida pela clínica e pelo impacto na conduta.</p>'}
];

{id:'sus26-46',number:46,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Apneia obstrutiva do sono',caseText:'Homem, 52 anos, motorista de caminhão, apresenta sonolência diurna excessiva, roncos intensos, pausas respiratórias testemunhadas e engasgos durante o sono. Tem HAS em uso de losartana e hidroclorotiazida, IMC 34 kg/m² e PA 145/95 mmHg. Apresenta laudo de MAPA de 24 horas.',prompt:'Indique o exame padrão-ouro para confirmar a principal hipótese diagnóstica desse caso:',expected:'Polissonografia noturna completa em laboratório (PSG tipo I).',accepted:['polissonografia','polissonografia noturna','polissonografia de noite inteira','monitorização multiparamétrica do sono'],concepts:['polissonografia'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial indica polissonografia noturna completa em laboratório (PSG tipo I).</p><p><b>💡 Leve para a prova:</b> suspeita de apneia obstrutiva do sono → polissonografia é o exame padrão-ouro.</p>'},
{id:'sus26-47',number:47,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Apneia obstrutiva do sono',caseText:'Homem, 52 anos, com quadro sugestivo de apneia obstrutiva do sono, HAS e MAPA de 24 horas disponível.',prompt:'Indique o achado presente na Monitorização (MAPA) mais característicamente associado à essa condição:',expected:'Ausência da redução fisiológica da pressão arterial de 10 a 20% durante o sono.',accepted:['ausência de descenso noturno','padrão não-dipper','padrão reverse dipper','queda noturna de pa < 10%','ascensão da pressão arterial durante o sono'],concepts:['descenso','noturno'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial é a ausência da redução fisiológica de 10–20% da PA durante o sono, também descrita como padrão não-dipper.</p><p><b>💡 Leve para a prova:</b> AOS associa-se à perda do descenso pressórico noturno.</p>'},
{id:'sus26-48',number:48,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Apneia obstrutiva do sono',caseText:'Homem, 52 anos, obeso, com sonolência diurna, roncos, apneias testemunhadas e quadro compatível com apneia obstrutiva do sono.',prompt:'Com base no quadro clínico, indique o tratamento de primeira linha para esse paciente:',expected:'Uso de dispositivo não invasivo que fornece pressão respiratória positiva contínua nas vias aéreas (CPAP).',accepted:['cpap','pressão positiva contínua nas vias aéreas','terapia com pressão positiva contínua','cpap noturno'],concepts:['cpap'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial indica CPAP, isto é, pressão positiva contínua nas vias aéreas.</p><p><b>💡 Leve para a prova:</b> AOS clinicamente relevante → CPAP é tratamento central.</p>'},
{id:'sus26-49',number:49,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Doença hepática e álcool',caseText:'Mulher, 48 anos, DM2 e sobrepeso, relata consumo frequente de cerveja e destilados há 10 anos. Ao exame, fígado palpável; ultrassonografia mostra ecotextura heterogênea e esteatose difusa.',prompt:'Indique a intervenção única, mais eficaz, para evitar a progressão da doença hepática nessa paciente:',expected:'Abstinência alcoólica.',accepted:['abstinência alcoólica','abstinência de álcool','suspender totalmente o consumo de bebidas alcoólicas','cessar o uso de álcool','parar de beber álcool'],concepts:['álcool'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial é abstinência alcoólica completa.</p><p><b>💡 Leve para a prova:</b> diante de doença hepática relacionada ao álcool, cessar o consumo é a intervenção isolada fundamental.</p>'},
{id:'sus26-50',number:50,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Estágios de mudança',caseText:'Mulher, 48 anos, com consumo frequente de álcool há anos, inicialmente descreve seu hábito apenas como consumo “social”, apesar da quantidade relatada.',prompt:'Classifique o estágio em que a paciente provavelmente se encontra em relação ao consumo alcoólico, conforme o modelo de Prochaska e DiClemente (estágios de mudança):',expected:'Pré-contemplação.',accepted:['pré-contemplação','pre contemplação','fase de pré-contemplação','estágio de pré-contemplação'],concepts:['contemplação'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial classifica a paciente em pré-contemplação, fase em que ainda não há reconhecimento suficiente do problema ou intenção concreta de mudança.</p><p><b>💡 Leve para a prova:</b> minimiza o problema e não planeja mudar → pré-contemplação.</p>'},
{id:'sus26-51',number:51,type:'short',exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Doença hepática e álcool',caseText:'Mulher, 48 anos, com esteatose difusa e ecotextura hepática heterogênea em ultrassonografia, além de consumo crônico de álcool.',prompt:'Indique o método não invasivo preferencial para estadiamento da doença hepática nessa paciente:',expected:'Elastografia hepática.',accepted:['elastografia hepática','fibroscan','elastografia','elastografia transitória','elastografia por rm','fib 4','fib-4'],concepts:['elastografia'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial traz elastografia hepática e aceita, entre outros, FibroScan, elastografia transitória, elastografia por RM e FIB-4.</p><p><b>💡 Leve para a prova:</b> estadiamento não invasivo de fibrose → pense em elastografia.</p>'},
{id:'sus26-52',number:52,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Trauma hepático',caseText:'Homem, 28 anos, vítima de trauma automobilístico, chega com PA 88/52 mmHg e FC 120 bpm. FAST mostra líquido livre predominantemente em loja hepática. Após cristaloides e concentrado de hemácias, apresenta melhora hemodinâmica. TC mostra lesão hepática grau IV, sem extravasamento ativo e sem outras lesões abdominais.',prompt:'Indique o principal critério clínico, deste caso, que define se o trauma hepático poderá ser tratado de forma não operatória:',expected:'Estabilidade hemodinâmica sustentada, sem necessidade de vasopressor.',accepted:['paciente hemodinamicamente estável','estabilidade hemodinâmica sustentada','estabilidade hemodinâmica mantida após reposição volêmica','estabilidade hemodinâmica sem uso de drogas vasoativas','hemodinâmica estável após ressuscitação inicial'],concepts:['estabilidade','hemodinâmica'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial define como critério central a estabilidade hemodinâmica sustentada, sem necessidade de vasopressor.</p><p><b>💡 Leve para a prova:</b> no trauma hepático, o grau anatômico não substitui a avaliação hemodinâmica para decidir manejo não operatório.</p>'},
{id:'sus26-53',number:53,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Trauma hepático',caseText:'Paciente com trauma hepático e instabilidade hemodinâmica persistente apesar da ressuscitação inicial.',prompt:'Indique a conduta imediata diante de um paciente com trauma hepático e instabilidade hemodinâmica persistente:',expected:'Realizar laparotomia exploradora emergencial.',accepted:['laparotomia exploratória de emergência','laparotomia exploradora','laparotomia com controle de danos','laparotomia com tamponamento hepático','laparotomia com packing hepático'],concepts:['laparotomia'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial indica laparotomia exploradora emergencial, aceitando também formulações de controle de danos/packing hepático.</p><p><b>💡 Leve para a prova:</b> trauma abdominal + instabilidade persistente → abordagem operatória de emergência.</p>'},
{id:'sus26-54',number:54,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Trauma hepático',caseText:'Paciente com trauma hepático grau IV tratado de forma não operatória após estabilização hemodinâmica.',prompt:'Determine as duas complicações tardias mais comuns do tratamento não operatório do trauma hepático:',expected:'Duas entre: bilioma, fístula biliar e hemorragia tardia.',accepted:['bilioma e fístula biliar','bilioma e hemorragia tardia','fístula biliar e hemorragia tardia'],concepts:['bilioma','fístula','hemorragia'],requiredCount:2,resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial aceita qualquer combinação de duas entre bilioma, fístula biliar e hemorragia tardia.</p><p><b>💡 Leve para a prova:</b> após manejo não operatório do fígado, lembre complicações biliares e sangramento tardio.</p>'},
{id:'sus26-55',number:55,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Hérnia inguinal',caseText:'Homem, 54 anos, trabalhador rural, com abaulamento inguinal direito há 2 anos, antes redutível aos esforços. Há 6 horas tornou-se doloroso, endurecido e irredutível, associado a dor e distensão abdominal. Massa inguinal direita dolorosa e irredutível; abdome distendido e descompressão brusca positiva em fossa ilíaca direita.',prompt:'Indique o diagnóstico mais provável que levou o paciente a procurar o Pronto-Socorro:',expected:'Hérnia inguinal direita complicada com estrangulamento.',accepted:['hérnia inguinal direita estrangulada','hérnia estrangulada','estrangulamento de hérnia inguinal','hérnia inguinal direita estrangulada com obstrução intestinal','hérnia inguinal direita estrangulada com sofrimento de alça'],concepts:['hérnia','estrangul'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial é hérnia inguinal direita estrangulada. Dor, endurecimento e irredutibilidade aguda sugerem complicação com sofrimento vascular do conteúdo herniário.</p><p><b>💡 Leve para a prova:</b> hérnia previamente redutível que fica dolorosa e irredutível → pense em encarceramento/estrangulamento; sinais de sofrimento elevam a urgência.</p>'},
{id:'sus26-56',number:56,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Hérnia inguinal',caseText:'Homem, 54 anos, com hérnia inguinal direita dolorosa e irredutível associada a sintomas abdominais.',prompt:'Indique o achado clínico que, se presente durante a avaliação inicial, terá maior impacto no prognóstico cirúrgico imediato:',expected:'Sinais de peritonite difusa e abdome agudo inflamatório grave.',accepted:['peritonite difusa','peritonite generalizada','abdome em tábua','rigidez abdominal difusa','defesa abdominal difusa','irritação peritoneal difusa','sinal de blumberg','choque séptico'],concepts:['periton'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial prioriza sinais de peritonite difusa/abdome agudo inflamatório grave, que sugerem comprometimento intestinal avançado e pior prognóstico imediato.</p><p><b>💡 Leve para a prova:</b> hérnia estrangulada + peritonite = gravidade cirúrgica máxima.</p>'},
{id:'sus26-57',number:57,type:'short',exam:'SUS-BA 2026',area:'Cirurgia',topic:'Hérnia inguinal',caseText:'Homem, 54 anos, com hérnia inguinal direita estrangulada, dolorosa e irredutível, associada a distensão e sinais de irritação peritoneal.',prompt:'Cite a conduta cirúrgica mais adequada para o paciente, neste momento:',expected:'Tratamento cirúrgico de urgência com exploração da hérnia/laparotomia conforme achados.',accepted:['cirurgia de urgência','tratamento cirúrgico de urgência','laparotomia exploratória','laparotomia exploradora','exploração cirúrgica'],concepts:['cirurg'],resolution:'<h3>🧠 Resolução comentada</h3><p>A questão exige abordagem cirúrgica urgente diante de hérnia estrangulada. A formulação exibida aqui será comparada por conceito, não por frase idêntica.</p><p><b>💡 Leve para a prova:</b> estrangulamento é emergência cirúrgica.</p>'},
{id:'sus26-58',number:58,type:'short',exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'SOP',caseText:'Mulher, 27 anos, G0P0, com ciclos de 40–60 dias desde a adolescência, infertilidade há 1 ano, IMC 32, acne, hirsutismo e acantose nigricans. Testosterona discretamente elevada, TSH e prolactina normais, resistência insulínica e ultrassom com ovários de 12 mL e ≥20 folículos periféricos.',prompt:'Indique o diagnóstico mais provável para esse caso clínico:',expected:'Síndrome dos ovários policísticos (SOP).',accepted:['síndrome dos ovários policísticos','sop','síndrome de ovários policísticos'],concepts:['ovários','policísticos'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial é síndrome dos ovários policísticos.</p><p><b>💡 Leve para a prova:</b> oligo/anovulação + hiperandrogenismo + morfologia ovariana policística compõem os eixos diagnósticos de Rotterdam.</p>'},
{id:'sus26-59',number:59,type:'short',exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'SOP',caseText:'Mulher, 27 anos, com irregularidade menstrual, acne/hirsutismo, hiperandrogenemia e ultrassom com morfologia policística.',prompt:'Identifique os três critérios de Rotterdam que embasam o diagnóstico dessa paciente:',expected:'Oligo/anovulação; hiperandrogenismo clínico e/ou bioquímico; morfologia ovariana policística ao ultrassom.',accepted:['oligoanovulação hiperandrogenismo ovários policísticos','oligo/anovulação hiperandrogenismo morfologia ovariana policística'],concepts:['ovulação','androgen','policíst'],requiredCount:3,resolution:'<h3>🧠 Resolução comentada</h3><p>Os três eixos são disfunção ovulatória, hiperandrogenismo e morfologia ovariana policística. O diagnóstico utiliza combinação dos critérios após exclusão de diagnósticos alternativos.</p><p><b>💡 Leve para a prova:</b> Rotterdam = O + H + P.</p>'},
{id:'sus26-60',number:60,type:'short',exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'SOP',caseText:'Mulher, 27 anos, com SOP, obesidade e resistência insulínica, tentando engravidar há 1 ano.',prompt:'Indique a primeira conduta terapêutica preconizada para pacientes com esse quadro clínico e que desejam engravidar:',expected:'Mudança do estilo de vida com perda de peso.',accepted:['mudança do estilo de vida','mudanças de estilo de vida','perda de peso','emagrecimento','atividade física e dieta'],concepts:['peso'],resolution:'<h3>🧠 Resolução comentada</h3><p>O padrão oficial prioriza mudança do estilo de vida/perda ponderal como primeira conduta nesse contexto.</p><p><b>💡 Leve para a prova:</b> SOP + excesso de peso → intervenção de estilo de vida é etapa inicial importante.</p>'}

{id:'sus26-16',number:16,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Câncer gástrico',caseText:'Paciente, sexo masculino, 63 anos de idade, procura o ambulatório com queixa de empachamento pós-prandial, perda ponderal de 10,0 kg nos últimos 4 meses e vômitos ocasionais. Nega comorbidades prévias. Ao exame físico, regular estado geral, descorado +2/+4, emagrecido; auscultas respiratória e cardíaca sem alterações; abdome plano, flácido, dor leve à palpação profunda do epigástrio, sem sinais de irritação peritoneal, massas não palpáveis. Foi realizado endoscopia digestiva alta que mostrou lesão ulcerada no antro gástrico, medindo 4,0 cm; feito biópsia que confirmou adenocarcinoma gástrico intestinal de Lauren. Realizado tomografia computadorizada de abdome e pelve que evidenciou espessamento parietal antral, linfonodos perigástricos aumentados e ausência de metástases à distância.',prompt:'Com base no caso, identifique a alternativa correta em relação à epidemiologia e fatores de risco para o câncer gástrico:',alternatives:['O tipo difuso de Lauren está mais relacionado à infecção por Helicobacter pylori do que o tipo intestinal.','A gastrectomia prévia e a gastrite atrófica autoimune aumentam o risco de adenocarcinoma gástrico.','O consumo de frutas e vegetais frescos é fator predisponente para câncer gástrico distal.','O câncer gástrico proximal tem maior associação com dieta rica em sal e nitratos do que o distal.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: B.</b> Gastrectomia prévia e gastrite atrófica autoimune são fatores associados ao risco de adenocarcinoma gástrico.</p>'},
{id:'sus26-17',number:17,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Câncer gástrico',caseText:'Paciente, sexo masculino, 63 anos de idade, com adenocarcinoma gástrico intestinal de Lauren localizado no antro, lesão de 4,0 cm, linfonodos perigástricos aumentados e ausência de metástases à distância.',prompt:'Indique a conduta mais correta para o tratamento cirúrgico do câncer gástrico distal localizado:',alternatives:['Gastrectomia subtotal com margem distal de 3 cm, independentemente do tipo histológico.','Gastrectomia subtotal com linfadenectomia D2, sem necessidade de ressecção do omento.','Gastrectomia total com linfadenectomia D3 e esofagojejunostomia em Y de Roux para todos os tumores antrais.','Gastrectomia subtotal com margem proximal ≥ 5 cm e linfadenectomia D2, preservando o baço se não houver invasão.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: D.</b> A alternativa indicada pela banca é gastrectomia subtotal com margem proximal ≥ 5 cm e linfadenectomia D2, preservando o baço na ausência de invasão.</p>'},
{id:'sus26-18',number:18,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Câncer gástrico',caseText:'Paciente, sexo masculino, 63 anos de idade, com adenocarcinoma gástrico intestinal de Lauren no antro e ausência de metástases à distância na tomografia.',prompt:'Indique a alternativa correta em relação à avaliação pré-operatória e ao estadiamento desse paciente:',alternatives:['A endoscopia digestiva alta com biópsia é suficiente para definir o estadiamento clínico inicial.','O PET-CT substitui a tomografia de abdome no estadiamento inicial de rotina.','A ultrassonografia endoscópica é útil para determinar profundidade da invasão (T) e linfonodos regionais (N).','O estadiamento laparoscópico não tem papel na avaliação pré-operatória de tumores gástricos'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: C.</b> A ultrassonografia endoscópica auxilia na avaliação locorregional, especialmente profundidade de invasão e linfonodos.</p>'},
{id:'sus26-19',number:19,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Sangramento uterino anormal',caseText:'Mulher, 46 anos de idade, G3P3 (três partos vaginais), procura ambulatório por sangramento uterino anormal há 12 meses. Tinha ciclos menstruais regulares anteriormente, mas vem com periodos menstruais mais frequentes este ano, com fluxo intenso nos últimos 6 ciclos (coágulos e troca de absorvente a cada 1 –2 horas nos piores dias). Relata fadiga progressiva, palpitações e dois episódios de lipotimia nas últimas 2 semanas. Nega uso de ACO. Antecedentes: HAS controlada (losartana), IMC 32 Kg/m2. Exame físico: pálida (++/4), PA 130/85 mmHg, FC 88 bpm; tireoide sem alterações. Abdome flácido, indolor, Exame ginecológico: colo sem lesões, útero discretamente aumentado à palpação bimanual, sem dor anexial. Laboratório: Hb 9,8 g/dL, Ht 30%, VCM 74 fL, ferritina 8 ng/mL, TSH 2,1 mUI/L, beta-hCG negativo. USG transvaginal (fase proliferativa tardia): endométrio difusamente espessado (14 mm); miométrio heterogêneo discreto; anexos sem alterações. Paciente refere desejo de manter útero e evitar internações.',prompt:'Indique a conduta inicial mais adequada para essa paciente:',alternatives:['Histeroscopia diagnóstica com biópsia dirigida.','Curetagem uterina diagnóstica.','Progestagênio oral empírico.','Apenas acompanhamento clínico.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: A.</b> A banca indica histeroscopia diagnóstica com biópsia dirigida para investigação endometrial.</p>'},
{id:'sus26-20',number:20,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Sangramento uterino anormal',caseText:'Mulher, 46 anos, com sangramento uterino anormal, IMC 32 Kg/m2 e endométrio difusamente espessado (14 mm).',prompt:'Com base no caso apresentado e no conhecimento sobre fatores de risco para hiperplasia/carcinoma endometrial, identifique o principal fator de risco:',alternatives:['História familiar de câncer de mama.','Uso de losartana.','Obesidade.','Menarca tardia.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: C.</b> Entre as alternativas apresentadas, obesidade é o principal fator de risco indicado.</p>'},
{id:'sus26-21',number:21,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Sangramento uterino anormal',caseText:'Mulher, 46 anos, com sangramento uterino anormal intenso, Hb 9,8 g/dL, VCM 74 fL e ferritina 8 ng/mL.',prompt:'Indique a medida terapêutica adjuvante que pode ser iniciada concomitantemente à investigação diagnóstica desse caso:',alternatives:['Inserção de DIU medicado com levonorgestrel.','Administração empírica de GnRH agonista por 6 meses.','Terapia estrogênica isolada contínua.','Suplementação de ferro.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: D.</b> Os dados laboratoriais demonstram anemia microcítica com ferritina baixa; a banca indica suplementação de ferro como medida adjuvante.</p>'},
{id:'sus26-22',number:22,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Síndrome do anticorpo antifosfolípide',caseText:'Mulher, 32 anos de idade, G3P0A3. Três perdas gestacionais consecutivas com <12 semanas: 8, 9 e 10 semanas (todas com embrião e BCF prévio, seguidas de sangramento). Nega infecções nas gestações; nega consumo de álcool ou tabagismo. Sem antecedente de trombose, IMC 24 kg/m². Dados da investigação já feita: histerossalpingografia e histeroscopia diagnóstica normais; ultrassom 3D sem malformações. Cariótipo parental: 46, XX/46, XY. TSH 1,5 mUI/L; prolactina normal; trombofilias hereditárias ausentes. Anticorpos antifosfolípides: anticardiolipina IgG elevada em duas coletas com 14 semanas de intervalo; anticoagulante lúpico negativo; anti-β2GP1 limítrofe.',prompt:'Diante do quadro clínico, identifique o diagnóstico mais provável:',alternatives:['Insuficiência lútea.','Síndrome do anticorpo antifosfolípide (SAAF).','Malformação uterina.','Infecção crônica uterina.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: B.</b> A alternativa indicada pela banca é síndrome do anticorpo antifosfolípide.</p>'},
{id:'sus26-23',number:23,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Síndrome do anticorpo antifosfolípide',caseText:'Mulher, 32 anos, G3P0A3, com três perdas gestacionais consecutivas e anticardiolipina IgG elevada em duas coletas com 14 semanas de intervalo.',prompt:'Indique a conduta recomendada na próxima gestação, segundo protocolos nacionais e internacionais:',alternatives:['AAS em baixa dose e heparina de baixo peso molecular profilática.','Apenas AAS.','Prednisona e AAS.','Progesterona vaginal isolada.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: A.</b> A banca indica AAS em baixa dose associado à heparina de baixo peso molecular profilática.</p>'},
{id:'sus26-24',number:24,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Síndrome do anticorpo antifosfolípide',caseText:'Mulher, 32 anos, com diagnóstico do caso compatível com síndrome do anticorpo antifosfolípide e histórico de perdas gestacionais recorrentes.',prompt:'Indique outra complicação obstétrica associada ao diagnóstico do caso, além de abortos recorrentes:',alternatives:['Acretismo placentário.','Diabetes gestacional.','Pré-eclâmpsia grave e/ou parto prematuro < 34 semanas.','Gestação ectópica.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: C.</b> A alternativa oficial relaciona SAAF a pré-eclâmpsia grave e/ou parto prematuro antes de 34 semanas.</p>'},
{id:'sus26-25',number:25,exam:'SUS-BA 2026',area:'Ginecologia e Obstetrícia',topic:'Diabetes gestacional',caseText:'Mulher, 28 anos de idade, G2P1, 26 semanas de gestação, sem comorbidades prévias. História familiar de diabetes mellitus tipo 2 (pai). Ganho ponderal de 10 kg até o momento. Teste oral de tolerância à glicose (TOTG) 75 g: jejum 94 mg/dL; 1 h: 185 mg/dL; 2 h: 161 mg/dL. Relata alimentação rica em carboidratos simples e rotina sedentária por trabalho administrativo. Ultrassonografia obstétrica às 26 semanas: feto único, crescimento adequado (p60), líquido amniótico normal, doppler normal. Sem cetonúria. Não usa medicamentos. Solicita plano alimentar estruturado.',prompt:'Segundo as Diretrizes Nacionais da FEBRASGO, os dados clinicos e laboratoriais apresentados por essa paciente são compatíveis com:',alternatives:['Gestação normal.','Diabetes mellitus gestacional.','Pré-diabetes.','Diabetes prévio (diabetes melittus tipo 2).'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p><b>Gabarito oficial: B.</b> A banca classifica os achados como diabetes mellitus gestacional.</p>'},

1:'Homem, 35 anos de idade, trabalhador da construção civil, procura a UBS com queixa de tosse produtiva há quatro semanas, associada à febre vespertina (não aferida), sudorese noturna e perda de 5 kg no período. Nega comorbidades, tabagismo ou uso de drogas ilícitas. Relata que um colega de trabalho foi recentemente diagnosticado e tratado para tuberculose. Ao exame físico, encontra-se emagrecido, hipocorado (+/4+), com murmúrio vesicular diminuído e estertores crepitantes em ápice pulmonar direito. A radiografia de tórax, solicitada na Unidade, mostra um infiltrado com cavitação em lobo superior direito. O paciente reside com sua esposa e dois filhos, um de 4 anos e outro de 8 anos.',
4:'Mulher, 32 anos de idade, com história de obesidade (IMC 32 kg/m2), é admitida na enfermaria de clínica médica para investigação de edema generalizado de início há 3 semanas, progressivo, associado a ganho de peso de 8 kg. Ao exame, apresenta-se hipertensa (PA 150/95 mmHg), com edema ++/4+ em membros inferiores, edema periorbital e ascite. Exames laboratoriais revelam: creatinina 1,6 mg/dL, albumina sérica 1,8 g/dL, colesterol total 450 mg/dL, triglicerídeos 380 mg/dL. A proteinúria de 24 horas foi de 8,5 gramas. O sedimento urinário mostrou lipidúria e hematúria microscópica, sem leucocitúria significativa. As sorologias para hepatites B, C e HIV foram negativas, e o FAN foi não reagente.',

// Reconcile SUS-BA 2024.1 against the definitive Strix answer key, including annulments.
// Retain every original attempt and selected alternative; repair grading and stored seed metadata.
function reconcileSUS241Definitive(){
 let changed=false;
 // Rebuild the FULL official exam from the original source on every local/cloud load.
 // A previously saved question may have the correct ID but a shifted stem or choices.
 const seeds=new Map(SUS241.map(q=>[q.id,q]));
 const officialFields=['number','exam','area','topic','type','caseText','prompt','alternatives','correctIndex','annulled','resolution'];
 const seen=new Set();
 for(const saved of db.bankQuestions||[]){
  const seed=seeds.get(saved.id);if(!seed)continue;
  seen.add(seed.id);
  for(const k of officialFields){
   if(JSON.stringify(saved[k])!==JSON.stringify(seed[k])){
    if(seed[k]===undefined)delete saved[k];else saved[k]=seed[k];
    changed=true;
   }
  }
 }
 for(const seed of SUS241){if(!seen.has(seed.id)){db.bankQuestions.push({...seed});changed=true}}
 // Correct previous grading without deleting attempts or changing selected answers.
 for(const attempt of db.bankAttempts||[]){
  const seed=seeds.get(attempt.questionId);if(!seed||seed.number>45)continue;
  const correct=seed.annulled?true:attempt.answer===seed.correctIndex;
  if(attempt.correct!==correct){attempt.correct=correct;attempt.correctedByDefinitive=true;changed=true}
 }
 return changed;
}

const FLASHMED_ASSET_DB='flashmed_assets_v1',FLASHMED_ASSET_STORE='images';
function flashmedAssetDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(FLASHMED_ASSET_DB,1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains(FLASHMED_ASSET_STORE))d.createObjectStore(FLASHMED_ASSET_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function flashmedAssetPut(id,value){let d=await flashmedAssetDB();return new Promise((resolve,reject)=>{let tx=d.transaction(FLASHMED_ASSET_STORE,'readwrite');tx.objectStore(FLASHMED_ASSET_STORE).put(value,id);tx.oncomplete=()=>{d.close();resolve(true)};tx.onerror=()=>{d.close();reject(tx.error)}})}
async function flashmedAssetGet(id){let d=await flashmedAssetDB();return new Promise((resolve,reject)=>{let tx=d.transaction(FLASHMED_ASSET_STORE,'readonly'),q=tx.objectStore(FLASHMED_ASSET_STORE).get(id);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error);tx.oncomplete=()=>d.close()})}
async function flashmedAssetDelete(id){let d=await flashmedAssetDB();return new Promise((resolve,reject)=>{let tx=d.transaction(FLASHMED_ASSET_STORE,'readwrite');tx.objectStore(FLASHMED_ASSET_STORE).delete(id);tx.oncomplete=()=>{d.close();resolve(true)};tx.onerror=()=>{d.close();reject(tx.error)}})}

function balancedBankSample(pool,n){
 let groups={};for(const q of pool)(groups[q.exam]||(groups[q.exam]=[])).push(q);
 let exams=shuffleBankQuestions(Object.keys(groups));for(const e of exams)groups[e]=shuffleBankQuestions(groups[e]);

 while(out.length<n){
  let added=false;
  for(const e of shuffleBankQuestions(exams)){
   let q=groups[e].find(x=>!used.has(x.id));if(!q)continue;
   out.push(q);used.add(q.id);added=true;if(out.length>=n)break;
  }
  if(!added)break;
 }

}

function bankFlashcardSuggest(phrase){
 let t=bankFlashcardPlain(phrase).replace(/[.!?]+$/,'').trim();if(!t)return{front:'',back:''};

function refreshBankErrorFlashcards(options={}){
 // Migrate only flashcards linked to bank questions; keep manually edited cards intact.
 // The migration is idempotent and preserves all study history, intervals and due dates.
 let changed=false,updated=0,skipped=0;
 const oldPattern=/^(Em .+, qual exame ou teste|Em .+, qual é a conduta|Qual é o principal agente ou causa|Qual é o critério ou definição|Qual é a principal medida de prevenção|Qual é o ponto-chave cobrado)/i;

  if(card.bankQuestionId==null)continue;
  const q=questions.get(String(card.bankQuestionId));if(!q){skipped++;continue}

  const back=esc(bankFlashcardTakeaway(q));
  const previous=stripBankHtml(card.front||'').trim();

  const autoBack=card.bankAutoBack?card.back===card.bankAutoBack:true;
  if(card.front!==front){card.front=front;changed=true;updated++}
  if(autoBack&&card.back!==back){card.back=back;changed=true}
  if(card.bankAutoFront!==front||card.bankCardVersion!==2){card.bankAutoFront=front;card.bankCardVersion=2;changed=true}
  if(autoBack&&card.bankAutoBack!==back){card.bankAutoBack=back;changed=true}
 }
 if(changed){

   localStorage.setItem(KEY,JSON.stringify(flashmedLocalPayload(db)));

 }

}

function flashmedMergePersonal(remote,local){

  let a=Array.isArray(remote[key])?remote[key]:[],b=Array.isArray(local[key])?local[key]:[];

  for(const item of b){let id=String(item?.[idKey]??'');if(!id||seen.has(id))continue;a.push(item);seen.add(id);changed=true}
  remote[key]=a;

  if(local[key]&&typeof local[key]==='object'&&!Array.isArray(local[key])){
   remote[key]=remote[key]||{};
   for(const [k,v] of Object.entries(local[key]))if(!(k in remote[key])){remote[key][k]=v;changed=true}
  }

function mergeCardStudyHistory(remote,local){
 if(!remote||!local||!Array.isArray(remote.cards)||!Array.isArray(local.cards))return false;
 const localById=new Map(local.cards.map(c=>[String(c.id),c]));
 let changed=false;
 for(const card of remote.cards){
  const old=localById.get(String(card.id));if(!old)continue;
  const existing=Array.isArray(card.history)?card.history:[];
  const previous=Array.isArray(old.history)?old.history:[];
  const count=new Map();
  const signature=h=>JSON.stringify([h.date||'',h.rating||'',h.at||h.timestamp||'']);
  for(const h of existing){const k=signature(h);count.set(k,(count.get(k)||0)+1)}
  for(const h of previous){
   const k=signature(h),n=count.get(k)||0;
   if(n>0){count.set(k,n-1);continue}
   existing.push(h);changed=true;
  }
  if(changed)card.history=existing;
  const good=existing.filter(h=>h.rating==='ok'||h.rating==='easy').length;
  const bad=existing.filter(h=>h.rating!=='ok'&&h.rating!=='easy').length;
  const newOk=Math.max(card.ok||0,old.ok||0,good),newBad=Math.max(card.bad||0,old.bad||0,bad);
  if(newOk!==(card.ok||0)||newBad!==(card.bad||0)){card.ok=newOk;card.bad=newBad;changed=true}
  if(previous.length>0&&(!card.due||((old.history||[]).length>=(card.history||[]).length&&old.due&&old.due>card.due))){
   if(old.due&&old.due!==card.due){card.due=old.due;card.interval=Math.max(card.interval||0,old.interval||0);changed=true}
  }
 }
 return changed;
}

function decorebaSuggestion(q){let ans=q.type==='short'?(q.expected||''):(q.alternatives?.[q.correctIndex]||'');let topic=q.topic||q.area||'Este tema';return ans?`${topic}: ${String(ans).replace(/\s+/g,' ').trim()}`:`${topic}: registre aqui o critério, valor, dose ou associação que precisa lembrar.`}
function addDecorebaFromBank(id){let q=(db.bankQuestions||[]).find(x=>x.id===id);if(!q)return;db.decorebas=db.decorebas||[];let old=db.decorebas.find(x=>x.questionId===id);if(old)return toast('Essa questão já está no Caderno de Decorebas ♡');let suggestion=decorebaSuggestion(q),phrase=prompt('📒 Qual é a frase que você precisa decorar?\n\nEdite a sugestão abaixo para ficar do seu jeito:',suggestion);if(!phrase||!phrase.trim())return;db.decorebas.push({id:Date.now(),questionId:id,exam:q.exam||'',number:q.number||'',area:q.area||'',topic:q.topic||'',text:phrase.trim(),createdAt:Date.now(),mastered:false});save();toast('Decoreba salva no seu caderno 🩷')}
function toggleDecoreba(id){let d=(db.decorebas||[]).find(x=>x.id==id);if(!d)return;d.mastered=!d.mastered;save();render()}
function deleteDecoreba(id){if(!confirm('Remover esta decoreba do caderno?'))return;db.decorebas=(db.decorebas||[]).filter(x=>x.id!=id);save();render()}
function decorebasView(){let a=(db.decorebas||[]).slice().sort((x,y)=>(x.mastered-y.mastered)||(y.createdAt-x.createdAt)),pending=a.filter(x=>!x.mastered).length;return `<div class='panel hero'><h2>📒 Caderno de Decorebas</h2><p>Seu caderno pessoal de critérios, números, doses e associações que não podem escapar na prova.</p><div class=row><span class=pill>🧠 ${pending} para fixar</span><span class=pill>✓ ${a.length-pending} já fixadas</span></div></div><div class=panel style='margin-top:16px'><p class=muted>Nas resoluções do Banco de Questões, use <b>📒 Isso é decoreba</b>. O FlashMed prepara uma frase com o gabarito da questão e você pode ajustá-la antes de salvar.</p>${a.length?a.map(d=>`<div class=qbox style='opacity:${d.mastered?.68:1}'><div class=row style='justify-content:space-between'><div><span class=tag>${esc(d.topic||d.area||'Decoreba')}</span> ${d.exam?`<span class=muted>${esc(d.exam)} Q${d.number}</span>`:''}</div><div class=row><button class='btn ghost mini' onclick='toggleDecoreba(${d.id})'>${d.mastered?'↩ Rever':'✓ Já fixei'}</button><button class='btn ghost mini' onclick='deleteDecoreba(${d.id})'>Excluir</button></div></div><p style='font-size:17px'><b>${esc(d.text)}</b></p></div>`).join(''):'<div class=qbox><b>Seu caderno ainda está vazio.</b><p class=muted>Quando uma questão cobrar uma informação que é pura decoreba, salve-a direto da resolução.</p></div>'}</div>`}

function shuffleGame(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function startMemoryGame(){let pairs=shuffleGame(MEMORY_PAIRS).slice(0,6),cards=[];pairs.forEach((p,i)=>{cards.push({id:i+'a',pair:i,text:p[0]},{id:i+'b',pair:i,text:p[1]})});memoryState={cards:shuffleGame(cards),open:[],matched:new Set(),moves:0};renderMemoryGame()}
function renderMemoryGame(){title.textContent='Jogos';let s=memoryState;view.innerHTML=`<div class=panel><div class=row style='justify-content:space-between'><div class=row><button class='btn ghost' onclick="go('Jogos')">← Jogos</button><span class=pill>🧠 Memória Médica</span></div><span class=pill>🎯 ${s.moves} jogadas</span></div><p class=muted>Encontre os 6 pares relacionados. Não são cartas idênticas: você precisa lembrar a associação médica.</p><div class=memoryBoard>${s.cards.map((c,i)=>{let shown=s.open.includes(i)||s.matched.has(c.pair);return `<button class="memoryCard ${shown?'':'covered'} ${s.matched.has(c.pair)?'matched':''}" onclick="flipMemory(${i})" ${s.matched.has(c.pair)?'disabled':''}>${shown?esc(c.text):'✦'}</button>`}).join('')}</div>${s.matched.size===6?`<div class='panel hero' style='margin-top:16px;text-align:center'><h2>🎉 Você encontrou todos!</h2><p>${s.moves} jogadas</p><button class=btn onclick='startMemoryGame()'>Jogar novamente</button></div>`:''}</div>`}
function flipMemory(i){let s=memoryState;if(s.open.includes(i)||s.matched.has(s.cards[i].pair)||s.open.length>=2)return;s.open.push(i);renderMemoryGame();if(s.open.length===2){s.moves++;let [a,b]=s.open;if(s.cards[a].pair===s.cards[b].pair){s.matched.add(s.cards[a].pair);s.open=[];setTimeout(renderMemoryGame,350)}else setTimeout(()=>{s.open=[];renderMemoryGame()},850)}}
function startGame(type){let a=FLASH_GAMES[type];gameState={type,index:Math.floor(Math.random()*a.length),reveal:false,score:0,round:1,max:10,answered:false};renderGame()}

function finishGame(){let m=GAME_META[gameState.type],pct=Math.round(gameState.score/gameState.max*100);view.innerHTML=`<div class='panel hero' style='text-align:center'><div class=gameIcon>${m[0]}</div><h2>Partida concluída!</h2><div style='font-size:48px;font-weight:950'>${gameState.score}/${gameState.max}</div><p>${pct}% de acertos</p><div class=row style='justify-content:center'><button class=btn onclick="startGame('${gameState.type}')">Jogar novamente</button><button class='btn ghost' onclick="go('Jogos')">Outros jogos</button></div></div>`}
