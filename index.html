:root{--bg:#fff7fb;--card:#fff;--ink:#3b2532;--muted:#8b7280;--pink:#e85b9e;--pink2:#f38bbb;--rose:#ffd9e9;--rose2:#fff0f6;--deep:#7b3157;--ok:#42a57a;--bad:#e85d68;--warn:#e9a43a;--blue:#6f87d8;--line:#f1dce6;--shadow:0 12px 35px rgba(115,45,82,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 85% 5%,#ffe6f1 0,transparent 24%),var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#7d3158,#4d263d);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:950;font-size:22px;padding:4px 10px 2px}.owner{font-size:12px;color:#ffdceb;padding:0 10px 18px}.navTitle{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#dca9c1;padding:15px 10px 5px}.nav button{display:block;width:100%;border:0;background:transparent;color:#f3dce7;text-align:left;padding:11px 12px;border-radius:12px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.on{background:#ffffff19;color:#fff}.main{padding:26px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.clock{font-weight:900;color:var(--deep)}h1,h2,h3{letter-spacing:-.02em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.kpi,.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.kpi b{font-size:27px;display:block;margin-top:8px}.muted{color:var(--muted);font-size:13px}.cols{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.btn{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,var(--pink),#d9488b);color:white;font-weight:800;cursor:pointer;box-shadow:0 5px 14px #e85b9e22}.btn.ghost{background:#fff0f6;color:var(--deep);box-shadow:none;border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.blue{background:var(--blue)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;margin:5px 0 12px;color:var(--ink)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pill{padding:8px 11px;border-radius:999px;background:var(--rose2);color:var(--deep);font-size:13px;border:1px solid var(--line)}.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.deck .panel{cursor:pointer}.flash{min-height:340px;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(145deg,#fff,#fff0f7);border-radius:26px;border:1px solid #f1cddd;box-shadow:var(--shadow)}.flash h2{max-width:820px}.media img,.media video,.media iframe,.rich img{max-width:100%;max-height:360px;border:0;border-radius:15px;object-fit:contain}.media audio{width:min(520px,100%)}.bar{height:10px;background:#f8e7ef;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink2),var(--pink))}.hidden{display:none!important}.chart{display:flex;align-items:flex-end;gap:9px;height:190px;padding-top:15px}.chart i{flex:1;background:linear-gradient(var(--pink2),var(--pink));border-radius:9px 9px 3px 3px;min-height:3px;position:relative}.chart i span{position:absolute;bottom:-22px;font-size:10px;color:#8d7280;left:50%;transform:translateX(-50%)}.qbox{padding:15px;border:1px solid var(--line);border-radius:15px;margin:10px 0;background:#fff}.choice{display:block;padding:10px;border-radius:10px;background:#fff4f8;margin:7px 0}.toast{position:fixed;right:18px;bottom:18px;background:#4d263d;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1}.timer{font-size:42px;font-weight:950;color:var(--deep)}.tag{font-size:11px;background:#fff0f6;padding:5px 8px;border-radius:99px;color:var(--deep)}.danger{color:var(--bad)}.hero{background:linear-gradient(135deg,#fff,#ffe8f2);overflow:hidden;position:relative}.hero:after{content:'⚕︎';position:absolute;right:22px;top:0;font-size:110px;color:#e85b9e12}.subjectGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.subjectCard{background:linear-gradient(145deg,#fff,#fff5f9);border:1px solid var(--line);border-radius:18px;padding:16px}.subjectCard .icon{font-size:25px}.editorWrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:5px 0 12px;background:#fff}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px;background:#fff4f8;border-bottom:1px solid var(--line)}.toolbar button,.toolbar select{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px;cursor:pointer}.editor{min-height:115px;padding:12px;outline:none}.editor:empty:before{content:attr(data-placeholder);color:#b79aa8}.draw{border:1px dashed #df9bbb;border-radius:14px;background:white;touch-action:none;width:100%;height:220px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{font-size:12px}.cloud{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--ok)}.importBox{background:#fff7fb;border:1px dashed #e5a4c2;border-radius:14px;padding:14px}.metricTable{width:100%;border-collapse:collapse}.metricTable td,.metricTable th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.metricTable th{font-size:12px;color:var(--muted)}.answerBtns{justify-content:center;margin-top:16px}.answerBtns .btn{min-width:92px}.scribble{font-family:"Comic Sans MS","Segoe Print",cursive}.serif{font-family:Georgia,serif}.mono{font-family:ui-monospace,monospace}@media(max-width:980px){.app{grid-template-columns:1fr}.side{height:auto;position:static;padding-bottom:10px}.nav{display:flex;overflow:auto}.navTitle{display:none}.nav button{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}.cols,.split{grid-template-columns:1fr}.subjectGrid,.deck{grid-template-columns:repeat(2,1fr)}.main{padding:15px}}@media(max-width:600px){.grid,.subjectGrid,.deck{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.answerBtns .btn{min-width:auto;padding:9px}.flash{min-height:300px;padding:18px}}@media(max-width:430px){.grid,.subjectGrid,.deck{grid-template-columns:1fr}.timer{font-size:34px}}

const KEY='flashmed_larissa_final', CFG='flashmed_cloud_cfg'; const SUPABASE_URL='https://irjpveynnpiaumdmticc.supabase.co'; const SUPABASE_KEY='sb_publishable_iYJdysVrOSuiI5jxFATgpg_7hX-Yecv'; const now=()=>new Date(), day=()=>now().toISOString().slice(0,10); const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{owner:'Larissa Fernandes',subjects:['Obstetrícia','Pediatria'],subjectIcons:{'Obstetrícia':'🤰','Pediatria':'🧸'},cards:[],questions:[],sessions:[],reminders:[],settings:{goal:60},updatedAt:Date.now()}; db.subjectIcons=db.subjectIcons||{}; db.bankQuestions=db.bankQuestions||[]; db.bankAttempts=db.bankAttempts||[]; db.bankAnnotations=db.bankAnnotations||{};
const SUS26_1=[
{id:'sus26-1',number:1,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, trabalhador da construção civil, com tosse produtiva há quatro semanas, febre vespertina, sudorese noturna e perda de 5 kg. Teve contato recente com colega tratado para tuberculose. Ao exame, está emagrecido e apresenta estertores em ápice direito. Radiografia: infiltrado com cavitação em lobo superior direito. Reside com esposa e dois filhos, de 4 e 8 anos.',prompt:'Indique a conduta prioritária para a confirmação diagnóstica do paciente:',alternatives:['Solicitar teste tuberculínico (PPD) e aguardar o resultado em 72 horas para definir a conduta.','Coletar duas amostras de escarro para baciloscopia e teste rápido molecular (TRM-TB).','Realizar broncoscopia com lavado broncoalveolar e cultura em meio de Lowenstein-Jensen.','Iniciar imediatamente o esquema terapêutico padrão e observar a resposta clínica do paciente.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>O quadro é altamente sugestivo de tuberculose pulmonar bacilífera. A confirmação deve priorizar investigação bacteriológica do escarro, incluindo TRM-TB, em vez de PPD, broncoscopia de rotina ou teste terapêutico.</p><p><b>Por que as demais não são a melhor resposta?</b> PPD avalia infecção e não confirma doença pulmonar ativa; broncoscopia não é o primeiro passo quando há escarro disponível; resposta ao tratamento não deve substituir confirmação microbiológica quando esta é factível.</p><p><b>💡 Leve para a prova:</b> suspeita de TB pulmonar + escarro disponível → investigação bacteriológica/TRM-TB.</p>'},
{id:'sus26-2',number:2,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, trabalhador da construção civil, com tosse produtiva há quatro semanas, febre vespertina, sudorese noturna e perda de 5 kg. Radiografia mostra infiltrado cavitário em lobo superior direito.',prompt:'Indique o esquema de tratamento de primeira linha recomendado pelo Ministério da Saúde para esse paciente:',alternatives:['Rifampicina, isoniazida e pirazinamida por 6 meses, associado a etambutol nos 2 primeiros meses.','Rifampicina, isoniazida, pirazinamida e etambutol (RIPE) por 2 meses, seguido por rifampicina e isoniazida (RI) por 4 meses.','RIPE por 4 meses, seguido por RI por 2 meses.','Isoniazida, pirazinamida e etambutol por 4 meses, seguido por isoniazida e rifampicina por 2 meses.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>Para o adulto com TB pulmonar sensível, o esquema básico é 2 meses de RHZE (RIPE) na fase intensiva e 4 meses de RH na manutenção.</p><p><b>💡 Leve para a prova:</b> TB sensível no adulto = 2RHZE/4RH.</p>'},
{id:'sus26-3',number:3,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Tuberculose',caseText:'Homem, 35 anos, com quadro clínico-radiológico compatível com tuberculose pulmonar cavitária.',prompt:'Identifique o principal critério para definir a cura do paciente ao término do tratamento, segundo as normas do Ministério da Saúde:',alternatives:['Resolução completa das alterações na radiografia de tórax ao final do sexto mês.','Ausência de sintomas respiratórios e resolução da cavitação ao final do sexto mês.','Negativação do teste tuberculínico (PPD) após a conclusão do esquema terapêutico.','Apresentação de duas baciloscopias de escarro negativas no quinto e sexto meses de tratamento.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A alternativa oficial privilegia a negativação bacteriológica no seguimento. Alterações radiológicas podem persistir mesmo após cura, sintomas isolados não bastam e PPD não é usado para documentar cura.</p><p><b>💡 Leve para a prova:</b> cura da TB não exige normalização radiológica nem negativação do PPD.</p>'},
{id:'sus26-4',number:4,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, IMC 32 kg/m², com edema generalizado, ascite e PA 150/95 mmHg. Creatinina 1,6 mg/dL, albumina 1,8 g/dL, colesterol 450 mg/dL, triglicerídeos 380 mg/dL e proteinúria de 24 h de 8,5 g. Sedimento com lipidúria e hematúria microscópica; sorologias B, C e HIV negativas e FAN não reagente.',prompt:'Diante dos dados clínicos apresentados, identifique a causa primária mais provável para o quadro atual da paciente:',alternatives:['Glomeruloesclerose segmentar e focal (GESF).','Nefropatia por IgA (Doença de Berger).','Glomerulonefrite membranoproliferativa (GNMP).','Doença de lesões mínimas (DLM).'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>O conjunto define síndrome nefrótica importante. Em adulto com obesidade, a GESF é uma causa particularmente associada e é a resposta oficial. IgA e GNMP tendem a apresentar fenótipo mais nefrítico/misto; doença de lesões mínimas é possível em adultos, mas o contexto favorece GESF.</p><p><b>💡 Leve para a prova:</b> obesidade é associação clássica com GESF secundária.</p>'},
{id:'sus26-5',number:5,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, com síndrome nefrótica: proteinúria 8,5 g/24 h, albumina 1,8 g/dL, edema, colesterol 450 mg/dL e triglicerídeos 380 mg/dL.',prompt:'Indique a fisiopatologia envolvida na hiperlipidemia apresentada pela paciente:',alternatives:['Redução da atividade da lipase lipoproteica, diminuindo a depuração de triglicerídeos.','Absorção intestinal aumentada de colesterol devido à perda de proteínas reguladoras.','Aumento da síntese hepática de lipoproteínas, estimulada pela baixa pressão oncótica.','Diminuição da excreção de colesterol pela bile por disfunção hepatocelular secundária.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p>Na síndrome nefrótica, a perda urinária maciça de proteínas reduz a pressão oncótica plasmática e estimula síntese hepática, inclusive de lipoproteínas, contribuindo para hiperlipidemia.</p><p><b>💡 Leve para a prova:</b> hipoalbuminemia nefrótica → resposta hepática compensatória → ↑ lipoproteínas.</p>'},
{id:'sus26-6',number:6,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome nefrótica',caseText:'Mulher, 32 anos, com edema generalizado, hipoalbuminemia grave, hiperlipidemia e proteinúria nefrótica.',prompt:'Identifique as complicações mais provavelmente associadas ao quadro clínico dessa paciente:',alternatives:['Acidose metabólica com ânion gap elevado, hipertensão maligna, encefalopatia hipertensiva.','Hipocalcemia sintomática, anemia hemolítica microangiopática e insuficiência cardíaca.','Glomerulonefrite rapidamente progressiva, síndrome urêmica e hipercalemia grave.','Trombose de veia renal, infecções por germes encapsulados e hiperlipidemia refratária.'],correctIndex:3,resolution:'<h3>🧠 Resolução comentada</h3><p>A síndrome nefrótica favorece hipercoagulabilidade, perda urinária de imunoglobulinas e alterações lipídicas. Isso explica risco trombótico, maior suscetibilidade a infecções e hiperlipidemia.</p><p><b>💡 Leve para a prova:</b> síndrome nefrótica = trombose + infecção + dislipidemia.</p>'},
{id:'sus26-7',number:7,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome torácica aguda',caseText:'Homem, 28 anos, com anemia falciforme e uso irregular de hidroxiureia, apresenta dor torácica pleurítica, febre, tosse e dispneia. SpO₂ 88% em ar ambiente e radiografia mostra novo infiltrado em lobo inferior direito. Hb 7,2 g/dL e leucócitos 18.500/mm³.',prompt:'Identifique a fisiopatologia central envolvida no quadro atual do paciente:',alternatives:['Vaso-oclusão pulmonar por falcização de eritrócitos, infecção bacteriana e embolia gordurosa medular.','Tromboembolismo pulmonar recorrente por estado de hipercoagulabilidade crônica da anemia falciforme.','Lesão pulmonar aguda mediada por citocinas inflamatórias liberadas durante a hemólise intravascular.','Hipertensão pulmonar aguda por aumento súbito da resistência vascular pulmonar durante crise vaso-oclusiva.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>Febre, sintomas respiratórios, hipoxemia e novo infiltrado pulmonar em pessoa com doença falciforme caracterizam síndrome torácica aguda. Sua fisiopatologia é multifatorial, envolvendo vaso-oclusão/falcização, infecção e embolização gordurosa.</p><p><b>💡 Leve para a prova:</b> falciforme + novo infiltrado + sintomas respiratórios = síndrome torácica aguda.</p>'},
{id:'sus26-8',number:8,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Síndrome torácica aguda',caseText:'Homem, 28 anos, com anemia falciforme, febre, dor torácica, dispneia, SpO₂ 88% e novo infiltrado pulmonar.',prompt:'Indique a conduta terapêutica inicial mais adequada para esse quadro:',alternatives:['Hidratação volêmica vigorosa, iniciar ceftriaxone e realizar exsanguineotransfusão total.','Hidratação cautelosa, ceftriaxone e azitromicina, oxigênio suplementar.','Administrar corticoide sistêmico, iniciar levofloxacino e oxigênio suplementar.','Hidratação cautelosa, iniciar heparina não fracionada para anticoagulação plena.'],correctIndex:1,resolution:'<h3>🧠 Resolução comentada</h3><p>Na síndrome torácica aguda, o manejo inicial inclui oxigênio para hipoxemia, analgesia, hidratação cuidadosa e antibióticos cobrindo germes típicos e atípicos. Hidratação excessiva pode piorar o comprometimento pulmonar; anticoagulação não é tratamento de rotina.</p><p><b>⚠️ Atenção:</b> o gabarito desta questão foi retificado para B.</p><p><b>💡 Leve para a prova:</b> STA → O₂ + antibiótico + hidratação cautelosa; transfusão depende da gravidade.</p>'},
{id:'sus26-9',number:9,exam:'SUS-BA 2026',area:'Clínica Médica',topic:'Doença falciforme',caseText:'Após episódio de síndrome torácica aguda em paciente de 28 anos com anemia falciforme e acompanhamento irregular.',prompt:'Identifique as medidas mais indicadas para prevenir novos episódios, semelhantes ao atual, após a alta hospitalar:',alternatives:['Uso regular da hidroxiureia, profilaxia com penicilina benzatina e vacinação contra germes encapsulados.','Esplenectomia eletiva, profilaxia com amoxicilina oral e vacinação contra germes encapsulados.','Anticoagulação com varfarina, transfusões para manter Hb acima de 10 g/dL e profilaxia com amoxicilina.','Transfusões mensais para Hb acima de 10 g/dL, esplenectomia eletiva e profilaxia com penicilina benzatina.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>A alternativa oficial reúne medidas preventivas relacionadas à doença falciforme: adesão à hidroxiureia e prevenção de infecções por germes encapsulados. Esplenectomia e anticoagulação crônica não são estratégias rotineiras para prevenir síndrome torácica aguda.</p><p><b>💡 Leve para a prova:</b> hidroxiureia reduz complicações vaso-oclusivas da doença falciforme.</p>'},
{id:'sus26-10',number:10,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, vítima de espancamento, chega pálido, sudorético, FC 128 bpm, PA 90/58 mmHg, confuso, com extremidades frias, lactato 4,8 mmol/L, glicemia 178 mg/dL, hipotermia e oligúria.',prompt:'Indique o principal hormônio que promove a hiperglicemia durante a fase aguda do trauma:',alternatives:['Insulina.','Cortisol.','Glucagon.','Aldosterona.'],correctIndex:2,resolution:'<h3>🧠 Resolução comentada</h3><p>A resposta aguda ao trauma é contrarregulatória. Entre as alternativas, o glucagon é o principal responsável por elevar rapidamente a glicemia por glicogenólise e gliconeogênese.</p><p><b>💡 Leve para a prova:</b> trauma agudo → hormônios contrarreguladores ↑; glucagon favorece hiperglicemia.</p>'},
{id:'sus26-11',number:11,exam:'SUS-BA 2026',area:'Cirurgia',topic:'Resposta metabólica ao trauma',caseText:'Homem, 22 anos, em fase aguda após trauma com choque e resposta metabólica ao estresse.',prompt:'Indique a alternativa que descreve corretamente as modificações da fase de catabolismo agudo do trauma:',alternatives:['Mobilização de substratos energéticos e balanço nitrogenado negativo.','Predomínio de síntese proteica e armazenamento de energia.','Aumento da secreção de insulina e diminuição do consumo de oxigênio.','Retenção de glicose e formação de corpos cetônicos.'],correctIndex:0,resolution:'<h3>🧠 Resolução comentada</h3><p>A fase catabólica mobiliza reservas para sustentar a resposta ao estresse: aumenta proteólise e disponibilização de substratos, produzindo balanço nitrogenado negativo.</p><p><b>💡 Leve para a prova:</b> catabolismo pós-trauma = mobilização energética + perda proteica.</p>'},

v class=mini style='margin-top:5px'>${s.attempts?s.acc+'% de precisão':'sem revisões ainda'}</div></div>`).join('')||'<div class=panel>Crie sua primeira matéria.</div>'}</div>`}

function toolbar(id){return `<div class=toolbar><button type=button onclick="cmd('${id}','bold')"><b>B</b></button><button type=button onclick="cmd('${id}','italic')"><i>I</i></button><button type=button onclick="cmd('${id}','underline')"><u>U</u></button><button type=button onclick="cmd('${id}','hiliteColor','#ffe08a')">🖍</button><select onchange="fontClass('${id}',this.value)"><option value=''>Fonte</option><option value=serif>Serif</option><option value=scribble>Manuscrita</option><option value=mono>Mono</option></select><label class='btn ghost mini'>📷 imagem<input type=file accept='image/*' hidden onchange="insertImage('${id}',this)"></label></div>`}function editor(id,ph='Escreva aqui…'){return `<div class=editorWrap>${toolbar(id)}<div id='${id}' class='editor rich' contenteditable=true data-placeholder='${ph}'></div></div>`}function cmd(id,c,v=null){document.getElementById(id).focus();document.execCommand(c,false,v)}function fontClass(id,c){let e=document.getElementById(id);e.classList.remove('serif','scribble','mono');if(c)e.classList.add(c)}function insertImage(id,input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let e=document.getElementById(id);e.focus();document.execCommand('insertImage',false,r.result)};r.readAsDataURL(f)}

function toggleDraw(){drawWrap.classList.toggle('hidden');if(!drawWrap.classList.contains('hidden'))setupCanvas()}function setupCanvas(){let c=document.getElementById('draw');if(!c)return;let r=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=r.width*ratio;c.height=220*ratio;let x=c.getContext('2d');x.scale(ratio,ratio);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#7b3157';let on=false,last=null;function p(e){let z=c.getBoundingClientRect(),t=e.touches?.[0]||e;return [t.clientX-z.left,t.clientY-z.top]}c.onpointerdown=e=>{on=true;last=p(e)};c.onpointermove=e=>{if(!on)return;let q=p(e);x.beginPath();x.moveTo(...last);x.lineTo(...q);x.stroke();last=q};c.onpointerup=()=>on=false;c.onpointerleave=()=>on=false}function clearDraw(){let c=draw,x=c.getContext('2d');x.clearRect(0,0,c.width,c.height)}

function rate(id,r,mode){let c=db.cards.find(x=>x.id==id),map={forgot:.25,bad:.5,guess:1,hard:1.7,ok:2.5,easy:4},base=Math.max(1,c.interval||1),days=Math.max(1,Math.round(base*map[r]));if(r==='ok'&&base===1)days=3;if(r==='easy'&&base===1)days=5;c.interval=days;c.due=new Date(Date.now()+days*864e5).toISOString().slice(0,10);let success=['ok','easy'].includes(r);c[success?'ok':'bad']=(c[success?'ok':'bad']||0)+1;c.history.push({date:day(),rating:r});save();idx++;reveal=false;scratchData='';scratchOpen=false;scratchUndo=[];penColor='#7b3157';penWidth=2;if(idx>=study.length)view.innerHTML=`<div class=panel><h2>Sessão concluída ✨</h2><p>Suas respostas já entraram nas métricas e na próxima revisão.</p><div class=row><button class=btn onclick="go('Dashboard')">Dashboard</button>${mode==='subject'?'<button class="btn ghost" onclick="renderSubject()">Voltar à matéria</button>':''}</div></div>`;else renderStudy(mode)}function review(mode){setTimeout(()=>startStudy(mode),0);return `<div class=panel><h2>Preparando revisão…</h2></div>`}

function setupQScratch(){let c=document.getElementById('qScratch');if(!c)return;let r=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=r.width*ratio;c.height=340*ratio;let x=c.getContext('2d');x.scale(ratio,ratio);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#7b3157';let on=false,last;let p=e=>{let z=c.getBoundingClientRect();return[e.clientX-z.left,e.clientY-z.top]};c.onpointerdown=e=>{on=true;last=p(e)};c.onpointermove=e=>{if(!on)return;let q=p(e);x.beginPath();x.moveTo(...last);x.lineTo(...q);x.stroke();last=q;qScratchData=c.toDataURL()};c.onpointerup=()=>{on=false;qScratchData=c.toDataURL()}}

function showQResolution(id){let q=db.questions.find(x=>x.id==id),c=document.getElementById('qScratch');if(c)qScratchData=c.toDataURL();qResolution.innerHTML=`<div class=panel style='margin-top:16px;background:#fff5f9'><h2>Resposta e resolução</h2>${q.type==='multiple'?`<p><b>Gabarito:</b> ${esc(q.correct||'—')}</p>`:''}<div class=rich>${q.resolution||'<span class=muted>Sem resolução cadastrada.</span>'}</div>${qScratchData?`<hr style='border:0;border-top:1px solid var(--line)'><b>Seu rascunho</b><p><img src='${qScratchData}' style='max-width:100%;border:1px solid var(--line);border-radius:14px'></p>`:''}</div>`;qResolution.scrollIntoView({behavior:'smooth'})}
function importChat(){return `<div class=panel><h2>Importar flashcards do ChatGPT</h2><p>Cole vários cartões de uma vez. O FlashMed separa automaticamente pergunta e resposta.</p><select id=impSub class=field>${db.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select><div class=importBox><b>Formato recomendado</b><pre>P: Qual é o critério...?\nR: ...\n---\nP: Próxima pergunta\nR: Próxima resposta</pre></div><textarea id=bulk class=field rows=14 placeholder='Cole aqui os flashcards gerados pelo ChatGPT…'></textarea><div class=row><button class=btn onclick=parseBulk()>Visualizar e importar</button><button class='btn ghost' onclick=copyPrompt()>Copiar modelo de pedido ao ChatGPT</button></div><div id=preview></div></div>`}function parseBulk(){let raw=bulk.value.trim(),parts=raw.split(/\n\s*---+\s*\n/),cards=[];parts.forEach(p=>{let m=p.match(/(?:^|\n)\s*(?:P|Pergunta|Frente)\s*:\s*([\s\S]*?)(?:\n\s*(?:R|Resposta|Verso)\s*:\s*)([\s\S]*)/i);if(m)cards.push({front:m[1].trim(),back:m[2].trim()})});if(!cards.length)return toast('Não encontrei cartões no formato P:/R:');preview.innerHTML=`<div class=qbox><b>${cards.length} cartões encontrados</b>${cards.slice(0,5).map(c=>`<p><b>P:</b> ${esc(c.front)}<br><b>R:</b> ${esc(c.back)}</p>`).join('')}<button class=btn id=confirmImport>Importar ${cards.length}</button></div>`;confirmImport.onclick=()=>{cards.forEach((c,i)=>db.cards.push({id:Date.now()+i,subject:impSub.value,front:esc(c.front),back:esc(c.back),media:'',tags:'importado do ChatGPT',ok:0,bad:0,interval:0,due:day(),history:[]}));save();toast(cards.length+' flashcards importados');go('Matérias')}}function copyPrompt(){let t='Crie meus flashcards no formato exato abaixo, sem numeração e separando cada cartão por ---\\nP: pergunta curta\\nR: resposta objetiva\\n---\\nP: próxima pergunta\\nR: próxima resposta';navigator.clipboard?.writeText(t);toast('Modelo copiado')}
function metrics(){let s=stats(),subs=subjStats(),days=[...Array(7)].map((_,i)=>{let d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return {d,m:db.sessions.filter(x=>x.date==d).reduce((a,x)=>a+x.minutes,0)}}),mx=Math.max(1,...days.map(x=>x.m)),ratings={forgot:0,bad:0,guess:0,hard:0,ok:0,easy:0};db.cards.forEach(c=>(c.history||[]).forEach(h=>ratings[h.rating]=(ratings[h.rating]||0)+1));let weakest=subs.filter(x=>x.attempts).sort((a,b)=>a.acc-b.acc).slice(0,3);return `<div class=grid><div class=kpi><span class=muted>Respostas</span><b>${s.total}</b></div><div class=kpi><span class=muted>Acertos</span><b>${s.ok}</b></div><div class=kpi><span class=muted>Erros/dificuldade</span><b>${s.bad}</b></div><div class=kpi><span class=muted>Tempo estudado</span><b>${(mins()/60).toFixed(1)}h</b></div></div><div class=cols><div class=panel><h2>Tempo — últimos 7 dias</h2><div class=chart>${days.map(x=>`<i style='height:${x.m/mx*100}%'><span>${x.d.slice(5)}</span></i>`).join('')}</div></div><div class=panel><h2>Diagnóstico de estudo</h2>${weakest.length?weakest.map((x,i)=>`<p><b>${i+1}. ${esc(x.x)}</b> — ${x.acc}% <span class=muted>(${x.b} respostas frágeis)</span></p>`).join(''):'<p class=muted>Faça algumas revisões para eu calcular seus déficits.</p>'}<p class=muted>${weakest[0]?`Priorize ${esc(weakest[0].x)} e os cartões marcados como “esqueci”, “errei” ou “chutei”.`:''}</p></div></div><div class=cols style='margin-top:16px'><div class=panel><h2>Desempenho por matéria</h2><table class=metricTable><tr><th>Matéria</th><th>Cartões</th><th>Pendentes</th><th>Precisão</th></tr>${subs.map(x=>`<tr><td>${esc(x.x)}</td><td>${x.cards}</td><td>${x.due}</td><td>${x.attempts?x.acc+'%':'—'}</td></tr>`).join('')}</table></div><div class=panel><h2>Como você respondeu</h2><p>Esqueci: <b>${ratings.forgot}</b> • Errei: <b>${ratings.bad}</b></p><p>Chutei: <b>${ratings.guess}</b> • Difícil: <b>${ratings.hard}</b></p><p>Acertei: <b>${ratings.ok}</b> • Muito fácil: <b>${ratings.easy}</b></p></div></div>`}
function timerView(){let t=timer.elapsed+(timer.on?(Date.now()-timer.start):0);return `<div class=panel style='text-align:center'><h2>Tempo de estudo</h2><div class=timer id=timerText>${fmt(t)}</div><select id=timerSub class=field style='max-width:350px' onchange='timer.subject=this.value'><option>Geral</option>${db.subjects.map(s=>`<option ${timer.subject==s?'selected':''}>${esc(s)}</option>`).join('')}</select><div class=row style='justify-content:center'><button class=btn onclick=toggleTimer()>${timer.on?'Pausar':'Iniciar'}</button><button class='btn ghost' onclick=finishTimer()>Finalizar e salvar</button></div></div>`}function fmt(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':')}function toggleTimer(){if(timer.on){timer.elapsed+=Date.now()-timer.start;timer.on=false}else{timer.start=Date.now();timer.on=true}render()}function finishTimer(){let ms=timer.elapsed+(timer.on?(Date.now()-timer.start):0),m=Math.max(1,Math.round(ms/60000));db.sessions.push({date:day(),minutes:m,subject:timer.subject});timer={on:false,start:0,elapsed:0,subject:'Geral'};save();render();toast(`${m} min salvos`)}
function reminders(){return `<div class=panel><h2>Lembretes</h2><div class=row><input id=rt type=datetime-local class=field style='max-width:260px'><input id=rx class=field placeholder='Ex.: Revisar HELLP' style='max-width:420px'><button class=btn onclick=addR()>Adicionar</button></div>${db.reminders.map((r,i)=>`<div class=qbox><b>${new Date(r.when).toLocaleString('pt-BR')}</b><p>${esc(r.text)}</p><button class='btn ghost' onclick='db.reminders.splice(${i},1);save();render()'>Excluir</button></div>`).join('')||'<p class=muted>Nenhum lembrete.</p>'}<p class=muted>Alertas do navegador dependem da página estar aberta. Em uma versão hospedada como PWA, notificações podem ser ampliadas.</p></div>`}function addR(){if(rt.value&&rx.value){db.reminders.push({when:rt.value,text:rx.value});save();render()}}
function cloudView(){return `<div class="cols"><div class="panel"><h2>☁ Conta & sincronização</h2><p><b>Supabase conectado.</b> Seus dados ficam associados ao seu usuário.</p><div class="row"><button class="btn" onclick="syncDown()">Sincronizar agora</button><button class="btn ghost" onclick="logoutFlashMed()">Sair da conta</button></div><p class="muted">As alterações são salvas neste aparelho e sincronizadas automaticamente com sua conta.</p></div><div class="panel"><h2>Backup manual</h2><div class="row"><button class="btn" onclick="exportDB()">Exportar JSON</button><label class="btn ghost">Importar JSON<input type="file" accept=".json" hidden onchange="importDB(this)"></label></div><h3>Status</h3><p>🟢 Conta conectada e sincronização ativa</p></div></div>`}

async function syncUp(){
  if(!cloud||!currentUser)return;
  try{
    const q=await cloud.from('profiles').select('settings').eq('user_id',currentUser.id).single();
    if(q.error)throw q.error;
    const settings=Object.assign({},q.data?.settings||{},{flashmed_data:db});
    const u=await cloud.from('profiles').update({settings,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);
    if(u.error)throw u.error;
    cloudDot.classList.add('ok'); saveState.textContent='salvo na nuvem';
  }catch(e){cloudDot.classList.remove('ok');saveState.textContent='erro na nuvem';console.error(e)}
}
async function syncDown(quiet=false){
  if(!cloud||!currentUser)return;
  try{
    const q=await cloud.from('profiles').select('settings').eq('user_id',currentUser.id).single();
    if(q.error)throw q.error;
    const remote=q.data?.settings?.flashmed_data;
    if(remote){
      // After authentication, Supabase is the source of truth. This is essential
      // on a new/incognito browser, whose freshly-created local DB may have a
      // newer timestamp but contains no user data.
      db=remote;
      // Keep built-in official question-bank content when the user's cloud data
      // predates a new app release. User data remains the source of truth for
      // personal content; only missing official seeded questions are merged in.
      db.bankQuestions=db.bankQuestions||[];
      db.bankAttempts=db.bankAttempts||[];
      db.bankAnnotations=db.bankAnnotations||{};
      let addedOfficial=false;
      for(const item of SUS26_1){
        if(!db.bankQuestions.some(x=>x.id===item.id)){db.bankQuestions.push(item);addedOfficial=true}
      }
      localStorage.setItem(KEY,JSON.stringify(db));
      if(addedOfficial) await syncUp();
      render();
    } else {
      await syncUp();
    }
    cloudDot.classList.add('ok');saveState.textContent='nuvem sincronizada';if(!quiet)toast('Sincronizado ♡');
  }catch(e){console.error(e);cloudDot.classList.remove('ok');if(!quiet)toast('Não foi possível sincronizar')}
}
async function logoutFlashMed(){await cloud.auth.signOut();location.reload()}
function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='flashmed-larissa-backup.json';a.click()}function importDB(i){let f=i.files[0],r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('Backup importado')}catch{toast('Arquivo inválido')}};r.readAsText(f)}
function render(){title.textContent=route;date.textContent=now().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});view.innerHTML=route==='Dashboard'?dashboard():route==='Matérias'?subjects():route==='Adicionar flashcard'?addCardView():route==='Revisão'?review('due'):route==='Aleatório'?review('random'):route==='Banco de Questões'?bankView():route==='Questões erradas'?questions():route==='Importar do ChatGPT'?importChat():route==='Métricas'?metrics():route==='Cronômetro'?timerView():route==='Lembretes'?reminders():cloudView()}
setInterval(()=>{clock.textContent=now().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(route==='Cronômetro'&&timer.on){let e=document.querySelector('#timerText');if(e)e.textContent=fmt(timer.elapsed+Date.now()-timer.start)}db.reminders.forEach(r=>{if(!r.done&&new Date(r.when)<=now()){r.done=true;save();alert('⏰ '+r.text)}})},1000);renderNav();render();
let currentUser=null;async function bootAuth(){cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let z=await cloud.auth.getSession(),session=z.data.session;if(session&&session.user){currentUser=session.user;authGate.classList.add('hidden');appRoot.classList.remove('authHidden');cloudDot.classList.add('ok');await syncDown(true);renderNav();render()}else{authGate.classList.remove('hidden');appRoot.classList.add('authHidden')}} loginBtn.onclick=async function(){authError.textContent='';loginBtn.disabled=true;loginBtn.textContent='Entrando…';let z=await cloud.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});loginBtn.disabled=false;loginBtn.textContent='Entrar';if(z.error){authError.textContent='E-mail ou senha incorretos.';return}currentUser=z.data.user;authGate.classList.add('hidden');appRoot.classList.remove('authHidden');cloudDot.classList.add('ok');await syncDown(true);renderNav();render()};bootAuth();
</script></body></html>
